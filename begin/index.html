<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road tour — Atelier SprintDesk avec Copilot (parcours débutant)</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#d9dfec;
    --blue:#2563eb; --blue-l:#dbeafe; --green:#16a34a; --green-l:#dcfce7;
    --amber:#d97706; --amber-l:#fef3c7; --violet:#7c3aed; --red:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
  header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1;min-width:220px}
  header label{font-size:14px;display:flex;align-items:center;gap:6px}
  header select,header button{font:inherit;font-size:14px;min-height:38px;padding:5px 10px;border-radius:6px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}
  .prog{flex:1;min-width:200px;max-width:340px}
  .prog small{display:block;font-size:12px;color:#cbd5e1}
  .bar{height:8px;background:#334155;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);width:0;transition:width .3s}
  .layout{display:grid;grid-template-columns:290px 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:24px 20px 80px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
  /* road */
  nav.road{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
  @media(max-width:860px){nav.road{position:static;max-height:none}}
  .road ol{list-style:none;margin:0;padding:0;position:relative}
  .road ol:before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:4px;background:repeating-linear-gradient(#94a3b8 0 10px,transparent 10px 18px);border-radius:2px}
  .stop{position:relative;display:flex;gap:12px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer;min-height:52px}
  .stop:hover{background:#e8edf8}
  .stop.cur{background:var(--blue-l)}
  .dot{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #94a3b8;display:grid;place-items:center;font-size:16px;z-index:1}
  .stop.cur .dot{border-color:var(--blue);box-shadow:0 0 0 4px #bfdbfe}
  .stop.done .dot{border-color:var(--green);background:var(--green-l)}
  .stop b{display:block;font-size:14px;line-height:1.25}
  .stop small{color:var(--muted);font-size:12px}
  /* main */
  main h2{margin:0 0 4px;font-size:26px}
  .goal{color:var(--muted);margin:0 0 18px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
  .step.open{border-color:var(--blue);box-shadow:0 4px 18px rgba(37,99,235,.12)}
  .step.done{border-left:6px solid var(--green)}
  .sh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  .step.done .num{background:var(--green)}
  .sh h3{margin:0;font-size:17px;flex:1}
  .tag{font-size:12px;color:var(--green);font-weight:600}
  .sb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
  .step.open .sb{grid-template-rows:1fr}
  .sb>.in{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .45s}
  .step.open .sb>.in{visibility:visible;transition-delay:0s}
  .pad{padding:0 18px 18px;border-top:1px solid var(--line);min-width:0}
  .step{scroll-margin-top:80px;transition:border-color .3s,box-shadow .3s}
  .ht{flex:1;min-width:0}
  .sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step.open .sub{display:none}
  .chev{color:var(--muted);transition:transform .3s}
  .step.open .chev{transform:rotate(180deg)}
  .obj,.goalbox{display:flex;gap:14px;align-items:center;border-radius:14px;color:#fff;position:relative;overflow:hidden;min-width:0}
  .obj{margin:16px 0 6px;padding:14px 18px;background:linear-gradient(120deg,#2563eb,#7c3aed);box-shadow:0 6px 18px rgba(37,99,235,.3)}
  .goalbox{margin:6px 0 20px;padding:16px 20px;background:linear-gradient(120deg,#0f172a,#1d4ed8)}
  .obj .oi,.goalbox .oi{font-size:32px;animation:bob 2.4s ease-in-out infinite}
  .obj small,.goalbox small{display:block;font-size:11px;letter-spacing:.14em;font-weight:700;opacity:.85}
  .obj strong{font-size:17px;line-height:1.35}
  .goalbox strong{font-size:18px;line-height:1.4;font-weight:600}
  .obj:after,.goalbox:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4s ease-in-out infinite}
  .more{margin-top:18px;border:1px solid #c7d2fe;border-radius:12px;background:#f5f7ff}
  .more summary{cursor:pointer;padding:10px 14px;font-weight:700;color:#3730a3;list-style:none}
  .more summary::-webkit-details-marker{display:none}
  .more summary:before{content:"▸ ";display:inline-block;transition:transform .2s}
  .more[open] summary:before{transform:rotate(90deg)}
  .mb{padding:0 14px 12px;animation:rise .3s both}
  .mb a{color:var(--blue)}
  .mb ul{margin:6px 0}
  .chk input:checked+span{color:#166534;font-weight:600}
  main.enter .step,main.enter h2,main.enter .goalbox{animation:rise .5s both;animation-delay:calc(var(--i,0)*70ms)}
  .num.pop{animation:pop .7s}
  .step.celebrate{animation:flash 1.1s}
  .btn.pulse{animation:pulse 1.2s infinite}
  .stop.just .dot{animation:pop .7s}
  .confetti{position:fixed;z-index:200;width:9px;height:14px;border-radius:2px;pointer-events:none}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:210;background:#14532d;color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toast 2.6s both}
  .toast.big{background:linear-gradient(120deg,#7c3aed,#2563eb);font-size:18px}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.6) rotate(-10deg)}70%{transform:scale(.9)}100%{transform:scale(1)}}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(22,163,74,.7)}100%{box-shadow:0 0 0 26px rgba(22,163,74,0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(37,99,235,.25)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,30px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
  .prog .bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
  /* visite guidée */
  #tour-ov{position:fixed;inset:0;z-index:100}
  #tour-ov.dim{background:rgba(15,23,42,.72)}
  #tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(15,23,42,.72),0 0 0 3px #fbbf24;transition:all .35s ease;pointer-events:none}
  #tour-tip{position:fixed;width:340px;max-width:calc(100vw - 24px);background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 16px 50px rgba(0,0,0,.4);animation:rise .35s both;z-index:101}
  #tour-tip h4{margin:0 0 6px;font-size:17px}
  #tour-tip p{margin:0 0 12px;font-size:14.5px}
  .tdots{display:flex;gap:5px;margin-bottom:10px}
  .tdots i{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
  .tdots i.on{background:var(--blue);transform:scale(1.3)}
  .tbtn{display:flex;gap:8px;align-items:center}
  .tbtn .skip{margin-right:auto;background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .sb p,.sb li{margin:10px 0}
  .sb ol,.sb ul{padding-left:22px}
  code{background:#eef1f8;border-radius:5px;padding:1px 6px;font:13.5px Consolas,monospace}
  kbd{background:#fff;border:1px solid #b8c0d4;border-bottom-width:3px;border-radius:5px;padding:0 6px;font:13px Consolas,monospace}
  .co{border-radius:10px;padding:10px 14px;margin:12px 0}
  .co b.l{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .see{background:var(--green-l);border-left:5px solid var(--green)}
  .warn{background:var(--amber-l);border-left:5px solid var(--amber)}
  .why{background:var(--blue-l);border-left:5px solid var(--blue)}
  .no{background:#fee2e2;border-left:5px solid var(--red)}
  .co p{margin:4px 0}
  .copy{margin:14px 0;border:2px dashed var(--violet);border-radius:12px;overflow:hidden;background:#faf8ff}
  .copy .ct{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#ede9fe;font-weight:600;font-size:14px;color:#5b21b6}
  .copy button{font:inherit;font-size:13px;padding:5px 12px;border:0;border-radius:6px;background:var(--violet);color:#fff;cursor:pointer}
  .copy button.ok{background:var(--green)}
  .copy pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;font:13.5px/1.5 Consolas,monospace;max-height:420px;overflow:auto}
  table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14.5px}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:#eef2fb}
  .chk label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
  .chk input{margin-top:5px;width:18px;height:18px}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{font:inherit;padding:9px 18px;border-radius:9px;border:0;cursor:pointer;font-weight:600}
  .btn.p{background:var(--green);color:#fff}
  .btn.s{background:#e5e7eb;color:var(--ink)}
  .btn.b{background:var(--blue);color:#fff}
  .end{margin:28px 0;text-align:center}
  .mock{font-family:Consolas,monospace;font-size:13px;white-space:pre;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;overflow:auto}
  .copy pre,.mock{overflow-wrap:break-word}
  button,a,input,select{touch-action:manipulation}
  @media(max-width:600px){
    body{font-size:15px}
    header{padding:10px 12px;gap:8px;align-items:stretch}
    header h1{flex:1 0 100%;min-width:0;font-size:16px;line-height:1.25}
    header label{flex:1;min-width:0;font-size:13px}
    header select{width:100%;min-width:0}
    header button{flex:1;font-size:12px;padding:5px 7px;white-space:nowrap}
    .prog{order:5;flex:1 0 100%;min-width:0;max-width:none}
    .prog small{font-size:11px}
    .layout{display:block;padding:12px 12px 56px}
    nav.road{margin:0 -12px 18px;padding:0 12px;overflow:visible}
    .road ol{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin}
    .road ol:before{display:none}
    .stop{flex:0 0 142px;display:block;padding:8px;border:1px solid var(--line);background:var(--card);scroll-snap-align:start;min-height:82px}
    .stop.cur{border-color:var(--blue);box-shadow:0 3px 10px rgba(37,99,235,.12)}
    .dot{width:28px;height:28px;border-width:2px;font-size:13px;margin-bottom:5px}
    .stop.cur .dot{box-shadow:0 0 0 3px #bfdbfe}
    .stop b{font-size:12px;line-height:1.2}
    .stop small{display:block;font-size:11px;line-height:1.25;margin-top:3px}
    main h2{font-size:22px;line-height:1.25}
    .goalbox{align-items:flex-start;gap:10px;margin:8px 0 14px;padding:13px 14px}
    .goalbox .oi{font-size:25px}
    .goalbox strong{font-size:15px;line-height:1.35}
    .step{margin:10px 0;border-radius:12px}
    .step.done{border-left-width:4px}
    .sh{gap:9px;padding:12px 11px;min-height:58px}
    .num{width:29px;height:29px;font-size:13px}
    .sh h3{font-size:15px;line-height:1.3}
    .sub{font-size:11px}
    .tag{font-size:11px}
    .chev{font-size:18px}
    .pad{padding:0 12px 14px}
    .obj{align-items:flex-start;gap:10px;margin:12px 0 5px;padding:12px 13px}
    .obj .oi{font-size:25px}
    .obj strong{font-size:15px}
    .co{padding:9px 11px;margin:10px 0}
    .co p{margin:3px 0}
    .copy{margin:12px 0}
    .copy .ct{align-items:flex-start;padding:8px 9px;font-size:12px}
    .copy .ct span{min-width:0;overflow-wrap:anywhere}
    .copy button{flex:none;min-height:34px;padding:5px 9px}
    table{display:block;max-width:100%;overflow-x:auto;white-space:normal;-webkit-overflow-scrolling:touch;font-size:13px}
    th,td{min-width:120px;padding:7px 8px}
    .actions{display:grid;gap:8px;margin-top:14px}
    .btn{width:100%;min-height:44px;padding:9px 12px}
    .end{margin:20px 0}
    #tour-tip{width:calc(100vw - 24px);padding:14px;max-height:calc(100vh - 24px);overflow:auto}
    #tour-tip h4{font-size:16px}
    #tour-tip p{font-size:14px}
    .tbtn{flex-wrap:wrap}
    .tbtn .skip{flex:1 0 100%;text-align:left;margin-bottom:2px}
    .tbtn .btn{width:auto;flex:1}
  }
</style>
</head>
<body>
<header>
  <h1>🛣️ Road tour — Atelier SprintDesk avec Copilot</h1>
  <label>Mon lot :
    <select id="lot">
      <option value="1">Lot 1 (US-101 à 105)</option>
      <option value="2">Lot 2 (US-201 à 205)</option>
      <option value="3">Lot 3 (US-301 à 305)</option>
      <option value="4">Lot 4 (US-401 à 405)</option>
    </select>
  </label>
  <div class="prog"><small id="ptxt"></small><div class="bar"><i id="pbar"></i></div></div>
  <button id="tourbtn" title="Revoir la visite guidée">❓ Visite guidée</button>
  <button id="reset" title="Effacer ma progression">↺ Recommencer</button>
</header>
<div class="layout">
  <nav class="road"><ol id="road"></ol></nav>
  <main id="main"></main>
</div>

<script>
/* Balises : {n} = numéro du lot ; ¤ = apostrophe inversée (backtick) dans les textes à copier */
const STAGES = [
/* ====================================================== 0 */
{icon:"🚪",title:"Démarrer",sub:"Prise en main de VS Code",
 goal:"À la fin de cette étape : vous savez ouvrir le projet, lire un fichier, parler à Copilot et annuler ce qu'il fait.",
 steps:[
 {t:"Ouvrir le dossier du projet",b:[
  {t:"ol",x:[
   "Lancez <b>Visual Studio Code</b> (icône bleue).",
   "Menu du haut : cliquez sur <code>Fichier</code> (<code>File</code>) puis <code>Ouvrir le dossier...</code> (<code>Open Folder...</code>).",
   "Choisissez le dossier <code>formation-harness</code> fourni par l'animateur, puis <code>Sélectionner un dossier</code>.",
   "Si une fenêtre demande « Faites-vous confiance aux auteurs ? », cliquez <code>Oui, je fais confiance aux auteurs</code>."]},
  {t:"see",x:"À gauche, une liste de dossiers : <code>begin</code>, <code>docs</code>, <code>sprintdesk</code>... Elle s'appelle l'<b>Explorateur</b>."},
  {t:"warn",x:"Liste absente ? Appuyez sur <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>E</kbd>."},
  {t:"why",x:"VS Code travaille sur un <b>dossier</b>. Copilot ne voit que les fichiers de ce dossier : si vous ouvrez un seul fichier, il ne trouvera pas vos règles métier."}]},
 {t:"Ouvrir et lire un fichier",b:[
  {t:"ol",x:[
   "Dans l'explorateur, cliquez sur la flèche à gauche de <code>sprintdesk</code> pour le déplier.",
   "Dépliez <code>contexte</code>, puis cliquez <b>une fois</b> sur <code>produit.md</code>.",
   "Pour une lecture agréable, appuyez sur <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>V</kbd> : un aperçu mis en forme s'ouvre.",
   "Faites de même avec <code>regles-metier.md</code>."]},
  {t:"see",x:"Le titre « Contexte produit — SprintDesk chez HabiOuest » et un tableau des utilisateurs."},
  {t:"why",x:"Les fichiers <code>.md</code> (Markdown) sont du texte simple lisible par vous <b>et</b> par Copilot. Tout ce que vous allez créer est un fichier <code>.md</code>."},
  {t:"p",x:"<b>À retenir absolument :</b> <code>RM-xx</code> = règle <b>validée</b>. <code>ND-xx</code> = décision <b>non prise</b>, interdit de la deviner."}]},
 {t:"Ouvrir Copilot Chat",b:[
  {t:"ol",x:[
   "Appuyez sur <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>I</kbd> : le chat s'ouvre à droite.",
   "Sinon, cliquez sur l'icône Copilot en haut de la fenêtre, à côté de la barre de recherche centrale.",
   "Si on vous demande de vous connecter : <code>Se connecter avec GitHub</code>, suivez le navigateur, puis revenez dans VS Code."]},
  {t:"see",x:"Un panneau avec une zone de saisie en bas (texte grisé du type « Ask Copilot »)."}]},
 {t:"Repérer les boutons du chat",b:[
  {t:"table",h:["Élément","Où","À quoi il sert"],r:[
   ["<b>Sélecteur de mode</b>","En bas à gauche de la zone de saisie (affiche <code>Agent</code>, <code>Ask</code> ou <code>Plan</code>)","Choisit <b>comment</b> Copilot travaille"],
   ["<b>Sélecteur de modèle</b>","À côté du mode","Laissez le choix par défaut"],
   ["<b>Envoyer</b>","En bas à droite (flèche)","<kbd>Entrée</kbd> fait pareil"],
   ["<b>Nouveau chat</b>","Bouton <code>+</code> en haut du chat","Repart d'une conversation vierge"]]},
  {t:"p",x:"Pour aller à la ligne sans envoyer : <kbd>Maj</kbd>+<kbd>Entrée</kbd>."},
  {t:"table",h:["Mode","Modifie vos fichiers ?","Quand"],r:[["<b>Ask</b>","Non","Explorer sans risque (étape « Premiers prompts »)"],["<b>Plan</b>","Non","Atelier 1, partie B"],["<b>Agent</b>","<b>Oui</b>","Ateliers 2 et 3"]]},
  {t:"no",x:"Tant que le guide ne dit pas « passez en Agent », restez en <b>Ask</b>."}]},
 {t:"Votre premier message",b:[
  {t:"ol",x:["Dans le sélecteur de mode, choisissez <code>Ask</code>.","Cliquez dans la zone de saisie, collez le texte ci-dessous, puis <kbd>Entrée</kbd>."]},
  {t:"copy",l:"À COPIER dans le chat",x:"Bonjour ! Réponds uniquement par la phrase : \"Copilot est prêt.\""},
  {t:"see",x:"« Copilot est prêt. » en quelques secondes."},
  {t:"warn",x:"Erreur d'accès ? Vérifiez votre connexion (étape précédente). Sinon prévenez l'animateur : la licence Copilot manque peut-être."}]},
 {t:"Donner un fichier à Copilot avec #",b:[
  {t:"p",x:"Copilot ne lit pas tout seul tous vos fichiers. Pour lui en montrer un :"},
  {t:"ol",x:[
   "Dans la zone de saisie, tapez <kbd>#</kbd> : une liste de fichiers apparaît.",
   "Tapez le début du nom (<code>produit</code>), sélectionnez <code>produit.md</code> avec les flèches puis <kbd>Entrée</kbd> : une pastille apparaît.",
   "Complétez la phrase, par exemple : « D'après [pastille produit.md], quels sont les 4 rôles d'utilisateurs de SprintDesk ? »"]},
  {t:"see",x:"Demandeur, Qualificateur, Traitant, Manager."},
  {t:"why",x:"Citer un fichier avec <code>#</code> est plus sûr que de compter sur le fichier ouvert au centre."}]},
 {t:"Accepter ou annuler ce que Copilot modifie",b:[
  {t:"p",x:"Quand Copilot modifie un fichier (mode Agent), vous voyez les fichiers concernés dans le chat, du texte vert (ajouté) et rouge (supprimé), et des boutons <code>Conserver</code> / <code>Annuler</code> (<code>Keep</code> / <code>Undo</code>)."},
  {t:"table",h:["Je veux...","Je fais..."],r:[["Accepter","Bouton <code>Conserver</code>"],["Tout refuser","Bouton <code>Annuler</code>"],["Annuler ma propre frappe","<kbd>Ctrl</kbd>+<kbd>Z</kbd>"],["Enregistrer un fichier","<kbd>Ctrl</kbd>+<kbd>S</kbd> (le point <code>●</code> de l'onglet disparaît)"]]},
  {t:"no",x:"Relisez <b>avant</b> de cliquer sur <code>Conserver</code>."},
  {t:"p",x:"<b>Exercice guidé : modifier le README en mode Agent.</b> Vous allez laisser Copilot ajouter votre nom et la date, puis relire sa modification."},
  {t:"ol",x:["Ouvrez <code>README.MD</code> (à la racine) pour voir son contenu actuel.","Dans le chat, passez en mode <code>Agent</code> (sélecteur de mode, en bas du chat).","Ouvrez une conversation neuve (<code>+</code>) et envoyez le prompt ci-dessous, en remplaçant le nom et la date.","Regardez le fichier : les lignes ajoutées sont en <b>vert</b>, les lignes retirées en <b>rouge</b>.","Relisez avec la grille ci-dessous, puis cliquez sur <code>Conserver</code> ou <code>Annuler</code>."]},
  {t:"copy",l:"Prompt — ajouter nom et date dans le README",x:"Dans #file:README.MD, ajoute à la toute fin du fichier une section « Participant » contenant deux lignes : « Nom Prénom : DUPONT Marie » et « Date : 27/10/2026 ». Ne modifie rien d'autre dans le fichier."},
  {t:"see",x:"Seules deux lignes (plus le titre de la section) apparaissent en vert à la fin du fichier. Aucune ligne rouge. Le reste du README n'a pas bougé."},
  {t:"table",h:["Question à se poser en relisant","Si la réponse est non"],r:[["Seul ce que j'ai demandé est modifié ?","<code>Annuler</code>, puis redemandez en répétant « ne modifie rien d'autre »"],["Y a-t-il du rouge (texte supprimé) que je n'attendais pas ?","<code>Annuler</code> : c'est le signe d'une modification non demandée"],["Mon nom et la date sont-ils exacts ?","Corrigez à la main ou critiquez : « la date est 27/10/2026 »"],["Copilot a-t-il touché d'autres fichiers ?","Regardez la liste des fichiers dans le chat ; <code>Annuler</code> si oui"],["Le texte ajouté est-il au bon endroit ?","Critiquez : « déplace la section en haut »"]]},
  {t:"warn",x:"Si le mode <code>Agent</code> modifie plus que prévu, cliquez sur <code>Annuler</code>. Vos fichiers reviennent à l'état d'avant. Rien n'est perdu."},
  {t:"p",x:"<b>Autres exemples à essayer</b> (même démarche : demander, relire le vert et le rouge, décider). Faites chaque essai dans une conversation neuve, puis annulez si vous ne voulez pas garder le résultat."},
  {t:"table",h:["Type de modification","Prompt à copier","Ce que vous devez voir"],r:[
   ["<b>Ajout</b> (que du vert)","Dans #file:README.MD, ajoute une ligne « Relecteur : [mon nom] » juste sous le titre. Ne modifie rien d'autre.","Une seule ligne verte sous le titre"],
   ["<b>Remplacement</b> (rouge puis vert)","Dans #file:README.MD, remplace « Date : 27/10/2026 » par « Date : 28/10/2026 ». Ne modifie rien d'autre.","Une ligne rouge (ancienne date) et une ligne verte (nouvelle date)"],
   ["<b>Suppression</b> (que du rouge)","Dans #file:README.MD, supprime la section « Participant » ajoutée tout à l'heure. Ne modifie rien d'autre.","Plusieurs lignes rouges, aucune verte"],
   ["<b>Reformulation</b> (plusieurs lignes en rouge et vert)","Dans #file:README.MD, reformule la première phrase de description pour qu'elle tienne en 15 mots maximum. Garde le sens.","Une phrase remplacée par une version plus courte : vérifiez que le sens est identique"],
   ["<b>Plusieurs fichiers</b>","Crée un fichier sprintdesk/resultats/notes-personnelles.md contenant mon nom, la date du jour et 3 lignes « À faire ». Ne touche à aucun autre fichier.","Un nouveau fichier, tout en vert. Le chat liste un seul fichier"],
   ["<b>Test du piège</b> (demande trop large)","Dans #file:README.MD, améliore le texte.","Beaucoup de modifications que vous n'avez pas demandées : <code>Annuler</code>, puis reformulez avec un périmètre précis"]]},
  {t:"why",x:"Plus la demande est précise (<b>où</b>, <b>quoi</b>, « ne modifie rien d'autre »), plus la modification est courte et facile à relire. Une demande vague produit un gros diff difficile à contrôler : c'est le premier réflexe de sécurité à prendre avec le mode <code>Agent</code>."},
  {t:"check",id:"c0",x:["Dossier <code>formation-harness</code> ouvert","J'ai lu <code>produit.md</code> et <code>regles-metier.md</code>","Copilot m'a répondu « Copilot est prêt. »","Je sais citer un fichier avec <code>#</code>","Je sais où sont <code>Conserver</code> / <code>Annuler</code> et <kbd>Ctrl</kbd>+<kbd>S</kbd>"]}]}
 ]},
/* ====================================================== 1 */
{icon:"💬",title:"Premiers prompts",sub:"Parler à Copilot sans risque",
 goal:"Mode Ask uniquement : Copilot répond, ne modifie rien. Vous voyez pourquoi un prompt vague est dangereux et comment en écrire un bon.",
 steps:[
 {t:"Lire les 5 US de votre lot",b:[
  {t:"ol",x:["Explorateur : <code>sprintdesk</code> > <code>backlog</code> > <code>entree</code> > <code>lot{n}</code>.","Ouvrez les 5 fichiers un par un (aperçu : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>V</kbd>).","Pour chacune, notez en une phrase : est-elle claire ? complète ?"]},
  {t:"table",h:["Type de défaut","Signification"],r:[["US <b>vague</b>","On ne sait pas quoi construire"],["US <b>trop volumineuse</b>","Plusieurs besoins en une seule US"],["US <b>contradictoire</b>","Contredit une règle validée (<code>RM-xx</code>)"],["US <b>sans critères</b>","Impossible de vérifier qu'elle est terminée"],["US <b>déjà correcte</b>","À ne surtout pas modifier"]]},
  {t:"why",x:"Chaque lot contient exactement ces 5 cas. Il n'y a pas de bonne réponse à cette étape : vous formez votre propre avis, que Copilot va ensuite confronter."}]},
 {t:"Le mauvais prompt (pour voir le problème)",b:[
  {t:"p",x:"Ouvrez un <b>nouveau chat</b> (<code>+</code>), mode <code>Ask</code>. Tapez ce texte en remplaçant le dernier mot par la pastille du fichier (<kbd>#</kbd> puis <code>US-{n}01.md</code>)."},
  {t:"copy",l:"À COPIER (puis ajouter #US-{n}01.md)",x:"Améliore"},
  {t:"p",x:"Lisez la réponse et posez-vous :"},
  {t:"ul",x:["Copilot a-t-il ajouté des champs (nom, téléphone, pièce jointe...) ? <b>Qui les a décidés ?</b>","Vous a-t-il posé une question ? Non : il a <b>deviné</b>.","A-t-il cité des règles <code>RM-xx</code> ? Probablement pas."]},
  {t:"why",x:"Sans cadre, Copilot comble les vides avec des idées plausibles. Dans un vrai projet, ces idées deviennent des « règles » que personne n'a validées. C'est le risque que tout l'atelier combat."}]},
 {t:"Le bon prompt en 6 blocs",b:[
  {t:"table",h:["Bloc","Question","Exemple"],r:[["Contexte","Sur quoi on travaille ?","Projet SprintDesk, lot {n}"],["Sources","Que doit-il lire ?","Fichiers cités avec <code>#</code>"],["Interdits","Que ne doit-il pas faire ?","Ne réécris pas, n'invente rien"],["Tâche","Que produire ?","Dire si l'US est exploitable"],["Exigences","Quelles garanties ?","Citer RM/ND, poser des questions"],["Format","Sous quelle forme ?","Un tableau"]]},
  {t:"p",x:"Nouveau chat (<code>+</code>), mode <code>Ask</code>. Collez le prompt, puis <b>remplacez</b> les noms de fichiers par des pastilles (<kbd>#</kbd> + nom) : <code>produit.md</code>, <code>regles-metier.md</code>, <code>US-{n}01.md</code>."},
  {t:"copy",l:"À COPIER dans le chat",x:"Contexte : projet SprintDesk, lot {n}.\nSources : produit.md, regles-metier.md, US-{n}01.md (à ajouter avec #).\n\nInterdits : ne réécris pas l'US. N'invente aucune règle métier. Ne modifie aucun fichier.\n\nTâche : indique si cette US est exploitable en l'état.\n\nExigences :\n- Cite les règles RM-xx ou décisions ND-xx concernées.\n- Si une information manque, pose-moi la question au lieu de la deviner.\n\nFormat : un tableau avec les colonnes \"Constat\", \"Pourquoi c'est un problème\", \"Question à poser au métier\"."},
  {t:"see",x:"Un tableau qui constate que l'US est trop vague, et des <b>questions</b> au lieu d'inventions."},
  {t:"why",x:"Même US, même IA qu'à l'étape précédente : seul le cadre a changé."}]},
 {t:"Tester sur l'US correcte",b:[
  {t:"p",x:"Nouveau chat, même prompt, avec l'<b>US-{n}05</b> (la correcte)."},
  {t:"see",x:"Copilot dit qu'elle est globalement correcte."},
  {t:"p",x:"S'il propose de grosses modifications, envoyez :"},
  {t:"copy",l:"À COPIER",x:"Rappel : une US déjà correcte ne doit pas être modifiée. Si tu penses qu'elle est correcte, dis-le simplement et n'invente aucune amélioration."},
  {t:"why",x:"Un Copilot non cadré « améliore » même ce qui est bon. Cette règle ira dans les instructions (Atelier 1, partie A)."}]},
 {t:"Les techniques de prompt les plus connues",b:[
  {t:"p",x:"Les chercheurs et les praticiens ont identifié des « recettes » de prompts qui améliorent nettement les réponses. Vous les utilisez déjà sans le savoir. Voici la carte complète ; les 3 étapes suivantes vous font <b>essayer</b> les plus utiles pour SprintDesk."},
  {t:"table",h:["Technique","Principe en une phrase","Effet sur le projet SprintDesk","Ce que vous devez obtenir"],r:[
   ["<b>Zero-shot</b><br>(instruction seule)","Demander directement, sans exemple","Rapide, mais le format varie d'une réponse à l'autre et Copilot comble les vides","Une réponse correcte mais de forme libre"],
   ["<b>Few-shot</b><br>(par l'exemple)","Montrer 1 à 3 exemples du résultat voulu","Toutes les US réécrites ont <b>la même structure</b> que l'US modèle","Une sortie qui imite l'exemple section par section"],
   ["<b>Chain-of-Thought (CoT)</b><br>(pas à pas)","Demander de raisonner étape par étape avant de conclure","Fait apparaître <b>pourquoi</b> une US contredit une règle : le raisonnement est vérifiable","Des étapes numérotées, puis une conclusion cohérente avec elles"],
   ["<b>Rôle</b> (persona)","« Agis comme un… » pour fixer l'angle de vue","Questions de Product Owner plutôt que réponses de développeur. <i>Base de vos agents</i>","Un vocabulaire et un angle adaptés (pas de connaissances en plus)"],
   ["<b>Format imposé</b>","Fixer tableau, sections, longueur","Constats <b>comparables</b> d'une US à l'autre","La structure demandée, sans texte parasite"],
   ["<b>Contraintes négatives</b>","Lister ce qu'il ne faut pas faire","Empêche l'invention de règles et la réécriture non demandée","Aucune règle inventée ; des questions à la place"],
   ["<b>Décomposition</b><br>(prompt chaining)","Découper en étapes enchaînées","C'est exactement le cycle diagnostic, validation, réécriture, contrôle. <i>Base de votre plan</i>","Une étape = un livrable relisable"],
   ["<b>Questions inversées</b>","Demander à l'IA de vous interroger avant d'agir","Fait remonter les décisions non prises (ND-xx) avant qu'elles soient devinées","Des questions ciblées, une à la fois"],
   ["<b>Auto-vérification</b><br>(self-critique)","Demander à l'IA de relire et corriger sa réponse","Elle repère elle-même ses affirmations sans source","Une liste d'affirmations retirées ou transformées en questions"],
   ["<b>Ancrage dans les sources</b> (grounding)","Fournir les textes et exiger « uniquement à partir de »","Réduit fortement les hallucinations sur les règles métier","Chaque affirmation cite un fichier"]]},
  {t:"p",x:"<b>Un exemple à copier pour chacune des 5 techniques clés.</b> Pour chaque essai : nouveau chat (<code>+</code>), mode <code>Ask</code>, ajoutez les pastilles <kbd>#</kbd> indiquées, envoyez, puis comparez avec le résultat attendu."},
  {t:"p",x:"<b>1. Few-shot</b> (fichiers : <code>#US-{n}05.md</code> et <code>#US-{n}04.md</code>)"},
  {t:"copy",l:"Prompt — few-shot",x:"EXEMPLE d'US au format attendu : US-{n}05 (ajoutée avec #).\nUS à formater : US-{n}04 (ajoutée avec #).\nFormate l'US-{n}04 sur le même modèle que l'exemple, mêmes sections, mêmes critères Étant donné / quand / alors. Toute information absente va dans \"Questions ouvertes\". Ne modifie aucun fichier."},
  {t:"see",x:"Une US avec exactement les sections de l'US-{n}05, des critères Étant donné / quand / alors, et une section « Questions ouvertes » pour ce qui manque. Aucune valeur inventée."},
  {t:"p",x:"<b>2. Chain-of-Thought</b> (fichiers : <code>#US-{n}03.md</code> et <code>#regles-metier.md</code>)"},
  {t:"copy",l:"Prompt — pas à pas",x:"Analyse l'US-{n}03 étape par étape : 1) liste chaque affirmation de l'US ; 2) pour chacune, cite la règle RM-xx ou ND-xx correspondante ; 3) indique conforme, contradictoire ou sans règle ; 4) conclus seulement à la fin. Montre ton raisonnement. Ne modifie aucun fichier."},
  {t:"see",x:"Une liste numérotée d'étapes, chaque affirmation associée à une règle citée, puis une conclusion qui découle des étapes (par exemple : « contradictoire avec RM-xx »)."},
  {t:"p",x:"<b>3. Rôle</b> (fichiers : <code>#US-{n}01.md</code> et <code>#produit.md</code>)"},
  {t:"copy",l:"Prompt — rôle",x:"Agis comme un Product Owner expérimenté qui prépare le backlog. Relis l'US-{n}01 avec le contexte de produit.md. Donne les 3 questions que tu poserais au demandeur avant de l'accepter dans un sprint. N'écris pas de solution technique et ne modifie aucun fichier."},
  {t:"see",x:"Trois questions orientées besoin et valeur (« Qui en a besoin ? Comment saura-t-on que c'est réussi ? »), sans vocabulaire de développeur, sans code."},
  {t:"p",x:"<b>4. Questions inversées</b> (fichiers : <code>#US-{n}02.md</code> et <code>#regles-metier.md</code>)"},
  {t:"copy",l:"Prompt — questions inversées",x:"Je veux réécrire l'US-{n}02. Avant de proposer quoi que ce soit, pose-moi une par une les questions dont tu as besoin, en t'appuyant sur regles-metier.md. N'invente aucune règle. Pose la première question et attends ma réponse."},
  {t:"see",x:"Une seule question à la fois (par exemple sur une règle absente ou une ND-xx), et aucune réécriture tant que vous n'avez pas répondu. Répondez « je ne sais pas » : Copilot doit la noter comme question ouverte, pas la deviner."},
  {t:"p",x:"<b>5. Auto-vérification</b> (fichiers : <code>#US-{n}04.md</code> et <code>#regles-metier.md</code> ; à lancer dans le chat de l'essai few-shot ou avec une réponse de Copilot déjà produite)"},
  {t:"copy",l:"Prompt — auto-vérification",x:"Relis ta réponse précédente. Pour chaque affirmation, indique la source (fichier et règle) ou écris « sans source ». Retire ou transforme en question ouverte toute affirmation sans source. Réponds avec : 1) la liste des affirmations sans source ; 2) la version corrigée."},
  {t:"see",x:"Une liste des affirmations sans source (valeurs, délais, formats inventés), puis une version corrigée où elles sont devenues des questions ouvertes. Relisez quand même : l'auto-vérification ne remplace pas votre contrôle."},
  {t:"table",h:["Technique","À utiliser quand...","Signe qu'elle a fonctionné"],r:[["Few-shot","Le format de sortie doit être identique partout","La réponse ressemble à l'exemple"],["Chain-of-Thought","Il faut juger, comparer ou vérifier plusieurs règles","Chaque conclusion cite sa règle"],["Rôle","Vous voulez un angle (PO, qualité) précis","Le vocabulaire et les questions changent"],["Questions inversées","Il manque des informations ou des décisions","Copilot demande au lieu de deviner"],["Auto-vérification","Vous voulez détecter des inventions avant de relire","Des affirmations sans source sont signalées"]]},
  {t:"why",x:"Ces techniques ne s'excluent pas : un bon prompt de projet <b>combine</b> ancrage (sources) + contraintes négatives + format + parfois un exemple. Et il n'existe pas de prompt magique : on teste, on compare, on ajuste."},
  {t:"warn",x:"Un prompt plus long n'est pas forcément meilleur. Chaque ajout doit répondre à un défaut observé (invention, format variable, raisonnement opaque)."}]},
 {t:"Technique 1 : le few-shot (donner un exemple)",b:[
  {t:"p",x:"<b>Idée :</b> au lieu de décrire le format, vous <b>montrez</b> une US réussie. Votre lot en contient une : l'US-{n}05 (la correcte). Vous allez comparer sans exemple, puis avec exemple, sur l'US-{n}04 (sans critères)."},
  {t:"ol",x:["Nouveau chat (<code>+</code>), mode <code>Ask</code>.","Collez le <b>Prompt A</b>, ajoutez la pastille <code>#US-{n}04.md</code> (touche <kbd>#</kbd>), envoyez, puis lisez la réponse.","Nouveau chat (<code>+</code>). Collez le <b>Prompt B</b>, ajoutez les pastilles <code>#US-{n}05.md</code> et <code>#US-{n}04.md</code>, envoyez, puis lisez la réponse."]},
  {t:"copy",l:"Prompt A — sans exemple (zero-shot)",x:"Formate cette user story comme une bonne user story (US-{n}04, à ajouter avec #). Réponds dans le chat sans modifier de fichier."},
  {t:"copy",l:"Prompt B — avec exemple (few-shot)",x:"Voici un EXEMPLE d'US au format attendu : US-{n}05 (à ajouter avec #).\nVoici l'US à formater : US-{n}04 (à ajouter avec #).\n\nFormate l'US-{n}04 sur le MÊME modèle que l'exemple : mêmes sections, même style de critères (Étant donné / quand / alors).\nN'invente aucune règle : toute information absente va dans \"Questions ouvertes\".\nRéponds dans le chat sans modifier de fichier."},
  {t:"table",h:["À observer","Prompt A (sans exemple)","Prompt B (avec exemple) : attendu"],r:[["Sections","Variables, parfois incomplètes","Les mêmes que l'US modèle (Besoin, Règles métier, Critères, Dépendances, Questions ouvertes)"],["Critères d'acceptation","Formulation libre","Étant donné / quand / alors"],["Informations absentes","Souvent inventées (messages, délais, formats)","Listées en <b>Questions ouvertes</b>"],["Ton et longueur","Imprévisibles","Proches de l'exemple"]]},
  {t:"see",x:"La réponse B ressemble visiblement à l'US-{n}05 : même squelette, mêmes titres, mêmes formulations de critères."},
  {t:"why",x:"Un exemple vaut mille consignes : le modèle copie la <b>structure</b> et le <b>style</b>. Attention : il peut aussi copier les défauts de l'exemple, donc choisissez toujours un exemple validé. Cette idée sera reprise dans la skill <code>formater-us</code> (exemple conforme / contre-exemple)."}]},
 {t:"Technique 2 : le raisonnement pas à pas (Chain-of-Thought)",b:[
  {t:"p",x:"<b>Idée :</b> pour une question qui demande plusieurs vérifications, forcer Copilot à <b>écrire son raisonnement</b> avant de conclure. Vous testez sur l'US-{n}03, celle qui est contradictoire."},
  {t:"ol",x:["Nouveau chat (<code>+</code>), mode <code>Ask</code>. Collez le <b>Prompt A</b> et ajoutez les pastilles <code>#US-{n}03.md</code> et <code>#regles-metier.md</code>. Lisez la réponse.","Nouveau chat. Collez le <b>Prompt B</b> avec les mêmes pastilles. Lisez la réponse."]},
  {t:"copy",l:"Prompt A — réponse directe",x:"L'US-{n}03 est-elle conforme aux règles métier ? Réponds par oui ou non, en une phrase. (Ajouter #US-{n}03.md et #regles-metier.md)"},
  {t:"copy",l:"Prompt B — pas à pas (CoT)",x:"Analyse l'US-{n}03 étape par étape (fichiers à ajouter avec # : US-{n}03.md et regles-metier.md) :\n1. Liste chaque règle ou affirmation écrite dans l'US.\n2. Pour chacune, cherche la règle correspondante dans regles-metier.md (RM-xx ou ND-xx) et cite-la.\n3. Indique pour chacune : conforme, contradictoire ou sans règle correspondante.\n4. Seulement ensuite, conclus.\nMontre ton raisonnement avant la conclusion. Ne modifie aucun fichier."},
  {t:"table",h:["À observer","Prompt A (direct)","Prompt B (CoT) : attendu"],r:[["Justification","Une phrase, parfois sans preuve","Une liste d'étapes avec la règle citée à chaque fois"],["Contradiction trouvée ?","Peut être manquée ou affirmée sans source","Repérée et expliquée (règle de l'US contre règle validée)"],["Vérifiable par vous ?","Difficilement","Oui : vous pouvez contrôler chaque étape"],["Longueur","Courte","Plus longue (c'est le prix)"]]},
  {t:"see",x:"Dans la réponse B, vous retrouvez une ligne « contradictoire » avec la bonne règle RM-xx ou ND-xx citée, <b>avant</b> la conclusion."},
  {t:"why",x:"Le CoT améliore la fiabilité sur les tâches de <b>vérification</b> et de <b>comparaison</b> et rend l'erreur visible. Inutile pour une simple reformulation. Dans l'atelier, c'est ce que la skill <code>revue-agilite</code> imposera à l'agent Reviewer : « citer la règle et la phrase fautive »."}]},
 {t:"Techniques 3 à 5 : rôle, questions inversées, auto-vérification",b:[
  {t:"p",x:"Trois techniques courtes à essayer dans <b>trois nouveaux chats</b> (mode <code>Ask</code>), sur l'US-{n}01 (la vague). Ajoutez la pastille <code>#US-{n}01.md</code> à chaque prompt."},
  {t:"copy",l:"Technique 3 — le rôle",x:"Agis comme un Product Owner expérimenté qui prépare le raffinement de cette US (US-{n}01, à ajouter avec #). Liste les 3 questions les plus importantes que tu poserais au demandeur. Ne propose aucune réponse. Ne modifie aucun fichier."},
  {t:"see",x:"3 questions de nature « métier » (quels champs ? qui l'utilise ? quel résultat attendu ?). Pas de solution inventée."},
  {t:"copy",l:"Technique 4 — les questions inversées",x:"Avant de proposer quoi que ce soit sur cette US (US-{n}01, à ajouter avec #), interroge-moi. Pose les questions dont tu as besoin, UNE seule à la fois, en commençant par la plus importante. N'avance pas tant que je n'ai pas répondu. Pour toute décision que je ne peux pas prendre, note-la comme \"question ouverte\"."},
  {t:"p",x:"Répondez à 2 ou 3 questions, puis tapez : « Résume ce que nous savons, et ce qui reste en question ouverte. »"},
  {t:"see",x:"Une question à la fois, puis un résumé en deux parties : acquis / questions ouvertes."},
  {t:"copy",l:"Technique 5 — l'auto-vérification (dans le chat de la technique 4)",x:"Relis ta réponse précédente. Liste chaque affirmation qui ne s'appuie sur aucun fichier ni sur aucune de mes réponses. Pour chacune : retire-la, ou transforme-la en question ouverte."},
  {t:"see",x:"Copilot reconnaît au moins une hypothèse implicite et la déplace en question ouverte. S'il répond « rien à retirer », demandez : « Vérifie plus strictement, ligne par ligne. »"},
  {t:"table",h:["J'ai besoin de...","Technique","Où elle servira dans l'atelier"],r:[["Un format homogène","Few-shot + format imposé","Skill <code>formater-us</code>"],["Comprendre pourquoi c'est faux","Chain-of-Thought","Skill <code>revue-agilite</code>, agent Reviewer"],["Un angle de vue précis","Rôle","Agents (Reviewer, Rédacteur, Contrôleur)"],["Faire remonter les décisions manquantes","Questions inversées","Mode Plan (Atelier 1, partie B)"],["Réduire les inventions","Auto-vérification + ancrage","Agent Contrôleur, instructions"],["Un travail en plusieurs temps","Décomposition","PLAN.md"]]}]},
 {t:"Critiquer au lieu de tout relancer",b:[
