"Ouvrir et lire un fichier":{o:"Lire produit.md et regles-metier.md en aperçu mis en forme et distinguer RM-xx (validé) de ND-xx (non décidé).",c:"<b>Markdown</b> est un format de texte où <code>#</code> fait un titre et <code>|</code> un tableau. Il est lisible brut et se met en forme dans l'aperçu. Copilot lit très bien le Markdown, d'où son usage pour les règles, plans, agents et skills.",l:[L.md,L.mdvsc]},
"Ouvrir Copilot Chat":{o:"Avoir le panneau Copilot Chat ouvert et connecté à votre compte GitHub.",c:"Copilot Chat est une <b>conversation</b> avec un modèle de langage (LLM). Il produit du texte probable à partir de ce que vous lui donnez : il n'a ni mémoire du projet ni connaissances sur votre entreprise, sauf ce que vous lui montrez.",l:[L.chat,L.over]},
"Repérer les boutons du chat":{o:"Savoir choisir le bon mode (Ask, Plan, Agent) et démarrer une conversation neuve.",c:"Chaque mode donne un <b>niveau d'autonomie</b> différent. Ask et Plan lisent et conseillent ; Agent agit sur vos fichiers. Plus l'autonomie est grande, plus la relecture humaine compte. Une conversation neuve repart sans l'historique, utile quand Copilot s'embrouille.",l:[L.chat,L.agentmode]},
"Votre premier message":{o:"Envoyer un premier prompt et recevoir une réponse de Copilot.",c:"Un <b>prompt</b> est l'instruction envoyée au modèle. Les modèles de langage ne sont pas déterministes : la même question peut donner deux formulations différentes. C'est normal, et c'est pourquoi on cadre les réponses.",l:[L.pe,L.best]},
"Donner un fichier à Copilot avec #":{o:"Savoir joindre un fichier précis à un message avec le #.",c:"Le <b>contexte</b> est l'ensemble des informations que Copilot a sous les yeux pour répondre. Un modèle ne peut s'appuyer que sur ce contexte. Moins il en a, plus il comble les vides par des suppositions.",l:[L.ctx,L.pe]},
"Accepter ou annuler ce que Copilot modifie":{o:"Relire chaque modification de Copilot, puis la conserver ou l'annuler en connaissance de cause.",c:"Le principe du <b>human in the loop</b> : l'IA propose, l'humain valide. Les couleurs vert/rouge montrent le <i>diff</i> (la différence) entre l'ancien et le nouveau texte. Prenez l'habitude de lire ce diff avant de cliquer sur Conserver.",l:[L.edits,L.tips]},
"Lire les 5 US de votre lot":{o:"Repérer par vous-même, avant toute IA, les 5 types de défauts : vague, volumineuse, contradictoire, sans critères, correcte.",c:"Une <b>user story</b> exprime un besoin du point de vue de l'utilisateur (« En tant que… je veux… afin de… »). Une bonne US est petite, claire et testable : c'est le critère <b>INVEST</b>.",l:[L.us,L.invest]},
"Le mauvais prompt (pour voir le problème)":{o:"Constater qu'un prompt vague pousse Copilot à inventer des règles.",c:"Une <b>hallucination</b> est une réponse plausible mais non fondée sur vos sources. Elle apparaît surtout quand la consigne est floue ou que l'information manque. Le meilleur remède : fournir les sources et autoriser à dire « je ne sais pas ».",l:[L.pe,L.best]},
"Le bon prompt en 6 blocs":{o:"Écrire un prompt qui impose sources, interdits et format, et obtenir des questions plutôt que des inventions.",c:"Le <b>prompt engineering</b> consiste à rendre la demande explicite : contexte, sources, interdits, tâche, exigences, format. Un exemple dans le prompt (<i>few-shot</i>) améliore encore la précision.",l:[L.pe,L.best]},
"Tester sur l'US correcte":{o:"Vérifier que Copilot laisse intacte une US déjà correcte.",c:"Les modèles ont un <b>biais de complaisance</b> : ils cherchent à « aider », donc à modifier. Il faut dire explicitement « si c'est correct, ne touche à rien ». Savoir ne rien faire est une qualité à exiger.",l:[L.pe,L.us]},
"Critiquer au lieu de tout relancer":{o:"Corriger une réponse en une phrase de critique ciblée, sans repartir de zéro.",c:"Le chat est <b>itératif</b> : chaque message s'ajoute à l'historique. Une critique précise (« retire ce point inventé ») est plus efficace qu'un nouveau prompt. Si l'historique devient trop long ou confus, ouvrez un nouveau chat.",l:[L.pe,L.chat]},
"Rappel : à quoi servent les instructions":{o:"Se rappeler que les instructions s'appliquent seules à chaque conversation, et voir leur effet sur des demandes concrètes.",c:"Les <b>instructions</b> sont du contexte ajouté automatiquement à chaque requête. Elles cadrent le ton, le format et les interdits ; elles ne garantissent rien à 100 %, d'où la relecture humaine.",l:[L.instr,L.best]},
"Rappel : c'est quoi une skill, comment l'invoquer":{o:"Savoir ce qu'est une skill, à quoi elle sert et comment la déclencher ou la vérifier.",c:"Une <b>skill</b> est une procédure réutilisable (<code>SKILL.md</code>) chargée à la demande, d'après sa <code>description</code>. Vous pouvez aussi la nommer dans le prompt pour la forcer.",l:[L.instr,L.best]},
"Rappel : c'est quoi un agent, comment l'invoquer":{o:"Savoir ce qu'est un agent, à quoi il sert, comment le sélectionner dans le chat et le vérifier.",c:"Un <b>agent</b> est une fiche de poste (<code>.agent.md</code>) : mission, outils autorisés, sortie. Il s'active quand <b>vous</b> le choisissez dans le chat ; la restriction des outils est la vraie limite de ses droits.",l:[L.instr,L.best]},
"Comprendre ce que vous allez construire":{o:"Comprendre l'ordre de l'Atelier 1 : d'abord les instructions (règles permanentes), ensuite le plan (contrat).",c:"Le <b>harness</b> (harnais) désigne tout ce qui encadre l'IA : instructions, plan, agents, skills, validations. L'idée : ne pas compter sur la bonne volonté du modèle, mais sur un cadre écrit et vérifiable.",l:[L.over,L.instr]},
"Ouvrir le fichier d'instructions":{o:"Trouver et ouvrir .github/copilot-instructions.md.",c:"Le fichier <code>.github/copilot-instructions.md</code> est lu <b>automatiquement</b> dans chaque conversation du dossier. Le dossier <code>.github</code> (nom commençant par un point) est une convention : il regroupe la configuration du dépôt.",l:[L.instr,L.ui]},
"Remplacer le contenu par les instructions complètes":{o:"Obtenir un fichier d'instructions complet, sans TODO, qui interdit les inventions et impose la traçabilité.",c:"De bonnes instructions sont <b>courtes, concrètes et vérifiables</b> (« ne jamais inventer de règle » plutôt que « sois rigoureux »). Mettez-y ce qui doit être vrai tout le temps ; le reste va dans les agents et skills.",l:[L.instr,L.best]},
"Vérifier que Copilot applique ces règles":{o:"Confirmer que Copilot charge bien vos instructions.",c:"Tester un changement est un réflexe clé : posez une question dont la réponse dépend du fichier modifié. La liste des <b>références utilisées</b> sous la réponse montre quels fichiers ont réellement été lus.",l:[L.instr,L.chat]},
"Passer en mode Plan":{o:"Basculer Copilot en mode Plan, où il propose sans rien modifier.",c:"Le mode <b>Plan</b> sépare la réflexion de l'exécution. Corriger un plan coûte une phrase ; corriger 20 fichiers modifiés par erreur coûte bien plus.",l:[L.plan,L.agentmode]},
"Envoyer le prompt de plan":{o:"Faire lire à Copilot le contexte et les 5 US, puis obtenir un premier plan et des questions.",c:"Le prompt demande explicitement de <b>distinguer faits, propositions et décisions à prendre</b>. Cette séparation rend visibles les endroits où le modèle serait tenté d'inventer.",l:[L.plan,L.pe]},
"Répondre aux questions de Copilot":{o:"Répondre sans jamais trancher une décision non prise (ND-xx).",c:"Il existe deux sortes d'information : ce que le métier a <b>décidé</b> (RM-xx) et ce qui reste <b>ouvert</b> (ND-xx). Une question ouverte documentée vaut mieux qu'une hypothèse cachée dans un livrable : elle sera tranchée par la bonne personne.",l:[L.plan,L.us]},
"Affiner le plan par la critique":{o:"Rendre le plan vérifiable : critères oui/non, étapes séparées, conditions d'arrêt.",c:"Un <b>critère de réussite</b> doit pouvoir se répondre par oui ou non (« chaque US a au moins 2 critères Étant donné/Quand/Alors »). « Qualité correcte » n'est pas évaluable. C'est la base de toute évaluation ultérieure.",l:[L.invest,L.pe]},
"Enregistrer le plan dans PLAN.md":{o:"Sauvegarder le plan validé dans un fichier PLAN.md à la racine.",c:"Un fichier est <b>durable et partageable</b> ; une conversation ne l'est pas. Une fois écrit, le plan peut être relu par un collègue, versionné avec Git et cité par vos agents.",l:[L.agentmode,L.edits]},
"Contrôler votre plan":{o:"Valider que le plan est lisible, vérifiable et place l'humain avant toute décision.",c:"Un plan sert de <b>contrat</b> : il dit ce que les agents feront, ce qu'ils ne décideront pas et comment juger le résultat. Il évite aussi le « scope creep » (périmètre qui dérive).",l:[L.plan,L.best]},
"Comprendre ce qu'est un agent":{o:"Savoir expliquer ce qu'est un agent personnalisé et pourquoi on en crée plusieurs plutôt qu'un seul.",c:"Un agent personnalisé fixe une <b>persona</b> : mission, outils autorisés, interdits, format de sortie. Séparer les rôles évite qu'un agent juge son propre travail, comme on sépare l'auditeur et le comptable.",l:[L.agents,L.agentmode]},
"Éditer l'agent Reviewer":{o:"Compléter l'agent Reviewer : il diagnostique, cite ses preuves, ne réécrit jamais.",c:"Le champ <code>tools</code> liste les <b>outils</b> accessibles (lire, chercher, éditer). Restreindre les outils est un garde-fou plus fort qu'une simple consigne : ce qui n'est pas autorisé est impossible.",l:[L.agents,L.agentmode]},
"Éditer l'agent Rédacteur":{o:"Compléter l'agent Rédacteur : il applique la revue validée et laisse les décisions ouvertes en questions.",c:"Faire suivre le diagnostic par une réécriture, avec validation humaine entre les deux, est un <b>workflow en chaîne</b> (handoff). Chaque agent reçoit en entrée la sortie validée du précédent.",l:[L.agents,L.skills]},
"Créer un nouvel agent : le Contrôleur":{o:"Créer de zéro un agent en lecture seule qui contrôle le résultat sans pouvoir le modifier.",c:"Le principe du <b>moindre privilège</b> : donner à un agent uniquement les outils nécessaires. Le Contrôleur n'a que <code>read</code> et <code>search</code> : il ne peut donc pas « corriger discrètement ».",l:[L.agents,L.tips]},
"Vérifier que vos agents sont visibles":{o:"Voir vos 3 agents dans le sélecteur de mode.",c:"VS Code détecte les fichiers <code>*.agent.md</code> du dossier <code>.github/agents</code>. Un en-tête (<i>frontmatter</i>) mal formé empêche la détection : c'est la cause n°1 d'un agent absent.",l:[L.agents,L.tips]},
"Lancer le Reviewer":{o:"Obtenir sprintdesk/resultats/revue.md avec un constat argumenté par US.",c:"Un agent fonctionne en <b>boucle</b> : il lit, raisonne, agit (écrit un fichier), puis vous rend compte. Le mode Agent demande votre autorisation avant d'agir : lisez le nom du fichier concerné avant d'accepter.",l:[L.agentmode,L.agents]},
"Valider le diagnostic (étape humaine)":{o:"Relire la revue et décider, avant que la moindre US soit réécrite.",c:"La <b>validation humaine</b> est le point de contrôle qui rend le processus fiable. L'IA ne tranche pas les décisions métier : elle les rend visibles pour qu'un responsable les prenne.",l:[L.best,L.us]},
"Lancer le Rédacteur":{o:"Obtenir 5 US réécrites dans backlog/sortie, avec une synthèse des actions.",c:"Les <b>critères d'acceptation</b> au format Étant donné / Quand / Alors (Given/When/Then) décrivent un comportement observable et testable. Un critère = un comportement.",l:[L.gwt,L.invest]},
"Lancer le Contrôleur et conclure":{o:"Comparer les US réécrites aux attentes du plan et corriger les écarts.",c:"Un contrôle indépendant est une <b>évaluation</b> : on compare un résultat à des critères connus à l'avance (ceux du plan). Un échec précis (une ligne KO avec preuve) se corrige facilement.",l:[L.best,L.agents]},
"Comprendre ce qu'est une skill":{o:"Distinguer une skill (le comment) d'un agent (le qui) et savoir où elle vit.",c:"Une <b>skill</b> est un dossier de connaissances réutilisables (procédure, modèle, exemples). Copilot la charge <b>à la demande</b> selon sa description, ce qui économise le contexte. Le format est un standard ouvert, partagé entre outils.",l:[L.skills,L.skillsstd]},
"Compléter la skill formater-us":{o:"Donner à vos agents la procédure exacte pour écrire une US au bon format.",c:"Une bonne skill contient une <b>procédure numérotée</b>, des règles claires et des exemples bon/mauvais. Les fichiers annexes (ici <code>modele-us.md</code>) sont lus uniquement si besoin.",l:[L.skills,L.gwt]},
"Compléter la skill revue-agilite":{o:"Transformer une checklist en méthode de revue qui exige des preuves.",c:"Distinguer <b>bloquant</b> (empêche de réaliser ou tester) et <b>recommandation</b> (amélioration) est la base d'une revue utile. Exiger la phrase fautive rend chaque constat vérifiable.",l:[L.invest,L.us]},
"Créer une nouvelle skill : verifier-regles-metier":{o:"Créer de zéro une skill avec le bon nom de dossier, le bon fichier SKILL.md et une description efficace.",c:"La <b>description</b> est le déclencheur : Copilot s'en sert pour décider d'utiliser la skill. Écrivez-la avec les mots que vous utiliseriez dans votre demande. Le <code>name</code> doit être identique au dossier.",l:[L.skills,L.skillsstd]},
"Tester vos skills":{o:"Vérifier qu'une skill est bien chargée et utilisée par Copilot.",c:"Tester, c'est comparer <b>avant / après</b>. Si une skill n'est pas utilisée, la cause est presque toujours le nom, le fichier ou la description. Vous pouvez aussi la citer explicitement dans le prompt.",l:[L.skills,L.best]},
"Bilan final":{o:"Contrôler que tout le harness est en place et savoir le décrire en une phrase.",c:"Un harness évolue par <b>cycles</b> : planifier, agir, analyser, ajuster <i>un seul élément</i> à la fois. C'est ainsi qu'on progresse sans casser ce qui marche.",l:[L.over,L.best]},
"Comprendre l'orchestration agentique":{o:"Savoir expliquer ce qu'est un orchestrateur, ses 5 verbes, et ce qu'est un sous-agent.",c:"L'<b>orchestration agentique</b> confie l'enchaînement des agents à un agent coordinateur. Chaque sous-agent travaille dans un <b>contexte isolé</b> : il ne voit que la consigne reçue, ce qui évite de polluer la conversation principale.",l:[L.subagents,L.agents]},
"Manuel, handoff ou orchestration ?":{o:"Choisir entre passage manuel, handoff et sous-agent, et connaître les schémas d'orchestration courants.",c:"Un <b>handoff</b> change l'agent de la conversation sur votre clic. Un <b>sous-agent</b> est appelé par l'agent principal, qui reprend la main ensuite. Commencez toujours par le schéma le plus simple.",l:[L.subagents,L.agentref]},
"Risques et garde-fous":{o:"Connaître les risques d'un système multi-agents et les garde-fous qui les limitent.",c:"Plus un système est autonome, plus ses <b>arrêts obligatoires</b> comptent. Liste fermée d'agents, moindre privilège, boucles bornées et validation humaine sont les quatre garde-fous de base.",l:[L.subagents,L.best]},
"Vérifier les prérequis et voir le résultat attendu":{o:"Confirmer que les agents et skills des Ateliers 2 et 3 sont en place, et voir le tableau de bord d'exemple.",c:"Séparer la <b>mise en page</b> (gabarit fixe) des <b>données</b> (JSON produit par l'agent) rend le résultat stable et sûr : l'agent ne génère jamais de code.",l:[L.skills,L.agents]},
"Créer la skill compte-rendu-html":{o:"Créer la skill qui transforme les livrables du lot en tableau de bord HTML.",c:"Une skill peut embarquer des <b>fichiers annexes</b> (ici un gabarit HTML). L'agent les lit uniquement quand il applique la skill.",l:[L.skills,L.skillsstd]},
"Créer l'agent orchestrateur-us":{o:"Créer un agent qui délègue à une liste fermée de sous-agents et s'arrête aux validations humaines.",c:"Les champs <code>tools: ['agent']</code> et <code>agents: [...]</code> autorisent l'appel de sous-agents et en limitent la liste. Le corps de la fiche décrit le déroulé, les arrêts et les interdits.",l:[L.agentref,L.subagents]},
"Lancer l'orchestration":{o:"Démarrer l'orchestrateur sur votre lot et obtenir le premier point de validation.",c:"Chaque appel de sous-agent apparaît dans le chat comme un <b>appel d'outil</b> dépliable : vous pouvez lire la consigne envoyée et le résultat rendu. C'est votre moyen de contrôle.",l:[L.subagents,L.agentmode]},
"Tenir votre rôle aux points de validation":{o:"Valider, corriger ou arrêter à chaque point, en ayant ouvert le livrable.",c:"Le <b>human in the loop</b> n'est efficace que s'il est exercé : relire, puis décider. Un point de validation approuvé sans lecture n'apporte aucune sécurité.",l:[L.best,L.plan]},
"Ouvrir le compte rendu HTML":{o:"Lire le tableau de bord du lot et vérifier qu'il reflète fidèlement les livrables.",c:"Un compte rendu sert la <b>traçabilité</b> : ce qui a été fait, par quel agent, validé par qui. Il ne doit rien ajouter aux sources.",l:[L.skills,L.best]},
"Comparer et conclure":{o:"Comparer le passage manuel et le passage orchestré, puis cocher la checklist du bonus.",c:"On améliore un système multi-agents comme un harness simple : <b>un défaut, une cause, une modification</b>, puis on rejoue.",l:[L.subagents,L.best]},
"Pour aller plus loin : vos propres commandes « / »":{o:"Comprendre ce qu'est un fichier de prompt, où il se range et en quoi il diffère des instructions, agents et skills.",c:"Un <b>fichier de prompt</b> (<code>.prompt.md</code>) est un prompt enregistré que l'on lance à la demande avec <code>/nom</code>. Contrairement aux instructions, il n'est jamais appliqué automatiquement : c'est vous qui le déclenchez.",l:[L.prompts,L.pe]},
"Créer la commande /diagnostiquer-us":{o:"Transformer le prompt à 6 blocs en commande réutilisable, en lecture seule.",c:"L'en-tête <b>YAML</b> (entre les deux lignes <code>---</code>) configure la commande : description, aide de saisie, mode. Les <b>liens Markdown</b> du corps joignent les fichiers du projet sans que l'utilisateur ait à y penser.",l:[L.prompts,L.mdvsc]},
"Lancer et tester la commande":{o:"Lancer la commande avec /, lui joindre une US, et vérifier qu'elle respecte l'US correcte.",c:"Ce que vous tapez après la commande (pastille <code>#</code>, <code>nom=valeur</code>, texte libre) est ajouté au prompt. Une commande se teste et s'améliore comme un document : on modifie le fichier, puis on relance.",l:[L.prompts,L.ctx]},
"Ajouter deux commandes : /questions-po et /verifier-reponse":{o:"Créer une commande avec variable et une commande qui s'applique à une conversation en cours.",c:"Une <b>variable</b> <code>${input:nom:aide}</code> rend une commande paramétrable. Une bibliothèque de quelques commandes bien testées vaut mieux que des dizaines de prompts jamais relus.",l:[L.prompts,L.best]},
"Vue d'ensemble : de « Copilot doit » à « Copilot ne peut pas »":{o:"Distinguer les règles qu'on peut appliquer par un mécanisme de celles qu'on ne peut que mesurer.",c:"Plus le mécanisme est fort, moins il dépend du modèle : un prompt peut être oublié, un hook s'exécute à chaque fois. Toutes les règles ne peuvent pas être appliquées : certaines se <b>mesurent</b>.",l:[L.hooks,L.best]},
"Hooks : un garde-fou qui s'exécute à chaque fois":{o:"Comprendre ce qu'est un hook, à quels moments il intervient et quelles sont ses limites.",c:"Un hook est une commande lancée par VS Code à un événement précis. Un hook <code>preToolUse</code> peut <b>refuser</b> une action avant qu'elle ait lieu. Un hook ne remplace pas les permissions.",l:[L.hooks,L.hooksref,L.security]},
"Hooks, pas à pas (1/2) : voir ce que fait Copilot":{o:"Installer un hook d'audit pour découvrir le nom des outils utilisés par l'agent.",c:"Le fichier JSON de <code>.github/hooks</code> déclare l'événement et la commande. La commande lit l'action en JSON et répond <code>{}</code> pour laisser passer. Journaliser les noms d'outils, jamais les contenus.",l:[L.hooks,L.hooksref]},
"Hooks, pas à pas (2/2) : protéger les sources du projet":{o:"Bloquer l'écriture dans entree/ et contexte/ et vérifier le refus par des tests.",c:"Le script ne regarde que les <b>chemins</b> visés, pas le contenu écrit, pour ne pas refuser à tort une US qui cite sa source. Il se teste avec un cas refusé et deux cas autorisés. C'est un garde-fou, pas une garantie absolue.",l:[L.hooks,L.hooksref,L.security]},
"Gestion du contexte : quand Copilot « oublie »":{o:"Reconnaître une conversation saturée et choisir le bon levier : compacter, repartir à zéro, bifurquer ou écrire dans un fichier.",c:"La fenêtre de contexte est limitée. <code>/compact</code> résume la conversation ; un nouveau chat repart d'un historique vide. Les fichiers du dépôt et les instructions permanentes, eux, sont conservés.",l:[L.sessions,L.ctx]},
"Contexte en pratique : traiter un lot sans perdre les décisions":{o:"Tenir un journal des décisions, compacter avec consigne et reprendre dans un nouveau chat sans rien perdre.",c:"Un journal dans <code>resultats/</code> joue le rôle de mémoire durable. Après un compactage, demandez explicitement ce qui a été conservé. Une décision que vous ne retrouvez pas dans le journal est à considérer comme inventée.",l:[L.sessions,L.ctx]},
"Choix du modèle et coût":{o:"Savoir où choisir un modèle, ce que changent Auto et l'effort de réflexion, et où lire la consommation.",c:"Un modèle léger est rapide et économe ; un modèle de raisonnement traite mieux les cas ambigus mais coûte davantage. Les hypothèses du tableau se vérifient par la mesure, jamais par principe.",l:[L.models,L.optimize]},
"Modèles en pratique : comparer deux modèles sur la même tâche":{o:"Comparer deux réglages sur le même prompt et la même US, puis fixer une règle de choix.",c:"Un seul paramètre doit changer entre les deux essais. Notez le modèle (survol de la réponse) et les crédits (survol de la jauge). Choisissez le modèle le moins coûteux qui réussit tous les critères.",l:[L.models,L.prompts]},
"Jeu d'évaluation : mesurer au lieu de supposer":{o:"Comprendre ce qu'est un jeu d'évaluation et pourquoi les 20 US des lots en forment déjà un.",c:"Un jeu d'évaluation est un ensemble fixe de cas à réponse connue. Critères figés avant le test, même prompt, une seule modification à la fois, et vérification que l'US correcte reste inchangée.",l:[L.best,L.tips]},
"Jeu d'évaluation en pratique : noter, modifier, rejouer":{o:"Noter une version, faire une modification, rejouer et interpréter l'écart.",c:"Chaque défaut observé conduit à une cause, puis à une seule modification. Comparez les totaux de v1 et v2, cherchez les régressions, et rejouez en cas de doute.",l:[L.best,L.tips]},
"Bilan et pistes suivantes":{o:"Relier les quatre mécanismes au reste du harness et cocher la checklist finale.",c:"Règles écrites, garde-fous appliqués, mémoire maîtrisée, modèle choisi par la mesure et banc d'essai forment un système complet. La décision métier reste humaine.",l:[L.hooks,L.models,L.sessions]},
"Récap : tout le parcours en un tableau":{o:"Revoir en un coup d'œil chaque partie, ce qu'elle vous a appris et ce que vous avez produit.",c:"Un harness se construit <b>par couches</b> : chaque brique répond à une question différente, et aucune ne remplace les autres.",l:[L.vsCustom,L.over]},
"Les notions clés en une phrase":{o:"Pouvoir définir chaque notion de la formation en une phrase.",c:"Savoir expliquer une notion simplement est le meilleur test de compréhension. Si une définition vous échappe, rouvrez la partie indiquée.",l:[L.vsCustom,L.best]},
"Conclusion : les règles d'or à garder":{o:"Retenir les sept règles qui rendent le travail avec Copilot fiable.",c:"Ces règles ne dépendent ni de l'outil ni du modèle. Elles valent pour Copilot comme pour tout assistant d'IA.",l:[L.best,L.oaiAgents]},
"Continuer avec Copilot et VS Code":{o:"Choisir les prochaines lectures dans la documentation officielle de Copilot et de VS Code.",c:"La documentation officielle évolue à chaque version. Elle prime sur toute formation, celle-ci comprise.",l:[L.vsCustom,L.ghTutos]},
"Continuer avec Anthropic et OpenAI":{o:"Relier les notions de la formation aux guides de référence d'Anthropic et d'OpenAI.",c:"Les éditeurs de modèles convergent sur les mêmes principes : simplicité, contexte maîtrisé, rôles séparés, garde-fous, mesure.",l:[L.antAgents,L.oaiAgents]},

};

/* ----------------------------------------------------------- moteur */
const KEY='sd-begin-v3';
let st={lot:1,stage:0,done:{},chk:{},open:{},tour:false};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
/* v4 : l'étape Bonus est insérée avant l'Aide (index 6 -> 7). v5 : « Pour aller bien plus loin » est insérée avant l'Aide (7 -> 8). */
const shiftStages=(from,to)=>{const mv=o=>{for(const k of Object.keys(o)) if(k.startsWith(from+'-')){o[to+'-'+k.slice(String(from).length+1)]=o[k];delete o[k];}};mv(st.done);mv(st.open);if(st.stage===from)st.stage=to;};
if(!st.v){shiftStages(6,7);st.v=4;save();}
if(st.v<5){shiftStages(7,8);st.v=5;save();}
/* v6 : « Récap et ouverture » est insérée avant l'Aide (8 -> 9). */
if(st.v<6){shiftStages(8,9);st.v=6;save();}
const $=s=>document.querySelector(s);
const fill=s=>s.replaceAll('{n}',st.lot).replace(/\{L:(\w+)\}/g,(m,k)=>L[k]?'<a href="'+L[k][1]+'" target="_blank" rel="noopener noreferrer">'+L[k][0]+' ↗</a>':m);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sid=(i,j)=>i+'-'+j;
let copies=[];

function block(b,i,j,k){
  switch(b.t){
    case 'p': return '<p>'+fill(b.x)+'</p>';
    case 'ol': return '<ol>'+b.x.map(x=>'<li>'+fill(x)+'</li>').join('')+'</ol>';
    case 'ul': return '<ul>'+b.x.map(x=>'<li>'+fill(x)+'</li>').join('')+'</ul>';
    case 'see': return '<div class="co see"><b class="l">✅ Vous devez voir</b><p>'+fill(b.x)+'</p></div>';
    case 'warn': return '<div class="co warn"><b class="l">⚠️ Si ça ne marche pas / attention</b><p>'+fill(b.x)+'</p></div>';
    case 'why': return '<div class="co why"><b class="l">💡 Pourquoi</b><p>'+fill(b.x)+'</p></div>';
    case 'no': return '<div class="co no"><b class="l">⛔ Règle</b><p>'+fill(b.x)+'</p></div>';
    case 'mock': return '<div class="mock">'+esc(fill(b.x))+'</div>';
    case 'ex': if(b.lot===st.lot) return ''; return '<details class="more"><summary>📄 '+fill(b.l)+'</summary><div class="mb"><div class="mock" style="white-space:pre-wrap">'+esc(fill(b.x))+'</div></div></details>';
    case 'table': { const cur=x=>b.lotcols&&x===st.lot?' class="lotcur"':''; return '<table><tr>'+b.h.map((h,x)=>'<th'+cur(x)+'>'+fill(h)+'</th>').join('')+'</tr>'+b.r.map(r=>'<tr>'+r.map((c,x)=>'<td'+cur(x)+'>'+fill(c)+'</td>').join('')+'</tr>').join('')+'</table>'; }
    case 'copy': {
      const text=fill(b.x).replaceAll('¤','`'); copies.push(text);
      return '<div class="copy"><div class="ct"><span>📋 '+fill(b.l)+'</span><button data-copy="'+(copies.length-1)+'">Copier</button></div><pre>'+esc(text)+'</pre></div>';}
    case 'check': return '<div class="chk">'+b.x.map((x,n)=>{const id=b.id+'-'+n;return '<label><input type="checkbox" data-chk="'+id+'"'+(st.chk[id]?' checked':'')+'><span>'+fill(x)+'</span></label>'}).join('')+'</div>';
  }
  return '';
}

const stageDone=i=>STAGES[i].steps.every((_,j)=>st.done[sid(i,j)]);
const btnLabel=d=>d?'↺ Marquer comme non fait':'✔ J\'ai fait cette étape — suivante';
const link=l=>'<li><a href="'+l[1]+'" target="_blank" rel="noopener noreferrer">'+l[0]+' ↗</a></li>';

function updateMeta(justStage){
  $('#road').innerHTML=STAGES.map((s,i)=>{
    const tot=s.steps.length, dn=s.steps.filter((_,j)=>st.done[sid(i,j)]).length;
    return '<li class="stop'+(i===st.stage?' cur':'')+(dn===tot?' done':'')+(i===justStage?' just':'')+'" data-stage="'+i+'"><span class="dot">'+(dn===tot?'✔':s.icon)+'</span><span><b>'+s.title+'</b><small>'+s.sub+' · '+dn+'/'+tot+'</small></span></li>';
  }).join('');
  let T=0,D=0; STAGES.forEach((s,i)=>s.steps.forEach((_,j)=>{T++;if(st.done[sid(i,j)])D++}));
  $('#pbar').style.width=(100*D/T)+'%'; $('#ptxt').textContent='Progression : '+D+' / '+T+' étapes';
}

function paintStep(id){
  const el=document.getElementById('st'+id); if(!el) return;
  const d=!!st.done[id], j=+id.split('-')[1];
  el.classList.toggle('done',d); el.classList.toggle('open',!!st.open[id]);
  el.querySelector('.num').textContent=d?'✔':j+1;
  el.querySelector('.tag').textContent=d?'Fait':'';
  el.querySelector('[data-done]').textContent=btnLabel(d);
}

function render(){
  copies=[];
  $('#lot').value=st.lot;
  updateMeta();
  const s=STAGES[st.stage], i=st.stage;
  let h='<h2>'+s.icon+' '+s.title+'</h2><div class="goalbox"><span class="oi">🎯</span><div><small>OBJECTIF DE CETTE PARTIE</small><strong>'+s.goal+'</strong></div></div>';
  s.steps.forEach((p,j)=>{
    const id=sid(i,j), open=st.open[id], dn=st.done[id], ex=EXTRA[p.t]||{};
    const more=ex.c?'<details class="more"><summary>📚 Pour aller plus loin</summary><div class="mb"><p><b>Le concept :</b> '+ex.c+'</p><p><b>Liens pour approfondir :</b></p><ul>'+(ex.l||[]).map(link).join('')+'</ul></div></details>':'';
    h+='<section class="step'+(open?' open':'')+(dn?' done':'')+'" id="st'+id+'" style="--i:'+j+'"><div class="sh" data-toggle="'+id+'"><span class="num">'+(dn?'✔':(j+1))+'</span><div class="ht"><h3>'+fill(p.t)+'</h3>'+(ex.o?'<span class="sub">🎯 '+fill(ex.o)+'</span>':'')+'</div><span class="tag">'+(dn?'Fait':'')+'</span><span class="chev">▾</span></div><div class="sb"><div class="in"><div class="pad">'
      +(ex.o?'<div class="obj"><span class="oi">🎯</span><div><small>OBJECTIF DE L\'ÉTAPE</small><strong>'+fill(ex.o)+'</strong></div></div>':'')
      +p.b.map((b,k)=>block(b,i,j,k)).join('')
      +more
      +'<div class="actions"><button class="btn p" data-done="'+id+'">'+btnLabel(dn)+'</button></div></div></div></div></section>';
  });
  h+='<div class="end">'+(st.stage<STAGES.length-1?'<button class="btn b'+(stageDone(i)?' pulse':'')+'" data-next>Passer à : '+STAGES[st.stage+1].title+' →</button>':'<p>🎉 Parcours terminé. Bravo !</p>')+'</div>';
  const m=$('#main'); m.innerHTML=h;
  m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter');
}

/* ---------- animations de réussite */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(x,y,n){
  if(REDUCED) return;
  const colors=['#16a34a','#2563eb','#7c3aed','#f59e0b','#ef4444','#06b6d4'];
  for(let k=0;k<n;k++){
    const el=document.createElement('i'); el.className='confetti';
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.background=colors[k%colors.length];
    document.body.appendChild(el);
    const dx=(Math.random()-.5)*360, up=-(80+Math.random()*220), rot=Math.random()*720-360;
    el.animate([
      {transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx*.6+'px,'+up+'px) rotate('+rot*.5+'deg)',opacity:1,offset:.45},
      {transform:'translate('+dx+'px,'+(up+320)+'px) rotate('+rot+'deg)',opacity:0}
    ],{duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>el.remove();
  }
}
function toast(msg,big){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'+(big?' big':''); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2700);
}
const CHEERS=['Bravo, étape réussie !','Bien joué !','Étape validée, continuez !','Excellent !','Un pas de plus sur la route !'];
function celebrate(id,x,y,i){
  const el=document.getElementById('st'+id), num=el.querySelector('.num');
  el.classList.add('celebrate'); num.classList.add('pop');
  setTimeout(()=>{el.classList.remove('celebrate');num.classList.remove('pop')},1200);
  confetti(x,y,26);
  if(stageDone(i)){
    setTimeout(()=>{confetti(innerWidth/2,innerHeight/3,70);toast('🏁 Partie terminée : '+STAGES[i].title+' !',true);},350);
    updateMeta(i);
    const nb=document.querySelector('.end .btn'); if(nb) nb.classList.add('pulse');
  } else toast('✔ '+CHEERS[Math.floor(Math.random()*CHEERS.length)]);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-stage],[data-toggle],[data-done],[data-next],[data-copy]'); if(!t) return;
  if(t.dataset.stage!==undefined){st.stage=+t.dataset.stage; if(!Object.keys(st.open).some(k=>k.startsWith(st.stage+'-')&&st.open[k])) st.open[sid(st.stage,0)]=true; save();render();scrollTo({top:0});}
  else if(t.dataset.toggle){const id=t.dataset.toggle;st.open[id]=!st.open[id];save();paintStep(id);}
  else if(t.dataset.done){
    const id=t.dataset.done,[i,j]=id.split('-').map(Number);
    const r=t.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    if(st.done[id]){delete st.done[id];paintStep(id);updateMeta();}
    else{
      st.done[id]=true;st.open[id]=false;paintStep(id);
      const nid=sid(i,j+1), hasNext=j+1<STAGES[i].steps.length;
      if(hasNext){st.open[nid]=true;paintStep(nid);}
      updateMeta(); celebrate(id,cx,cy,i);
      setTimeout(()=>{const n=document.getElementById('st'+(hasNext?nid:id));if(n)n.scrollIntoView({behavior:'smooth',block:'start'})},400);
    }
    save();
  }
  else if(t.dataset.next!==undefined){st.stage++;st.open[sid(st.stage,0)]=true;save();render();scrollTo({top:0});}
  else if(t.dataset.copy!==undefined){
    const txt=copies[+t.dataset.copy];
    const ok=()=>{t.textContent='✔ Copié !';t.classList.add('ok');setTimeout(()=>{t.textContent='Copier';t.classList.remove('ok')},1600)};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,()=>fb(txt,ok))}else fb(txt,ok);
  }
});
function fb(txt,ok){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}
document.addEventListener('change',e=>{
  if(e.target.dataset.chk){st.chk[e.target.dataset.chk]=e.target.checked;save();}
});
$('#lot').addEventListener('change',e=>{st.lot=+e.target.value;save();render();});
$('#reset').addEventListener('click',()=>{if(confirm('Effacer toute votre progression ?')){st={lot:st.lot,stage:0,done:{},chk:{},open:{'0-0':true},v:6};save();render();}});

/* ---------- visite guidée (premier usage) */
const TOUR=[
 {c:1,t:'Bienvenue sur votre road tour 👋',x:'Ce parcours vous guide <b>pas à pas</b> : chaque étape dit quoi faire, quoi copier et ce que vous devez voir. Cette courte visite (1 minute) montre comment tout fonctionne.'},
 {s:'#lot',t:'1. Choisissez votre lot',x:'Votre animateur vous attribue un lot (1 à 4). Le choix adapte automatiquement tous les noms de dossiers et de fichiers dans les textes à copier.'},
 {s:'.prog',t:'2. Votre progression',x:'La barre se remplit à chaque étape validée. Elle est <b>sauvegardée</b> dans votre navigateur : vous pouvez fermer la page et reprendre plus tard.'},
 {s:'nav.road',t:'3. La route : le menu',x:'Dix arrêts, du début à la fin, dont un bonus, une partie « bien plus loin » et un récap. Cliquez sur un arrêt pour y aller ; la coche ✔ indique qu\'il est terminé, et le compteur (ex. 3/7) montre l\'avancée.'},
 {s:'.step .sh',t:'4. Les étapes',x:'Chaque arrêt contient des étapes numérotées. Cliquez sur le titre d\'une étape pour l\'ouvrir ou la fermer. Faites-les <b>dans l\'ordre</b>.'},
 {s:'.step.open .obj',t:'5. L\'objectif',x:'En haut de chaque étape, le bandeau violet rappelle <b>ce que vous devez avoir obtenu</b> à la fin. Si vous êtes perdu, relisez-le.'},
 {s:'.step.open .co',t:'6. Les encadrés',x:'<b>Vert</b> : ce que vous devez voir. <b>Jaune</b> : que faire si ça ne marche pas. <b>Bleu</b> : pourquoi on fait cela. Plus loin, les blocs violets contiennent des textes à <b>copier d\'un clic</b> avec le bouton Copier.'},
 {s:'.step.open .more',t:'7. Pour aller plus loin',x:'Facultatif : un concept expliqué simplement et des liens officiels pour approfondir. À lire quand vous voulez comprendre le « pourquoi ».'},
 {s:'.step.open [data-done]',t:'8. Valider l\'étape',x:'Quand l\'étape est faite, cliquez ici : elle se ferme, la suivante s\'ouvre et un petit feu d\'artifice vous félicite 🎉. Cliquer de nouveau annule.'},
 {s:'#tourbtn',t:'9. Revoir cette visite',x:'Ce bouton relance la visite à tout moment. « Recommencer » efface votre progression. Le bouton ☀️ / 🌙 bascule entre thème clair et sombre.'},
 {c:1,t:'C\'est parti ! 🚀',x:'Commencez par la première étape : <b>Ouvrir le dossier du projet</b>.'}
];
let ti=0;
function startTour(){
  if($('#tour-ov')) return;
  document.body.insertAdjacentHTML('beforeend','<div id="tour-ov"></div><div id="tour-spot"></div><div id="tour-tip"></div>');
  window.scrollTo({top:0}); showTour(0,1);
}
function endTour(){
  ['#tour-ov','#tour-spot','#tour-tip'].forEach(s=>{const e=$(s);if(e)e.remove()});
  st.tour=true; save();
}
function tourTarget(e){return e.s?document.querySelector(e.s):null}
function showTour(i,dir){
  while(i>=0&&i<TOUR.length&&TOUR[i].s&&!tourTarget(TOUR[i])) i+=dir;
  if(i<0) i=0;
  if(i>=TOUR.length){endTour();return;}
  ti=i; const e=TOUR[i], last=i===TOUR.length-1;
  const el=tourTarget(e);
  if(el){const r=el.getBoundingClientRect(); if(r.top<70||r.bottom>innerHeight-20) el.scrollIntoView({block:'center'});}
  $('#tour-tip').innerHTML='<div class="tdots">'+TOUR.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('')+'</div><h4>'+e.t+'</h4><p>'+e.x+'</p><div class="tbtn"><button class="skip" data-tour="end">Passer la visite</button>'+(i>0?'<button class="btn s" data-tour="prev">Précédent</button>':'')+'<button class="btn b" data-tour="next">'+(last?'Commencer':'Suivant')+'</button></div>';
  tourPos();
}
function tourPos(){
  const tip=$('#tour-tip'); if(!tip) return;
  const spot=$('#tour-spot'), ov=$('#tour-ov'), el=tourTarget(TOUR[ti]);
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  if(!el){
    ov.classList.add('dim'); spot.style.opacity=0;
    tip.style.left=(innerWidth-tw)/2+'px'; tip.style.top=Math.max(12,(innerHeight-th)/2)+'px'; return;
  }
  ov.classList.remove('dim'); spot.style.opacity=1;
  const r=el.getBoundingClientRect(), p=6;
  Object.assign(spot.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+2*p+'px',height:r.height+2*p+'px'});
  let x,y;
  if(r.right+tw+24<innerWidth){x=r.right+18;y=r.top}
  else if(r.bottom+th+24<innerHeight){x=r.left;y=r.bottom+18}
  else if(r.top-th-24>0){x=r.left;y=r.top-th-18}
  else{x=(innerWidth-tw)/2;y=innerHeight-th-16}
  tip.style.left=Math.min(Math.max(12,x),innerWidth-tw-12)+'px';
  tip.style.top=Math.min(Math.max(12,y),innerHeight-th-12)+'px';
}
addEventListener('resize',tourPos);
addEventListener('scroll',tourPos,{passive:true});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tour]'); if(!b) return;
  const a=b.dataset.tour;
  if(a==='end') endTour(); else if(a==='next') showTour(ti+1,1); else showTour(ti-1,-1);
});
document.addEventListener('keydown',e=>{
  if(!$('#tour-ov')) return;
  if(e.key==='Escape') endTour(); else if(e.key==='ArrowRight') showTour(ti+1,1); else if(e.key==='ArrowLeft') showTour(ti-1,-1);
});
$('#tourbtn').addEventListener('click',startTour);
const applyTheme=t=>{document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀️':'🌙';$('#theme').title=t==='dark'?'Passer au thème clair':'Passer au thème sombre';};
applyTheme(document.documentElement.dataset.theme);
$('#theme').addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem('sd-theme',t)}catch(e){}});

if(!Object.keys(st.open).length) st.open[sid(st.stage,0)]=true;
render();
if(!st.tour) setTimeout(startTour,500);
</script>
