{icon:"🎼",title:"Bonus — Orchestration",sub:"Un agent qui pilote les agents",
 goal:"Vous créez un agent orchestrateur qui déroule PLAN.md, délègue au Reviewer, au Rédacteur et au Contrôleur, s'arrête à chaque validation humaine, puis produit un compte rendu HTML de votre lot.",
 steps:[
 {t:"Comprendre l'orchestration agentique",b:[
  {t:"p",x:"Dans l'Atelier 2, c'est <b>vous</b> qui passez la main d'un agent à l'autre : vous lancez le Reviewer, vous relisez, vous lancez le Rédacteur, puis le Contrôleur. L'<b>orchestration agentique</b> confie cet enchaînement à un agent coordinateur : l'<b>orchestrateur</b>."},
  {t:"p",x:"<b>Analogie :</b> un chef d'orchestre ne joue d'aucun instrument. Il donne le départ, tient le tempo et s'assure que chaque musicien joue sa partition. L'orchestrateur ne diagnostique pas et ne réécrit pas : il <b>fait travailler</b> les agents spécialisés, dans le bon ordre."},
  {t:"table",h:["Verbe","Ce que fait l'orchestrateur","Exemple SprintDesk"],r:[
   ["<b>Planifier</b>","Traduit l'objectif en étapes ordonnées","Lit <code>PLAN.md</code> et annonce : diagnostic, réécriture, contrôle, compte rendu"],
   ["<b>Déléguer</b>","Confie une étape à l'agent compétent, avec une consigne complète","Demande au Reviewer de produire <code>revue.md</code> pour le lot {n}"],
   ["<b>Contrôler</b>","Vérifie que le livrable existe et respecte le contrat","<code>revue.md</code> couvre-t-il les 5 US ?"],
   ["<b>S'arrêter</b>","Rend la main à l'humain aux points de validation","« Validez-vous le diagnostic ? »"],
   ["<b>Rendre compte</b>","Produit un bilan lisible et traçable","Tableau de bord HTML du lot"]]},
  {t:"mock",x:"                 VOUS (humain)\n          valider / corriger / arrêter\n                   ▲        │\n                   │        ▼\n          ┌──────────────────────────┐\n          │     orchestrateur-us      │  lit PLAN.md\n          │ (Planificateur-Contrôleur)│  écrit le compte rendu\n          └──────────────────────────┘\n             │          │          │   délègue\n             ▼          ▼          ▼\n        reviewer    redacteur   controleur\n      revue-agilite formater-us verifier-regles-metier\n             │          │          │\n             ▼          ▼          ▼\n         revue.md  sortie/lot{n}  tableau OK/KO\n                        │\n                        ▼\n      skill compte-rendu-html -> compte-rendu-lot{n}.html"},
  {t:"table",h:["Notion","En clair"],r:[
   ["<b>Sous-agent</b>","Un agent appelé par l'orchestrateur pour une tâche précise. Il rend un résultat, puis s'arrête."],
   ["<b>Contexte isolé</b>","Un sous-agent <b>ne voit pas</b> votre conversation. Il ne connaît que la consigne que l'orchestrateur lui envoie."],
   ["<b>Consigne de délégation</b>","Le message envoyé au sous-agent. Il doit être autonome : lot, fichiers à lire, fichier à écrire, décisions validées, interdits."],
   ["<b>Point de validation</b>","Un arrêt obligatoire où l'humain décide : valider, corriger ou arrêter."],
   ["<b>Boucle bornée</b>","Correction (Rédacteur puis Contrôleur) répétée au plus deux fois, puis remontée à l'humain."]]},
  {t:"why",x:"L'orchestration n'ajoute pas d'intelligence : elle ajoute de la <b>discipline</b>. Les mêmes étapes, dans le même ordre, avec les mêmes consignes, à chaque lot. Elle n'est utile que si vos agents et vos skills fonctionnent déjà bien seuls."}]},
 {t:"Manuel, handoff ou orchestration ?",b:[
  {t:"table",h:["","Atelier 2 (passage manuel)","Bonus (orchestration)"],r:[
   ["Qui enchaîne les agents ?","Vous, en changeant d'agent et en recollant un prompt","L'orchestrateur"],
   ["Qui transmet le contexte ?","Vous, à chaque prompt","L'orchestrateur, dans chaque consigne de délégation"],
   ["Qui vérifie que le livrable existe ?","Vous","L'orchestrateur, puis vous au point de validation"],
   ["Qui décide (ND-xx, acceptation) ?","<b>Vous</b>","<b>Vous</b> : rien ne change"],
   ["Bilan final","À rédiger","Compte rendu HTML généré"],
   ["Risque principal","Oubli d'étape, prompts différents à chaque fois","Effet « boîte noire » si on valide sans relire"]]},
  {t:"table",h:["","Handoff (bouton)","Sous-agent (délégation)"],r:[
   ["Fonctionnement","La conversation <b>change</b> d'agent, avec un prompt pré-rempli","L'orchestrateur <b>reste</b> l'agent principal et appelle un autre agent"],
   ["Qui déclenche ?","Vous, en cliquant","L'orchestrateur"],
   ["Contexte","Le nouvel agent voit la conversation","Le sous-agent ne voit que sa consigne"],
   ["Usage","Enchaînement manuel guidé","Orchestration (ce bonus)"]]},
  {t:"table",h:["Schéma d'orchestration","Principe","Utilisé ici ?"],r:[
   ["<b>Séquentiel</b> (pipeline)","Les agents travaillent l'un après l'autre, chacun sur la sortie du précédent","Oui : diagnostic, réécriture, contrôle"],
   ["<b>Superviseur</b>","Un agent central décide quel agent appeler et quand","Oui : l'orchestrateur"],
   ["<b>Producteur-critique</b>","Un agent produit, un autre critique, on boucle","Oui, borné à 2 boucles : Rédacteur puis Contrôleur"],
   ["<b>Parallèle</b>","Plusieurs agents en même temps sur des parties indépendantes","Non : le lot est petit et l'ordre compte"]]},
  {t:"why",x:"Le schéma retenu (séquentiel supervisé, avec une boucle bornée) est le plus simple à relire. Commencez toujours par le schéma le plus simple qui répond au besoin."}]},
 {t:"Risques et garde-fous",b:[
  {t:"table",h:["Risque","Ce qui peut arriver","Garde-fou de ce bonus"],r:[
   ["Boîte noire","Tout s'enchaîne, personne ne relit","Points de validation obligatoires, ligne d'état à chaque réponse"],
   ["Erreur en cascade","Un diagnostic faux produit 5 US fausses","Validation du diagnostic <b>avant</b> toute réécriture"],
   ["Orchestrateur qui « fait tout »","Il réécrit lui-même une US au lieu de déléguer","Interdit explicite : il n'écrit qu'un seul fichier, le compte rendu"],
   ["Perte de contexte","Le sous-agent ignore une décision prise avec vous","Consigne de délégation autonome, décisions recopiées"],
   ["Boucle sans fin","Rédacteur et Contrôleur se renvoient la balle","Deux boucles maximum, puis escalade à l'humain"],
   ["Dérive","L'orchestrateur appelle un agent non prévu","Liste fermée <code>agents:</code> dans l'en-tête"],
   ["Coût","Chaque sous-agent consomme des requêtes","Un sous-agent par étape, aucune délégation inutile"]]},
  {t:"no",x:"Un orchestrateur ne supprime jamais la validation humaine. S'il enchaîne deux étapes d'écriture sans vous demander, arrêtez-le et corrigez sa fiche."}]},
 {t:"Vérifier les prérequis et voir le résultat attendu",b:[
  {t:"ol",x:[
   "Vérifiez dans l'explorateur : <code>PLAN.md</code> à la racine, les trois agents dans <code>.github/agents</code> (<code>reviewer-backlog</code>, <code>redacteur-backlog</code>, <code>controleur-backlog</code>) et les trois skills (<code>revue-agilite</code>, <code>formater-us</code>, <code>verifier-regles-metier</code>).",
   "Dépliez <code>.github/skills/compte-rendu-html</code> : il contient un fichier fourni, <code>gabarit-dashboard.html</code>.",
   "Clic droit sur ce fichier > <code>Révéler dans l'Explorateur de fichiers</code> (<code>Reveal in File Explorer</code>), puis double-cliquez pour l'ouvrir dans le navigateur."]},
  {t:"see",x:"Un tableau de bord coloré avec un bandeau jaune « EXEMPLE FICTIF » : indicateurs, déroulé de l'orchestration, ce qui n'allait pas, US nettoyées avant / après avec filtres, contrôles, questions ouvertes, journal des validations."},
  {t:"why",x:"Le gabarit contient toute la mise en page. L'orchestrateur n'aura qu'à remplacer le <b>bloc de données</b> (JSON) par celles de votre lot. Le rendu reste identique d'un lot à l'autre, et une erreur de l'agent ne peut pas casser le style ni injecter de code."},
  {t:"warn",x:"Un agent ou une skill manque ? Terminez d'abord les Ateliers 2 et 3. Orchestrer des agents qui fonctionnent mal ne fait qu'enchaîner leurs erreurs plus vite."}]},
 {t:"Créer la skill compte-rendu-html",b:[
  {t:"ol",x:["Clic droit sur le dossier <code>.github/skills/compte-rendu-html</code> > <code>Nouveau fichier</code> > tapez exactement <code>SKILL.md</code>.","Collez le contenu ci-dessous, puis <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/skills/compte-rendu-html/SKILL.md",x:"---\nname: compte-rendu-html\ndescription: \"Produit le compte rendu HTML (tableau de bord) du traitement d'un lot SprintDesk : ce qui a été fait, ce qui n'allait pas, US nettoyées, contrôles, questions ouvertes, validations humaines. Utiliser en fin d'orchestration d'un lot.\"\n---\n# Skill compte-rendu-html\n\n## Quand l'utiliser\nEn fin d'orchestration, ou pour faire le bilan d'un lot déjà traité.\n\n## Sources (lire, ne rien inventer)\n- sprintdesk/resultats/revue.md : défauts (ce qui n'allait pas).\n- sprintdesk/resultats/synthese-actions.md : statut de chaque US.\n- sprintdesk/backlog/sortie/lot<N>/*.md : US nettoyées (besoin, critères, règles, questions).\n- Tableau du Contrôleur : contrôles.\n- Décisions prises aux points de validation : journal des validations.\n\n## Procédure\n1. Copier ¤gabarit-dashboard.html¤ (même dossier que cette skill) vers sprintdesk/resultats/compte-rendu-lot<N>.html.\n2. Remplacer uniquement le JSON situé entre les marqueurs DONNEES:DEBUT et DONNEES:FIN. Ne pas toucher au style ni au script.\n3. Garder exactement les clés du JSON du gabarit. Mettre \"exemple\": false.\n4. Valeurs autorisées. Statut d'une US d'entrée : modifiée, découpée, inchangée, bloquée, créée. Statut d'une étape : ok, ko, attente, bloque. Gravité : bloquant, recommandation. Contrôle : OK, KO. Décision : Validé, Corrigé, Rejeté.\n5. Une US inchangée a \"defauts\" vide et un seul résultat identique à l'entrée. Une US bloquée a \"resultats\" vide.\n6. Chaque ND-xx encore ouverte apparaît dans \"questions\", avec qui tranche (référent produit sauf mention contraire dans PLAN.md).\n7. Les chemins sont écrits depuis la racine du dépôt (ex. sprintdesk/backlog/sortie/lot{n}/US-{n}01.md).\n\n## Règles\n- Chaque valeur vient d'un fichier source ou d'une décision humaine notée. Rien n'est inventé ni embelli.\n- Texte brut uniquement : aucune balise HTML dans les valeurs.\n- Ne pas écrire de compteurs : le gabarit les calcule.\n- \"controlesExecutes\" ne liste que les contrôles réellement faits.\n\n## Vérification avant de rendre la main\n- Le JSON est valide (guillemets doubles, aucune virgule finale).\n- Le nombre d'US dans \"us\" est égal au nombre d'US d'entrée du lot.\n- Chaque US a un chemin \"source\"."},
  {t:"see",x:"Dans le dossier <code>compte-rendu-html</code> : <code>SKILL.md</code> et <code>gabarit-dashboard.html</code>."},
  {t:"why",x:"Même principe que <code>formater-us</code> avec <code>modele-us.md</code> : la skill décrit la <b>méthode</b>, le fichier annexe porte le <b>modèle</b>. La règle « chaque valeur vient d'un fichier » empêche un compte rendu enjolivé."}]},
 {t:"Créer l'agent orchestrateur-us",b:[
  {t:"ol",x:["<kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>P</kbd> > <code>Chat: New Custom Agent</code> > <code>.github/agents</code> > nom : <code>orchestrateur-us</code>.","<kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez le contenu ci-dessous, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/agents/orchestrateur-us.agent.md",x:"---\ndescription: \"Orchestre le traitement d'un lot de user stories SprintDesk : planifie, délègue au Reviewer, au Rédacteur et au Contrôleur, s'arrête à chaque validation humaine, puis produit un compte rendu HTML. Utiliser pour dérouler PLAN.md de bout en bout.\"\ntools: ['agent', 'read', 'search', 'edit']\nagents: ['reviewer-backlog', 'redacteur-backlog', 'controleur-backlog']\n---\n# Orchestrateur US (Planificateur-Contrôleur)\n\n## Rôle\nChef d'orchestre du traitement d'un lot : tu planifies, tu délègues, tu contrôles, tu rends compte.\nTu ne fais jamais toi-même le travail d'un autre agent : tu ne diagnostiques pas, tu ne réécris pas, tu ne corriges aucune US.\n\n## Entrées\n- PLAN.md : le contrat. Il prime sur toute improvisation.\n- sprintdesk/contexte/produit.md et sprintdesk/contexte/regles-metier.md.\n- Les US du lot dans sprintdesk/backlog/entree/lot<N>/.\n\n## Équipe\n| Sous-agent | Skill | Livrable |\n|---|---|---|\n| reviewer-backlog | revue-agilite | sprintdesk/resultats/revue.md |\n| redacteur-backlog | formater-us | sprintdesk/backlog/sortie/lot<N>/ et sprintdesk/resultats/synthese-actions.md |\n| controleur-backlog | verifier-regles-metier | Tableau de contrôle dans sa réponse |\n| toi | compte-rendu-html | sprintdesk/resultats/compte-rendu-lot<N>.html |\n\n## Déroulé (une étape à la fois)\n0. Préparer : vérifier PLAN.md, les trois agents et les US du lot. Présenter le plan d'exécution (étape, agent, skill, livrable, arrêt). Puis POINT DE VALIDATION 0.\n1. Diagnostiquer : déléguer à reviewer-backlog. Vérifier que revue.md existe et couvre toutes les US. Résumer les constats et lister les ND-xx rencontrées. Puis POINT DE VALIDATION 1.\n2. Réécrire : déléguer à redacteur-backlog en recopiant les décisions validées au point 1. Vérifier que chaque US d'entrée a au moins un fichier de sortie ou le statut « bloquée ».\n3. Contrôler : déléguer à controleur-backlog (lecture seule). Récupérer son tableau. Puis POINT DE VALIDATION 2.\n4. Corriger, seulement si l'humain le demande : renvoyer au Rédacteur uniquement les lignes KO, puis recontrôler. Deux boucles maximum, ensuite escalader à l'humain.\n5. Rendre compte : appliquer la skill compte-rendu-html. Donner le chemin du fichier.\n\n## Points de validation humaine\nÀ chaque point, arrête-toi. Termine ta réponse par ce bloc, puis attends :\n¤¤¤\nPOINT DE VALIDATION n — <nom>\nFait : ...\nÀ vérifier par vous : ...\nDécisions à prendre (ND-xx) : ...\nRépondez : VALIDER | CORRIGER : <précision> | ARRÊTER\n¤¤¤\n- Sans « VALIDER » explicite, ne passe pas à l'étape suivante.\n- « CORRIGER » : refais seulement l'étape concernée, avec la précision donnée.\n- « ARRÊTER » : produis le compte rendu de ce qui a été fait, étapes restantes au statut « attente ».\n- Note chaque décision (étape, décision, par qui, commentaire) : elle alimente le journal du compte rendu.\n\n## Règles de délégation\n- Un sous-agent ne voit pas cette conversation. Chaque consigne est autonome : lot, fichiers à lire, fichier à écrire, décisions validées, interdits.\n- Rappelle toujours au sous-agent : ne trancher aucune ND-xx, ne pas modifier sprintdesk/backlog/entree/, ne rien publier.\n- Si un sous-agent échoue ou sort de son rôle, signale-le à l'humain. Ne compense jamais en faisant le travail toi-même.\n\n## Interdits\n- Ne trancher aucune décision non prise (ND-01 à ND-06).\n- N'écrire toi-même qu'un seul fichier : le compte rendu HTML.\n- Ne jamais lancer une étape d'écriture sans validation humaine de l'étape précédente.\n- Ne rien publier vers un service externe.\n\n## État d'avancement\nCommence chaque réponse par une ligne d'état : Étape x/5 · Agent en cours · Dernier livrable · Prochain point de validation.\n\n## Conditions d'arrêt\nArrête-toi et demande si : PLAN.md ou un agent manque, deux sources se contredisent, une décision métier est requise, deux boucles de correction n'ont pas suffi.\n\n## Fin de réponse\nIndiquer les contrôles réellement exécutés."},
  {t:"table",h:["Élément de la fiche","Pourquoi il est là"],r:[
   ["<code>tools: ['agent', ...]</code>","L'outil <code>agent</code> permet d'appeler un sous-agent. Sans lui, pas d'orchestration."],
   ["<code>agents: [...]</code>","<b>Liste fermée</b> des sous-agents autorisés. Les noms doivent être identiques aux noms des fichiers, sans <code>.agent.md</code>."],
   ["<code>edit</code>","Nécessaire pour écrire le compte rendu. L'interdit limite son usage à ce seul fichier."],
   ["Déroulé numéroté","L'orchestrateur sait où il en est et vous aussi (ligne d'état)."],
   ["Bloc POINT DE VALIDATION","Format fixe : vous savez toujours quoi vérifier et quoi répondre."],
   ["Règles de délégation","Compensent le contexte isolé des sous-agents."]]},
  {t:"warn",x:"L'agent n'apparaît pas ? Mêmes vérifications que pour le Contrôleur (dossier, extension <code>.agent.md</code>, <code>---</code> en première ligne, <code>Developer: Reload Window</code>). Clic droit dans le chat > <code>Diagnostics</code> affiche les erreurs de chargement des agents et des skills."}]},
 {t:"Lancer l'orchestration",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>).","Sélecteur d'agent : <code>orchestrateur-us</code>.","Collez le prompt ci-dessous."]},
  {t:"copy",l:"À COPIER (mode orchestrateur-us)",x:"Orchestre le traitement du lot {n} en suivant PLAN.md.\nCommence par l'étape 0 et arrête-toi à chaque point de validation."},
  {t:"see",x:"Une ligne d'état, un plan d'exécution en tableau (étape, agent, skill, livrable, arrêt), puis un bloc de validation comme celui-ci. <b>Aucun fichier n'est encore écrit.</b>"},
  {t:"mock",x:"Étape 0/5 · Agent en cours : orchestrateur-us · Dernier livrable : aucun · Prochain point : validation 0\n\nPOINT DE VALIDATION 0 — Lancement\nFait : PLAN.md lu, 3 agents trouvés, 5 US dans le lot {n}.\nÀ vérifier par vous : l'ordre des étapes correspond à la section 7 de PLAN.md.\nDécisions à prendre (ND-xx) : aucune à ce stade.\nRépondez : VALIDER | CORRIGER : <précision> | ARRÊTER"},
  {t:"p",x:"Pendant l'exécution, chaque sous-agent apparaît dans le chat comme un <b>appel d'outil repliable</b> portant son nom. Cliquez dessus : vous voyez la consigne qu'il a reçue et le résultat qu'il a rendu."},
  {t:"warn",x:"L'orchestrateur fait le travail lui-même au lieu d'appeler un sous-agent ? Vérifiez que <code>'agent'</code> est bien dans <code>tools</code> et que les noms de <code>agents:</code> correspondent exactement à vos fichiers. Si l'outil reste introuvable, l'environnement d'exécution choisi pour la session ne le propose peut-être pas : demandez à l'animateur."}]},
 {t:"Tenir votre rôle aux points de validation",b:[
  {t:"p",x:"C'est l'étape la plus importante du bonus. L'orchestrateur propose, <b>vous décidez</b>. Ouvrez toujours le livrable avant de répondre."},
  {t:"table",h:["Point","Ce que vous vérifiez","Réponse type"],r:[
   ["<b>0 — Lancement</b>","Les étapes suivent <code>PLAN.md</code> ; les bons agents et skills sont annoncés","<code>VALIDER</code>"],
   ["<b>1 — Diagnostic</b>","Ouvrez <code>sprintdesk/resultats/revue.md</code> : chaque constat cite une RM-xx ou ND-xx ; l'US-{n}05 est en « Aucune action » ; aucune règle inventée","<code>VALIDER</code> ou <code>CORRIGER : ...</code>"],
   ["<b>2 — Résultat</b>","Ouvrez les US de <code>backlog/sortie/lot{n}/</code> ; lisez le tableau du Contrôleur ; aucune ND-xx tranchée","<code>VALIDER</code>, <code>CORRIGER : relancer le Rédacteur sur les KO</code> ou <code>ARRÊTER</code>"]]},
  {t:"copy",l:"Exemple — corriger le diagnostic",x:"CORRIGER : le constat sur l'US-{n}03 cite une règle absente de regles-metier.md. Demande au Reviewer de le retirer ou de le transformer en question ouverte, puis présente de nouveau le point de validation 1."},
  {t:"copy",l:"Exemple — transmettre une décision du groupe",x:"VALIDER. Décisions du groupe à transmettre au Rédacteur : l'US-{n}02 est découpée en deux US. Toutes les ND-xx restent en questions ouvertes, à trancher par le référent produit."},
  {t:"copy",l:"Exemple — corriger après contrôle",x:"CORRIGER : relance le Rédacteur uniquement sur les lignes KO du tableau de contrôle, puis relance le Contrôleur. Ne touche pas aux US qui sont OK."},
  {t:"no",x:"Ne répondez jamais <code>VALIDER</code> sans avoir ouvert le fichier concerné. Un point de validation non exercé transforme l'orchestrateur en boîte noire."},
  {t:"why",x:"Vos réponses sont notées par l'orchestrateur : elles forment le <b>journal des validations</b> du compte rendu. On saura qui a décidé quoi, et à quelle étape."}]},
 {t:"Ouvrir le compte rendu HTML",b:[

  {t:"p",x:"Si le résultat orchestré est moins bon, appliquez la méthode d'évaluation : <b>un défaut, une cause</b> (orchestrateur, sous-agent, skill, consigne de délégation), <b>une seule modification</b>, puis rejouez."},

{icon:"🚀",title:"Pour aller bien plus loin",sub:"Hooks, contexte, modèles, évaluation",
 goal:"Vous passez de règles écrites à des garde-fous appliqués : vous bloquez les écritures interdites avec un hook, vous apprenez à gérer la mémoire de Copilot sur un lot de 5 US, vous comparez deux modèles, puis vous mesurez vos agents avec un jeu d'évaluation.",
 steps:[
 {t:"Vue d'ensemble : de « Copilot doit » à « Copilot ne peut pas »",b:[
  {t:"p",x:"Jusqu'ici, vous avez cadré Copilot avec des <b>mots</b> : instructions, plan, agents, skills. Un mot se lit, mais le modèle peut l'oublier ou l'appliquer de travers. Cette partie ajoute quatre mécanismes pour aller plus loin, avec des exemples tirés de SprintDesk."},
  {t:"table",h:["Concept","Question à laquelle il répond","Exemple SprintDesk","Étapes"],r:[
   ["<b>Hooks</b>","Comment <b>empêcher</b> une action, au lieu de la déconseiller ?","Interdire toute écriture dans <code>sprintdesk/backlog/entree/</code> et <code>sprintdesk/contexte/</code>","2 à 4"],
   ["<b>Gestion du contexte</b>","Que faire quand la conversation devient trop longue ?","Traiter 5 US sans perdre les décisions déjà prises","5 et 6"],
   ["<b>Choix du modèle et coût</b>","Quel modèle pour quelle tâche, et à quel prix ?","Un modèle léger pour le Contrôleur, un modèle plus puissant pour la revue ?","7 et 8"],
   ["<b>Jeu d'évaluation</b>","Comment savoir si une modification améliore vraiment ?","Les 20 US des lots 1 à 4 comme banc d'essai","9 et 10"]]},
  {t:"p",x:"Observez d'abord vos propres règles. Certaines peuvent être <b>appliquées</b> par un mécanisme. D'autres ne peuvent qu'être <b>mesurées</b>."},
  {t:"table",h:["Règle du projet","Où elle est écrite aujourd'hui","Comment la renforcer"],r:[
   ["Ne pas modifier <code>backlog/entree/</code> ni <code>contexte/</code>","Texte dans <code>copilot-instructions.md</code>","<b>Hook</b> : l'écriture est refusée avant d'avoir lieu (étape 4)"],
   ["Ne rien publier vers un service externe sans validation","Texte dans les instructions","<b>Hook</b> : refus d'un <code>git push</code> lancé par l'agent (étape 4)"],
   ["Le Contrôleur ne modifie rien","Liste <code>tools</code> de l'agent (pas d'outil d'écriture)","Déjà appliquée par les outils de l'agent"],
   ["Ne pas trancher une décision non prise (ND-xx)","Instructions et skills","Aucun hook possible : on la <b>mesure</b> avec le jeu d'évaluation (étapes 9 et 10)"]]},
  {t:"mock",x:"Niveau de garantie       Mécanisme            Exemple                        Faiblesse\n─────────────────────────────────────────────────────────────────────────────────────\nfaible                   un prompt            « ne modifie pas entree/ »     oubliable\n                         les instructions     règle permanente               mal appliquable\n                         les outils (tools)   agent sans outil d'écriture    limité à cet agent\nfort                     un hook              refus automatique              à tester, à relire"},
  {t:"why",x:"Pour chaque règle importante, posez-vous la question : <b>peut-on la rendre impossible à enfreindre ?</b> Si oui, ajoutez un mécanisme. Sinon, mesurez-la."}]},
 {t:"Hooks : un garde-fou qui s'exécute à chaque fois",b:[
  {t:"p",x:"Un <b>hook</b> est un petit programme que VS Code lance <b>à un moment précis</b> du travail de l'agent, sans que le modèle ait à y penser. Il peut observer, ajouter une information, ou <b>refuser</b> une action."},
  {t:"p",x:"<b>Analogie :</b> un portique de sécurité à l'entrée d'un bâtiment. Il ne dépend pas de la bonne volonté de la personne qui entre : il s'applique à chaque passage."},
  {t:"table",h:["Moment (événement)","Ce qui se passe","Idée pour SprintDesk"],r:[
   ["<code>sessionStart</code>","Une session démarre","Rappeler le lot et les règles en cours"],
   ["<code>userPromptSubmitted</code>","Vous envoyez un message","Journaliser la demande"],
   ["<code>preToolUse</code>","<b>Juste avant</b> qu'un outil soit utilisé : peut le refuser","<b>Bloquer l'écriture dans <code>entree/</code> et <code>contexte/</code></b>"],
   ["<code>postToolUse</code>","Juste après un outil","Vérifier ou consigner le résultat (ne peut pas annuler)"],
   ["<code>preCompact</code>","Avant le résumé d'une longue conversation","Sauvegarder les décisions du lot (lien avec l'étape 5)"],
   ["<code>subagentStart</code> / <code>subagentStop</code>","Un sous-agent démarre / se termine","Tracer les appels de l'orchestrateur"],
   ["<code>agentStop</code>","L'agent veut s'arrêter","Vérifier que le livrable existe"],
   ["<code>sessionEnd</code>","La session se termine","Écrire un journal de fin"]]},
  {t:"table",h:["Étape","Ce qui se passe"],r:[
   ["1","Un fichier <code>.github/hooks/xxx.json</code> déclare : « à tel événement, lance telle commande »"],
   ["2","L'agent s'apprête à agir (ex. modifier un fichier) : VS Code lance la commande"],
   ["3","La commande reçoit les détails de l'action, au format JSON"],
   ["4","Elle répond <code>{}</code> (rien à dire : l'action continue) ou un <b>refus</b> accompagné d'un message"],
   ["5","En cas de refus, l'agent voit le message et peut changer de méthode"]]},
  {t:"warn",x:"À savoir avant d'utiliser les hooks : <b>1)</b> la fonction est en préversion (<i>Preview</i>) et peut changer ; <b>2)</b> les exemples de cette partie visent la session <b>Copilot</b> (sélecteur de session du chat) : le format diffère en session <b>Local</b> ; <b>3)</b> <b>Node.js</b> doit être installé ; <b>4)</b> un hook est du <b>code qui s'exécute sur votre poste</b> : relisez-le toujours avant de l'activer ; <b>5)</b> si le hook dépasse son délai, l'action suit les règles de permission normales."},
  {t:"warn",x:"Les commandes <code>/</code> de l'étape « Premiers prompts » (fichiers de prompt) fonctionnent en session <b>Local</b>. Les hooks de cette partie fonctionnent en session <b>Copilot</b>. Vous ne les testerez donc pas dans le même chat : ouvrez un nouveau chat avec la bonne session.<br>Si votre sélecteur ne propose pas la session Copilot, demandez à l'animateur."},
  {t:"no",x:"Un hook est un <b>garde-fou</b>, pas une serrure. Il ne remplace ni les permissions de VS Code, ni la relecture humaine. Ne placez jamais de mot de passe ou de jeton dans un hook, et ne consignez pas le contenu des demandes."}]},
 {t:"Hooks, pas à pas (1/2) : voir ce que fait Copilot",b:[
  {t:"p",x:"Avant d'interdire quelque chose, il faut savoir <b>comment s'appellent les outils</b> que Copilot utilise : les noms varient d'un environnement à l'autre. Vous allez d'abord installer un hook qui se contente de <b>noter</b> chaque outil dans un journal."},
  {t:"ol",x:[
   "Vérifiez Node.js : <code>Terminal</code> > <code>Nouveau terminal</code>, tapez <code>node --version</code>. Un numéro de version doit s'afficher. Sinon, prévenez l'animateur.",
   "Dans l'explorateur, clic droit sur <code>.github</code> > <code>Nouveau dossier</code> > <code>hooks</code>.",
   "Dans <code>hooks</code>, créez le fichier <code>audit.json</code> et collez le premier bloc ci-dessous.",
   "Dans <code>hooks</code>, créez le fichier <code>log-tool-use.cjs</code> et collez le second bloc. Enregistrez les deux (<kbd>Ctrl</kbd>+<kbd>S</kbd>).",
   "Ouvrez ou créez le fichier <code>.gitignore</code> à la racine et ajoutez la ligne <code>.github/hooks/tool-use.log</code> : ce journal reste sur votre poste."]},
  {t:"copy",l:"À COPIER dans .github/hooks/audit.json",x:"{\n  \"version\": 1,\n  \"hooks\": {\n    \"preToolUse\": [\n      {\n        \"type\": \"command\",\n        \"command\": \"node .github/hooks/log-tool-use.cjs\",\n        \"timeoutSec\": 10\n      }\n    ]\n  }\n}"},
  {t:"copy",l:"À COPIER dans .github/hooks/log-tool-use.cjs",x:"const fs = require('node:fs');\nconst path = require('node:path');\nconst NL = String.fromCharCode(10);\n\nconst event = JSON.parse(fs.readFileSync(0, 'utf8'));\nlet args = event.toolArgs ?? {};\nif (typeof args === 'string') {\n  try { args = JSON.parse(args); } catch { args = {}; }\n}\nif (!args || typeof args !== 'object') args = {};\n\n// On note le nom de l'outil et les NOMS des arguments, jamais leurs valeurs.\nconst ligne = new Date().toISOString() + ' | ' + event.toolName + ' | ' + Object.keys(args).join(', ') + NL;\nfs.appendFileSync(path.join(__dirname, 'tool-use.log'), ligne);\n\nprocess.stdout.write('{}');"},
  {t:"table",h:["Élément","Rôle"],r:[
   ["<code>preToolUse</code>","Le hook se déclenche avant chaque utilisation d'un outil"],
   ["<code>command</code>","La commande lancée, depuis la racine du dépôt"],
   ["<code>timeoutSec</code>","Délai maximal : au-delà, le hook est abandonné"],
   ["<code>process.stdout.write('{}')</code>","Réponse « rien à signaler » : l'action continue"]]},
  {t:"ol",x:[
   "Ouvrez un <b>nouveau chat</b>, session <b>Copilot</b>, mode Agent.",
   "Tapez <code>/hooks</code> : la liste doit contenir votre hook <code>preToolUse</code>.",
   "Envoyez : <code>Lis #produit.md et résume-le en 3 lignes.</code>",
   "Ouvrez le fichier <code>.github/hooks/tool-use.log</code>."]},
  {t:"see",x:"Une ou plusieurs lignes du type <code>date | nom-de-l-outil | noms, des, arguments</code>. <b>Notez le nom des outils d'écriture</b> si vous en voyez (ils contiennent souvent <i>edit</i>, <i>create</i>, <i>write</i> ou <i>patch</i>). Le hook de l'étape suivante en a besoin."},
  {t:"warn",x:"Le journal reste vide ? <b>1)</b> <code>/hooks</code> liste-t-il le hook ? <b>2)</b> La session est-elle bien <b>Copilot</b> ? <b>3)</b> <code>node --version</code> répond-il dans un terminal ? <b>4)</b> Les deux fichiers sont-ils enregistrés dans <code>.github/hooks</code> ? Sinon, appelez l'animateur."},
  {t:"why",x:"On ne protège bien que ce que l'on observe. Ce journal vous montre ce que fait réellement l'agent. Il peut aussi servir de piste d'audit : qui a fait quoi, et quand."}]},
 {t:"Hooks, pas à pas (2/2) : protéger les sources du projet",b:[
  {t:"p",x:"Objectif : rendre <b>impossibles</b> les deux interdits que SprintDesk n'avait jusqu'ici qu'écrits dans un texte."},
  {t:"table",h:["Règle du hook","Effet"],r:[
   ["Écriture visant <code>sprintdesk/backlog/entree/</code> ou <code>sprintdesk/contexte/</code>","<b>Refusée</b>, avec un message explicatif"],
   ["Commande de terminal qui cite l'un de ces dossiers <b>et</b> un verbe d'écriture (<code>&gt;</code>, <code>Set-Content</code>, <code>Remove-Item</code>, <code>rm</code>, <code>mv</code>...)","<b>Refusée</b>"],
   ["Commande de terminal contenant <code>git push</code>","<b>Refusée</b> : la publication reste humaine"],
   ["Tout le reste (lecture, écriture dans <code>sortie/</code> ou <code>resultats/</code>)","Autorisé"]]},
  {t:"ol",x:[
   "Dans <code>.github/hooks</code>, créez <code>protege-sources.json</code> et collez le premier bloc.",
   "Créez <code>protege-sources.cjs</code> et collez le second bloc. Enregistrez les deux.",
   "Désactivez le hook d'audit de l'étape précédente seulement si vous le souhaitez : les deux peuvent coexister."]},
  {t:"copy",l:"À COPIER dans .github/hooks/protege-sources.json",x:"{\n  \"version\": 1,\n  \"hooks\": {\n    \"preToolUse\": [\n      {\n        \"type\": \"command\",\n        \"command\": \"node .github/hooks/protege-sources.cjs\",\n        \"timeoutSec\": 10\n      }\n    ]\n  }\n}"},
  {t:"copy",l:"À COPIER dans .github/hooks/protege-sources.cjs",x:"const fs = require('node:fs');\nconst BS = String.fromCharCode(92);\nconst NL = String.fromCharCode(10);\n\nconst PROTEGES = ['sprintdesk/backlog/entree', 'sprintdesk/contexte'];\nconst OUTILS_ECRITURE = ['edit', 'write', 'create', 'patch', 'replace', 'delete', 'insert', 'rename', 'move'];\nconst OUTILS_SHELL = ['bash', 'powershell', 'shell', 'terminal', 'command'];\nconst VERBES_ECRITURE = ['>', ' set-content ', ' add-content ', ' out-file ', ' remove-item ', ' move-item ', ' copy-item ', ' new-item ', ' rm ', ' mv ', ' cp ', ' tee ', ' sed '];\n\nconst event = JSON.parse(fs.readFileSync(0, 'utf8'));\nconst nom = String(event.toolName || event.tool_name || '').toLowerCase();\nlet args = event.toolArgs ?? event.tool_input ?? {};\nif (typeof args === 'string') {\n  try { args = JSON.parse(args); } catch { args = { command: args }; }\n}\nif (!args || typeof args !== 'object') args = {};\n\nconst normaliser = (texte) => String(texte).split(BS).join('/').toLowerCase();\n\n// On ne regarde que les arguments qui designent un fichier, pas le contenu ecrit :\n// une US de sortie a le droit de citer le chemin de sa source.\nfunction chemins(valeur, cle) {\n  if (typeof valeur === 'string') return /^(file_?path|path|file|filename|uri|target|files|paths)$/i.test(cle) ? [valeur] : [];\n  if (Array.isArray(valeur)) return valeur.flatMap((v) => chemins(v, cle));\n  if (valeur && typeof valeur === 'object') return Object.entries(valeur).flatMap(([k, v]) => chemins(v, k));\n  return [];\n}\n\n// Outils de type patch : les fichiers visés sont dans les lignes d'en-tête \"*** \".\nconst entetesPatch = Object.values(args)\n  .filter((v) => typeof v === 'string')\n  .join(NL).split(NL)\n  .filter((ligne) => ligne.startsWith('*** '));\n\nconst cibles = [...chemins(args, ''), ...entetesPatch].map(normaliser);\nconst commande = ' ' + normaliser(args.command || '') + ' ';\n\nfunction refuser(raison) {\n  process.stdout.write(JSON.stringify({ permissionDecision: 'deny', permissionDecisionReason: raison }));\n  process.exit(0);\n}\n\nconst estEcriture = OUTILS_ECRITURE.some((m) => nom.includes(m));\nconst estShell = OUTILS_SHELL.some((m) => nom.includes(m));\nconst dossierVise = cibles.some((c) => PROTEGES.some((p) => c.includes(p)));\nconst commandeVisee = PROTEGES.some((p) => commande.includes(p));\n\nif (estEcriture && dossierVise) {\n  refuser('Dossier protege : sprintdesk/backlog/entree et sprintdesk/contexte ne se modifient pas. Ecrivez dans sprintdesk/backlog/sortie ou sprintdesk/resultats.');\n}\nif (estShell && commandeVisee && VERBES_ECRITURE.some((v) => commande.includes(v))) {\n  refuser('Commande refusee : elle semble modifier un dossier protege (entree ou contexte).');\n}\nif (estShell && commande.includes('git push')) {\n  refuser('Publication refusee : un git push se fait par un humain, apres validation.');\n}\n\nprocess.stdout.write('{}');"},
  {t:"table",h:["Partie du script","En clair"],r:[
   ["<code>PROTEGES</code>","La liste des deux dossiers interdits d'écriture"],
   ["<code>chemins(...)</code>","Repère <b>uniquement</b> les arguments qui désignent un fichier. Le contenu écrit n'est pas examiné : sinon, une US de <code>sortie/</code> qui cite sa source serait refusée à tort"],
   ["<code>normaliser</code>","Remplace les <code>\\</code> de Windows par des <code>/</code> et passe en minuscules, pour comparer correctement"],
   ["<code>refuser(...)</code>","Répond <code>deny</code> avec un message que l'agent lit"],
   ["Dernière ligne <code>{}</code>","En l'absence de motif de refus, l'action continue"]]},
  {t:"p",x:"<b>Testez dans cet ordre.</b> Nouveau chat, session Copilot, mode Agent."},
  {t:"copy",l:"TEST 1 — doit être REFUSÉ",x:"Ajoute une ligne « test » à la fin de #US-{n}01.md."},
  {t:"see",x:"L'action est <b>refusée</b>, avec le message du hook (« Dossier protege... »). Le fichier <code>US-{n}01.md</code> est inchangé. L'agent propose souvent d'écrire ailleurs."},
  {t:"copy",l:"TEST 2 — doit être AUTORISÉ (lecture)",x:"Lis #US-{n}01.md et résume-la en une phrase."},
  {t:"copy",l:"TEST 3 — doit être AUTORISÉ (écriture dans resultats, avec une citation de la source)",x:"Crée le fichier sprintdesk/resultats/essai-hook.md contenant une seule ligne : « Source : sprintdesk/backlog/entree/lot{n}/US-{n}01.md »."},
  {t:"see",x:"Le fichier <code>essai-hook.md</code> est créé : le hook regarde le <b>chemin</b> de destination, pas le texte écrit. Supprimez-le ensuite (clic droit > <code>Supprimer</code>)."},
  {t:"warn",x:"Le test 1 n'est pas refusé ? <b>1)</b> Ouvrez <code>tool-use.log</code> : le nom de l'outil d'écriture contient-il <i>edit</i>, <i>write</i>, <i>create</i>, <i>patch</i> ou <i>replace</i> ? Sinon, ajoutez son nom dans <code>OUTILS_ECRITURE</code>. <b>2)</b> <code>/hooks</code> liste-t-il <code>protege-sources</code> ? <b>3)</b> Si le fichier a été modifié, bouton <code>Annuler</code> du chat ou <kbd>Ctrl</kbd>+<kbd>Z</kbd>."},
  {t:"warn",x:"<b>Limites à connaître.</b> Le refus de <code>git push</code> n'est volontairement <b>pas testé</b> en atelier, pour ne rien publier par erreur. Le contrôle des commandes de terminal repose sur une liste de verbes : un terminal permet beaucoup de contournements. Ce hook réduit le risque, il ne le supprime pas."},
  {t:"table",h:["Autre idée de hook","Événement","À quoi ça sert"],r:[
   ["Journal d'audit des outils utilisés","<code>preToolUse</code>","Savoir ce qu'a fait l'agent (étape précédente)"],
   ["Hook limité à un seul agent (par exemple le Rédacteur)","dans l'en-tête de la fiche de l'agent","Appliquer une règle à un rôle seulement. Voir la documentation des hooks"],
   ["Sauvegarde des décisions avant résumé","<code>preCompact</code>","Ne pas perdre les décisions du lot (étape 5)"],
   ["Contrôle avant arrêt de l'agent","<code>agentStop</code>","Vérifier que <code>revue.md</code> existe avant de conclure"]]},
  {t:"why",x:"Le même interdit existe maintenant <b>deux fois</b> : écrit dans les instructions (Copilot sait pourquoi) et appliqué par le hook (Copilot ne peut pas l'enfreindre). Les deux se complètent."}]},
 {t:"Gestion du contexte : quand Copilot « oublie »",b:[
  {t:"p",x:"Copilot ne garde pas votre conversation « en tête » sans limite. Il travaille dans une <b>fenêtre de contexte</b> de taille fixe. <b>Analogie :</b> une table de travail. Quand elle est pleine, il faut ranger : les papiers du début disparaissent ou sont résumés."},
  {t:"table",h:["Ce qui remplit la fenêtre","Exemple SprintDesk"],r:[
   ["Vos messages et les réponses","5 diagnostics d'US enchaînés dans le même chat"],
   ["Les fichiers joints avec <kbd>#</kbd>","<code>regles-metier.md</code> + 5 US + <code>produit.md</code>"],
   ["Les résultats des outils","Lecture de fichiers, recherches dans le dépôt"],
   ["Les instructions permanentes","<code>copilot-instructions.md</code>, toujours présent"]]},
  {t:"table",h:["Signe de saturation","Ce que vous observez"],r:[
   ["Oubli","Copilot ignore une décision prise 20 messages plus tôt"],
   ["Contradiction","Il propose l'inverse d'une réponse précédente"],
   ["Dérive","Il cite moins les RM-xx ou n'applique plus le format de l'US"],
   ["Invention","Il comble un trou avec une règle plausible mais fausse"]]},
  {t:"table",h:["Levier","Comment","Quand l'utiliser"],r:[
   ["<b>Surveiller</b>","Jauge de la fenêtre de contexte, dans la zone de saisie du chat. Survolez-la : détail de l'occupation","Régulièrement, et dès qu'un signe apparaît"],
   ["<b>Compacter</b>","Tapez <code>/compact</code>, éventuellement suivi d'une consigne. VS Code le fait aussi seul quand la fenêtre est pleine","Vous voulez <b>poursuivre</b> le même travail"],
   ["<b>Repartir à zéro</b>","Nouveau chat (<code>+</code>). Les fichiers enregistrés et les instructions permanentes sont conservés","Le sujet <b>change</b>, ou la conversation est brouillée"],
   ["<b>Bifurquer</b>","<code>/fork</code> (selon le type de session) : copie la conversation pour explorer une autre piste","Vous voulez tester sans perdre l'original"],
   ["<b>Écrire dans un fichier</b>","Les décisions vont dans un <b>journal</b> du dépôt, joint avec <kbd>#</kbd>","Toute décision qui doit <b>survivre</b> à la conversation"]]},
  {t:"mock",x:"Copilot se trompe ou oublie ?\n ├─ Une décision doit survivre ?   -> l'écrire dans un fichier (journal) et le joindre avec #\n ├─ Même travail, chat très long ?  -> /compact + consigne de ce qu'il faut garder\n ├─ Nouveau sujet ou chat brouillé ? -> nouveau chat + fichiers # utiles\n └─ Autre piste à tester ?          -> /fork"},
  {t:"warn",x:"Un résumé <b>perd des détails</b>. Après un <code>/compact</code>, vérifiez que les décisions et les ND-xx ouvertes sont toujours là : demandez-les explicitement. La fonction <code>/fork</code> dépend du type de session : si la commande n'existe pas chez vous, ignorez-la."},
  {t:"why",x:"Ce qui doit survivre ne doit pas vivre <b>seulement</b> dans le chat. Le chat est une mémoire de travail, le dépôt est la mémoire durable."}]},
 {t:"Contexte en pratique : traiter un lot sans perdre les décisions",b:[
  {t:"p",x:"Scénario : vous traitez les 5 US du lot {n} dans la même conversation. Vous prenez des décisions au fil de l'eau. Vous allez voir ce qui se perd, puis le corriger."},
  {t:"ol",x:[
   "Créez le fichier <code>sprintdesk/resultats/journal-decisions-lot{n}.md</code> (clic droit sur <code>resultats</code> > <code>Nouveau fichier</code>) et collez le modèle ci-dessous.",
   "Nouveau chat. Analysez <b>US-{n}01, puis US-{n}02, puis US-{n}03</b>, une par message (commande <code>/diagnostiquer-us</code> ou prompt à 6 blocs).",
   "Après chaque US, notez <b>votre</b> décision dans le journal. Exemple : « US-{n}02 : à découper en deux, décision du groupe ».",
   "Survolez la jauge de contexte et notez son niveau."]},
  {t:"copy",l:"À COPIER dans sprintdesk/resultats/journal-decisions-lot{n}.md",x:"# Journal des décisions — lot {n}\n\nCe fichier est la mémoire durable du lot. Il est joint à chaque nouveau chat.\n\n| US | Décision prise (et par qui) | ND-xx restées ouvertes |\n|---|---|---|\n| US-{n}01 | | |\n| US-{n}02 | | |\n| US-{n}03 | | |\n| US-{n}04 | | |\n| US-{n}05 | | |"},
  {t:"p",x:"<b>Expérience de l'oubli.</b> Ouvrez un <b>nouveau chat</b>, sans rien joindre, et posez :"},
  {t:"copy",l:"À COPIER (nouveau chat, sans journal)",x:"Quelles décisions avons-nous prises sur US-{n}02 ?"},
  {t:"see",x:"Copilot ne peut pas le savoir. Observez sa réaction : il l'avoue, ou il <b>invente</b> une décision. Une réponse inventée est un signal d'alarme à retenir."},
  {t:"copy",l:"À COPIER (même question, avec le journal joint par #)",x:"En t'appuyant uniquement sur #journal-decisions-lot{n}.md, quelles décisions ont été prises sur US-{n}02 ? Si le fichier ne le dit pas, réponds « non renseigné »."},
  {t:"see",x:"Une réponse fidèle au fichier, ou « non renseigné » : le journal joue son rôle de mémoire durable."},
  {t:"p",x:"<b>Compactage.</b> Revenez dans le long chat et lancez :"},
  {t:"copy",l:"À COPIER (dans le long chat)",x:"/compact Conserve : les décisions prises sur chaque US, les ND-xx restées ouvertes, la liste des US déjà traitées. Oublie le détail des tableaux de diagnostic."},
  {t:"copy",l:"À COPIER (vérification après compactage)",x:"Rappelle-moi les décisions prises et les ND-xx encore ouvertes, US par US. Ne comble aucun trou."},
  {t:"see",x:"Un récapitulatif cohérent avec votre journal. S'il manque une décision, le résumé a perdu de l'information : le journal reste la référence."},
  {t:"ol",x:["Ouvrez un <b>nouveau chat</b> et joignez <code>#journal-decisions-lot{n}.md</code>, <code>#regles-metier.md</code> et <code>#US-{n}04.md</code>.","Demandez la revue de US-{n}04, puis de US-{n}05, en précisant de respecter les décisions du journal."]},
  {t:"table",h:["Situation","Bon réflexe"],r:[
   ["Vous venez de prendre une décision","L'écrire dans le journal <b>tout de suite</b>"],
   ["La conversation dépasse 10 échanges ou la jauge monte","<code>/compact</code> avec consigne, puis vérifier"],
   ["Vous changez de lot","Nouveau chat + nouveau journal"],
   ["Copilot affirme une décision que vous ne reconnaissez pas","Demander la source dans le journal ; sinon la considérer comme inventée"]]},
  {t:"why",x:"Compacter, c'est accepter de perdre un peu. Le journal, c'est décider <b>de ce qu'on ne veut jamais perdre</b>. Combinés, ils permettent de traiter un gros lot sans reprendre à zéro."}]},
 {t:"Choix du modèle et coût",b:[
  {t:"p",x:"Un <b>modèle</b> est le « cerveau » qui répond dans le chat. On le choisit dans le sélecteur de modèle de la zone de saisie. Tous ne se valent pas : certains sont <b>rapides et économes</b>, d'autres <b>raisonnent plus longuement</b> mais consomment davantage."},
  {t:"table",h:["Type de modèle","Avantage","Limite"],r:[
   ["<b>Léger / rapide</b>","Réponse vive, coût réduit","Peut manquer une subtilité, oublier une règle"],
   ["<b>De raisonnement</b>","Mieux sur les contradictions et les cas ambigus","Plus lent, plus coûteux, parfois plus bavard"],
   ["<b>Auto</b>","VS Code choisit selon la tâche et le réglage (efficacité, équilibre, intelligence)","Vous ne choisissez pas précisément"]]},
  {t:"table",h:["Réglage ou repère","Où le trouver"],r:[
   ["Modèle utilisé","Sélecteur de modèle dans la zone de saisie du chat"],
   ["Mode Auto et son optimisation","Dans la liste des modèles : <code>Auto</code>, puis l'option d'optimisation (<i>Efficiency</i>, <i>Balance</i>, <i>Intelligence</i>)"],
   ["Effort de réflexion","Flèche à côté de certains modèles : plus l'effort est élevé, plus la réponse est travaillée, et plus elle coûte"],
   ["Modèle qui a réellement répondu","Survolez la réponse dans le chat"],
   ["Consommation de la session","Survolez la jauge de contexte : elle indique aussi les crédits IA consommés"],
   ["Modèle imposé à une commande <code>/</code>","Champ <code>model:</code> dans l'en-tête du fichier <code>.prompt.md</code>"]]},
  {t:"p",x:"<b>Hypothèses de départ pour SprintDesk.</b> Ce sont des hypothèses à <b>vérifier</b>, pas des conclusions."},
  {t:"table",h:["Agent ou commande","Nature de la tâche","Hypothèse"],r:[
   ["<code>controleur-backlog</code>","Comparer une US à une liste de règles, en lecture seule","Un modèle léger peut suffire"],
   ["<code>reviewer-backlog</code>","Juger : contradictions, découpage, règles inventées","Un modèle de raisonnement apporte peut-être plus"],
   ["<code>redacteur-backlog</code>","Appliquer un format strict avec des décisions validées","Niveau intermédiaire à tester"],
   ["<code>orchestrateur-us</code>","Planifier, déléguer, ne pas sauter une validation","À mesurer : une erreur de pilotage coûte cher"],
   ["<code>/questions-po</code>","Reformuler des questions ouvertes","Un modèle léger peut suffire"]]},
  {t:"no",x:"Ne retenez jamais une hypothèse sans la mesurer. Le modèle le plus puissant n'est pas toujours le meilleur choix ; le plus léger peut oublier une règle. <b>Seule une mesure tranche</b> : c'est l'objet de l'étape suivante, puis du jeu d'évaluation."},
  {t:"warn",x:"La liste des modèles dépend de votre abonnement et des choix de votre organisation. Un modèle vu en démonstration peut être indisponible chez vous : utilisez ceux de <b>votre</b> liste."}]},
 {t:"Modèles en pratique : comparer deux modèles sur la même tâche",b:[
  {t:"p",x:"Vous allez comparer deux réglages sur <b>la même US et le même prompt</b>. Un seul paramètre change : le modèle."},
  {t:"ol",x:[
   "Nouveau chat. Dans le sélecteur, choisissez le <b>réglage A</b> : <code>Auto</code> optimisé pour l'efficacité, ou le modèle le plus léger de votre liste.",
   "Lancez : <code>/diagnostiquer-us #US-{n}03.md</code> (ou le prompt à 6 blocs). Survolez la réponse pour noter le modèle, puis la jauge pour noter les crédits.",
   "Nouveau chat. Choisissez le <b>réglage B</b> : <code>Auto</code> optimisé pour l'intelligence, ou un modèle de raisonnement de votre liste.",
   "Relancez <b>exactement le même prompt</b> et notez les mêmes informations.",
   "Remplissez le tableau ci-dessous. Recommencez avec <code>#US-{n}05.md</code>, l'US correcte."]},
  {t:"copy",l:"À COPIER dans vos notes (par exemple sprintdesk/resultats/comparaison-modeles.md)",x:"# Comparaison de modèles — lot {n}\n\n| Critère | Réglage A | Réglage B |\n|---|---|---|\n| Modèle utilisé (survol de la réponse) | | |\n| Contradiction de US-{n}03 repérée (oui/non) | | |\n| Règle ou ND citée exacte (oui/non) | | |\n| Aucune règle inventée (oui/non) | | |\n| US-{n}05 laissée inchangée (oui/non) | | |\n| Longueur de la réponse (courte / moyenne / longue) | | |\n| Crédits consommés (jauge) | | |"},
  {t:"see",x:"Deux réponses qui diffèrent par la forme, peut-être par le fond. Il n'y a pas de bonne réponse unique : <b>vous mesurez</b>."},
  {t:"ex",l:"Exemple — fixer un modèle dans une commande /",x:"---\ndescription: \"Diagnostiquer une US SprintDesk, sans la réécrire\"\nmodel: <nom exact tel qu'affiché dans votre sélecteur>\n---\nFais le diagnostic de l'US jointe avec la skill revue-agilite."},
  {t:"warn",x:"Un seul essai ne prouve rien : un même modèle peut répondre différemment d'une fois à l'autre. En cas de doute, rejouez chaque réglage deux fois. Si un nom de modèle dans <code>model:</code> est inconnu chez vous, retirez la ligne : le sélecteur reprend la main."},
  {t:"why",x:"Règle de décision à retenir : on choisit le modèle <b>le moins coûteux qui réussit tous les critères</b> sur le jeu de test. Un modèle plus cher qui ne fait pas mieux n'apporte rien. Un modèle moins cher qui échoue sur une contradiction n'est pas une économie."}]},
 {t:"Jeu d'évaluation : mesurer au lieu de supposer",b:[
  {t:"p",x:"Un <b>jeu d'évaluation</b> est un ensemble <b>fixe</b> de cas dont on connaît à l'avance la bonne réponse. <b>Analogie :</b> une copie d'examen avec son corrigé. Vous faites passer l'examen à votre agent avant et après chaque modification, et vous comparez les notes."},
  {t:"p",x:"SprintDesk en a déjà un : les <b>20 US des lots 1 à 4</b>. Chaque lot contient les <b>mêmes 5 types</b> de défauts. Cela prolonge la méthode de <code>docs/07-evaluation.md</code> : critères de succès, puis « un défaut, une cause, une modification »."},
  {t:"p",x:"La colonne de <b>votre lot ({n})</b> est surlignée en jaune. Les autres colonnes servent à comparer avec vos collègues."},
  {t:"table",lotcols:true,h:["Type","Lot 1","Lot 2","Lot 3","Lot 4"],r:[
   ["<b>x01 — trop vague</b>","US-101 : besoin non précisé, champs non listés (cf. RM-01)","US-201 : « bien priorisée » non défini (le calcul existe : RM-03, RM-04)","US-301 : « rapidement » non mesurable","US-401 : « utile » non défini, indicateurs non choisis"],
   ["<b>x02 — trop volumineuse</b>","US-102 : au moins 5 besoins (pièces jointes ND-02, notifications ND-03...) : à découper","US-202 : au moins 5 besoins (matrice, SLA, escalade, reporting, suggestion IA) : à découper ; la matrice paramétrable est à confronter à RM-04","US-302 : 7 besoins (réouverture ND-04, notifications ND-03, historique RM-06...) : à découper","US-402 : 6 besoins (alertes ND-01, abonnement e-mail ND-03...) : à découper"],
   ["<b>x03 — contradictoire</b>","US-103 : titre obligatoire <b>et</b> envoi sans titre (RM-01)","US-203 : le demandeur fixe la priorité (RM-05) ; « non modifiable » et « ajustable » dans la même US","US-303 : plusieurs traitants (RM-07)","US-403 : 5 jours calendaires <b>et</b> 3 jours ouvrés ; seuil = ND-01, à ne pas trancher"],
   ["<b>x04 — sans critères</b>","US-104 : aucun critère ; contenu et canal de la confirmation (ND-03)","US-204 : aucun critère ; tri par défaut (ND-05)","US-304 : aucun critère ; contenu de l'historique (RM-06)","US-404 : aucun critère ; valeurs des filtres (RM-02, RM-04)"],
   ["<b>x05 — correcte</b>","US-105 : <b>ne rien changer</b>","US-205 : <b>ne rien changer</b>","US-305 : <b>ne rien changer</b> ; ND-04 déjà en question ouverte","US-405 : <b>ne rien changer</b>"]]},
  {t:"warn",x:"Ce tableau donne des <b>repères</b> issus des fichiers d'entrée et de <code>regles-metier.md</code>. Confrontez-le à votre propre lecture avant de l'utiliser comme référence. En cas de désaccord ou de règle manquante, c'est une question pour le référent produit, pas une hypothèse."},
  {t:"table",h:["Principe","Pourquoi"],r:[
   ["<b>Figer les critères avant de tester</b>","Sinon on juge à l'humeur, après avoir lu la réponse"],
   ["<b>Même prompt, nouveau chat pour chaque US</b>","La conversation précédente ne doit pas influencer le résultat"],
   ["<b>Une seule modification à la fois</b>","Sinon on ne sait pas ce qui a changé le score"],
   ["<b>Une US correcte doit rester inchangée</b>","Détecte les agents qui « améliorent » trop (régression)"],
   ["<b>Aucune ND-xx tranchée</b>","C'est la règle la plus facilement violée"]]},
  {t:"why",x:"Sans jeu d'évaluation, chaque amélioration est une impression. Avec lui, une modification devient une <b>expérience</b> : mêmes cas, même grille, score avant, score après."}]},
 {t:"Jeu d'évaluation en pratique : noter, modifier, rejouer",b:[
  {t:"ol",x:[
   "Créez <code>sprintdesk/resultats/jeu-evaluation.md</code> et collez la fiche ci-dessous.",
   "Choisissez <b>ce que vous évaluez</b> : par exemple la commande <code>/diagnostiquer-us</code> ou l'agent <code>reviewer-backlog</code>. Décrivez-le en une ligne dans « Version testée ».",
   "Pour chacune des 5 US de votre lot, ouvrez un <b>nouveau chat</b> et lancez toujours le <b>même prompt</b>.",
   "Notez 0 ou 1 par critère. Faites le total.",
   "Faites <b>une seule modification</b> (ajouter une règle dans la skill, changer le modèle, préciser un interdit). Réécrivez « Version testée : v2 ».",
   "Rejouez les 5 US et comparez les totaux. Relancez deux fois en cas de doute."]},
  {t:"copy",l:"À COPIER dans sprintdesk/resultats/jeu-evaluation.md",x:"# Jeu d'évaluation — lot {n}\n\nCe qui est testé (commande, agent, skill, modèle) :\n\n## Critères\n- A. Défaut attendu repéré (pour l'US correcte : reconnue correcte, aucune modification proposée)\n- B. Règle ou décision citée exacte (RM-xx, ND-xx)\n- C. Rien d'inventé, aucune ND-xx tranchée\n\n## Version testée : v1\n\n| US | Type | A | B | C | Total /3 |\n|---|---|---|---|---|---|\n| US-{n}01 | vague | | | | |\n| US-{n}02 | volumineuse | | | | |\n| US-{n}03 | contradictoire | | | | |\n| US-{n}04 | sans critères | | | | |\n| US-{n}05 | correcte | | | | |\n| **Total lot {n}** | | | | | **/15** |\n\n## Version testée : v2 (une seule modification : ... )\n\n| US | Type | A | B | C | Total /3 |\n|---|---|---|---|---|---|\n| US-{n}01 | vague | | | | |\n| US-{n}02 | volumineuse | | | | |\n| US-{n}03 | contradictoire | | | | |\n| US-{n}04 | sans critères | | | | |\n| US-{n}05 | correcte | | | | |\n| **Total lot {n}** | | | | | **/15** |\n\n## Lecture\n- Régressions (un 1 devenu 0) :\n- Défaut observé, cause probable, modification suivante :"},
  {t:"table",h:["Résultat","Interprétation","Que faire ?"],r:[
   ["Le total monte, aucune régression","La modification aide","La conserver, puis passer au défaut suivant"],
   ["Le total monte, mais une US correcte est modifiée","L'agent « améliore » trop","Ajouter un contre-exemple : « si l'US est correcte, la laisser inchangée »"],
   ["Le total baisse","La modification nuit","L'annuler et formuler une autre hypothèse"],
   ["Le total est identique","Modification sans effet mesurable","Ne pas la garder : un fichier de plus à maintenir"],
   ["Une ND-xx est tranchée","Défaut grave, quel que soit le total","Renforcer l'interdit ; ce défaut prime sur le reste"]]},
  {t:"table",h:["Votre mesure sert à...","Exemple"],r:[
   ["Choisir un modèle (étape 8)","Le modèle le moins cher qui obtient le même total"],
   ["Valider une modification d'agent ou de skill","Total v2 supérieur ou égal à v1, sans régression"],
   ["Contrôler l'orchestrateur du bonus","Même grille appliquée au lot orchestré et au lot traité à la main"],
   ["Préparer les lots suivants","Chaque nouveau défaut rencontré devient un nouveau cas de test"]]},
  {t:"warn",x:"Une grille trop sévère ou trop floue donne des notes sans valeur. Si vous hésitez sur un 0 ou un 1, relisez le critère, corrigez-le <b>une fois pour toutes</b>, puis notez de nouveau les deux versions."},
  {t:"why",x:"Votre jeu d'évaluation fait pour les <b>agents</b> ce que les critères d'acceptation font pour les <b>US</b> : une condition vérifiable, définie à l'avance, qui dit si c'est réussi."}]},
 {t:"Bilan et pistes suivantes",b:[
  {t:"table",h:["Mécanisme","Ce qu'il apporte","Où il intervient dans SprintDesk"],r:[
   ["Instructions","Les règles permanentes","Toutes les conversations"],
   ["Plan","Le contrat de travail validé par l'humain","Avant toute écriture"],
   ["Agents et skills","Rôles et méthodes","Revue, réécriture, contrôle"],
   ["Commandes <code>/</code>","Prompts réutilisables","Diagnostiquer, questionner, vérifier"],
   ["Orchestration","Enchaînement supervisé","Traitement d'un lot"],
   ["<b>Hooks</b>","Interdits <b>appliqués</b>","Protection de <code>entree/</code> et <code>contexte/</code>, pas de publication"],
   ["<b>Gestion du contexte</b>","Mémoire de travail maîtrisée","Journal des décisions, compactage, nouveau chat"],
   ["<b>Choix du modèle</b>","Équilibre qualité, vitesse, coût","Comparaison mesurée par agent"],
   ["<b>Jeu d'évaluation</b>","Amélioration prouvée","20 US, grille 0/1, v1 contre v2"]]},
  {t:"check",id:"c6",x:["Node.js répond à <code>node --version</code> sur mon poste","Le journal <code>tool-use.log</code> m'a montré les noms d'outils utilisés","Le hook <code>protege-sources</code> a <b>refusé</b> la modification de <code>US-{n}01.md</code>","Le même hook a <b>autorisé</b> la lecture et l'écriture dans <code>resultats/</code>","J'ai constaté ce que devient une décision absente du journal dans un nouveau chat","J'ai fait un <code>/compact</code> avec consigne et vérifié ce qui avait été conservé","J'ai comparé deux modèles sur la même US avec le même prompt","J'ai rempli le jeu d'évaluation pour au moins deux versions, v1 et v2","Aucune ND-xx n'a été tranchée pendant mes tests"]},
  {t:"p",x:"<b>Pistes non traitées ici</b> (à explorer ensuite) : instructions ciblées par type de fichier, outils externes connectés (MCP), exécution en bac à sable, sécurité des outils. Aucune n'est nécessaire pour terminer SprintDesk."},
  {t:"why",x:"Vous disposez maintenant d'un système complet : des <b>règles écrites</b> pour guider Copilot, des <b>garde-fous appliqués</b> pour l'empêcher de mal faire, une <b>mémoire</b> maîtrisée pour les longs lots, un <b>modèle choisi par la mesure</b>, et un <b>banc d'essai</b> pour prouver chaque amélioration. Les décisions métier restent, plus que jamais, entre vos mains."}]}
 ]},

 goal:"Faire le point sur tout le parcours, retenir les règles d'or, et savoir où continuer à apprendre.",
 steps:[
 {t:"Récap : tout le parcours en un tableau",b:[
  {t:"p",x:"Chaque partie a ajouté <b>une brique</b> au cadre de travail de Copilot (le harness). Le tableau se lit de haut en bas : chaque ligne s'appuie sur les précédentes."},
  {t:"table",h:["Partie","Ce que vous avez appris","Ce que vous avez produit","Réflexe à retenir"],r:[
   ["🚪 Démarrer","Ouvrir le projet, lire le Markdown, ouvrir le chat, choisir Ask / Plan / Agent, joindre un fichier avec <code>#</code>, conserver ou annuler","Aucun fichier : la prise en main","Lire le diff avant de cliquer sur <code>Conserver</code>"],
   ["💬 Premiers prompts","Les 5 types de défauts d'US, le prompt en 6 blocs, 5 techniques de prompt, critiquer au lieu de relancer","Commandes <code>/diagnostiquer-us</code>, <code>/questions-po</code>, <code>/verifier-reponse</code>","Sources, interdits et format écrits dans le prompt"],

"Les techniques de prompt les plus connues":{o:"Connaître les 5 techniques de prompt les plus courantes et ce que chacune apporte à SprintDesk.",c:"Les techniques (few-shot, chain-of-thought, rôle, questions inversées, auto-vérification) se <b>combinent</b>. Aucune ne remplace des sources fiables et des interdits clairs.",l:[L.pe,L.best]},
"Technique 1 : le few-shot (donner un exemple)":{o:"Utiliser un exemple pour imposer un format de sortie.",c:"<b>Few-shot</b> : on montre 1 à 3 exemples du résultat attendu. Le modèle imite la forme. Attention : il peut aussi imiter le contenu de l'exemple, d'où l'intérêt d'un exemple clairement fictif.",l:[L.pe]},
"Technique 2 : le raisonnement pas à pas (Chain-of-Thought)":{o:"Obtenir un raisonnement visible et vérifiable avant la conclusion.",c:"<b>Chain-of-thought</b> : demander les étapes avant la réponse réduit les erreurs sur les tâches de jugement. Vous pouvez relire le raisonnement et le corriger.",l:[L.pe,L.best]},
"Techniques 3 à 5 : rôle, questions inversées, auto-vérification":{o:"Savoir quand donner un rôle, faire poser des questions, ou demander une auto-vérification.",c:"Un <b>rôle</b> cadre le ton et le niveau d'exigence. Les <b>questions inversées</b> évitent les inventions. L'<b>auto-vérification</b> attrape des erreurs, mais ne remplace pas la relecture humaine.",l:[L.pe,L.best]},
