<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road tour — Atelier SprintDesk avec Copilot (parcours débutant)</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#d9dfec;
    --blue:#2563eb; --blue-l:#dbeafe; --green:#16a34a; --green-l:#dcfce7;
    --amber:#d97706; --amber-l:#fef3c7; --violet:#7c3aed; --red:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1;min-width:220px}
  header label{font-size:14px}
  header select,header button{font:inherit;font-size:14px;padding:5px 10px;border-radius:6px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}
  .prog{flex:1;min-width:200px;max-width:340px}
  .prog small{display:block;font-size:12px;color:#cbd5e1}
  .bar{height:8px;background:#334155;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);width:0;transition:width .3s}
  .layout{display:grid;grid-template-columns:290px 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:24px 20px 80px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
  /* road */
  nav.road{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
  @media(max-width:860px){nav.road{position:static;max-height:none}}
  .road ol{list-style:none;margin:0;padding:0;position:relative}
  .road ol:before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:4px;background:repeating-linear-gradient(#94a3b8 0 10px,transparent 10px 18px);border-radius:2px}
  .stop{position:relative;display:flex;gap:12px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer}
  .stop:hover{background:#e8edf8}
  .stop.cur{background:var(--blue-l)}
  .dot{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #94a3b8;display:grid;place-items:center;font-size:16px;z-index:1}
  .stop.cur .dot{border-color:var(--blue);box-shadow:0 0 0 4px #bfdbfe}
  .stop.done .dot{border-color:var(--green);background:var(--green-l)}
  .stop b{display:block;font-size:14px;line-height:1.25}
  .stop small{color:var(--muted);font-size:12px}
  /* main */
  main h2{margin:0 0 4px;font-size:26px}
  .goal{color:var(--muted);margin:0 0 18px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
  .step.open{border-color:var(--blue);box-shadow:0 4px 18px rgba(37,99,235,.12)}
  .step.done{border-left:6px solid var(--green)}
  .sh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  .step.done .num{background:var(--green)}
  .sh h3{margin:0;font-size:17px;flex:1}
  .tag{font-size:12px;color:var(--green);font-weight:600}
  .sb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
  .step.open .sb{grid-template-rows:1fr}
  .sb>.in{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .45s}
  .step.open .sb>.in{visibility:visible;transition-delay:0s}
  .pad{padding:0 18px 18px;border-top:1px solid var(--line)}
  .step{scroll-margin-top:80px;transition:border-color .3s,box-shadow .3s}
  .ht{flex:1;min-width:0}
  .sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step.open .sub{display:none}
  .chev{color:var(--muted);transition:transform .3s}
  .step.open .chev{transform:rotate(180deg)}
  .obj,.goalbox{display:flex;gap:14px;align-items:center;border-radius:14px;color:#fff;position:relative;overflow:hidden}
  .obj{margin:16px 0 6px;padding:14px 18px;background:linear-gradient(120deg,#2563eb,#7c3aed);box-shadow:0 6px 18px rgba(37,99,235,.3)}
  .goalbox{margin:6px 0 20px;padding:16px 20px;background:linear-gradient(120deg,#0f172a,#1d4ed8)}
  .obj .oi,.goalbox .oi{font-size:32px;animation:bob 2.4s ease-in-out infinite}
  .obj small,.goalbox small{display:block;font-size:11px;letter-spacing:.14em;font-weight:700;opacity:.85}
  .obj strong{font-size:17px;line-height:1.35}
  .goalbox strong{font-size:18px;line-height:1.4;font-weight:600}
  .obj:after,.goalbox:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4s ease-in-out infinite}
  .more{margin-top:18px;border:1px solid #c7d2fe;border-radius:12px;background:#f5f7ff}
  .more summary{cursor:pointer;padding:10px 14px;font-weight:700;color:#3730a3;list-style:none}
  .more summary::-webkit-details-marker{display:none}
  .more summary:before{content:"▸ ";display:inline-block;transition:transform .2s}
  .more[open] summary:before{transform:rotate(90deg)}
  .mb{padding:0 14px 12px;animation:rise .3s both}
  .mb a{color:var(--blue)}
  .mb ul{margin:6px 0}
  .chk input:checked+span{color:#166534;font-weight:600}
  main.enter .step,main.enter h2,main.enter .goalbox{animation:rise .5s both;animation-delay:calc(var(--i,0)*70ms)}
  .num.pop{animation:pop .7s}
  .step.celebrate{animation:flash 1.1s}
  .btn.pulse{animation:pulse 1.2s infinite}
  .stop.just .dot{animation:pop .7s}
  .confetti{position:fixed;z-index:200;width:9px;height:14px;border-radius:2px;pointer-events:none}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:210;background:#14532d;color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toast 2.6s both}
  .toast.big{background:linear-gradient(120deg,#7c3aed,#2563eb);font-size:18px}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.6) rotate(-10deg)}70%{transform:scale(.9)}100%{transform:scale(1)}}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(22,163,74,.7)}100%{box-shadow:0 0 0 26px rgba(22,163,74,0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(37,99,235,.25)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,30px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
  .prog .bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
  /* visite guidée */
  #tour-ov{position:fixed;inset:0;z-index:100}
  #tour-ov.dim{background:rgba(15,23,42,.72)}
  #tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(15,23,42,.72),0 0 0 3px #fbbf24;transition:all .35s ease;pointer-events:none}
  #tour-tip{position:fixed;width:340px;max-width:calc(100vw - 24px);background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 16px 50px rgba(0,0,0,.4);animation:rise .35s both;z-index:101}
  #tour-tip h4{margin:0 0 6px;font-size:17px}
  #tour-tip p{margin:0 0 12px;font-size:14.5px}
  .tdots{display:flex;gap:5px;margin-bottom:10px}
  .tdots i{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
  .tdots i.on{background:var(--blue);transform:scale(1.3)}
  .tbtn{display:flex;gap:8px;align-items:center}
  .tbtn .skip{margin-right:auto;background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .sb p,.sb li{margin:10px 0}
  .sb ol,.sb ul{padding-left:22px}
  code{background:#eef1f8;border-radius:5px;padding:1px 6px;font:13.5px Consolas,monospace}
  kbd{background:#fff;border:1px solid #b8c0d4;border-bottom-width:3px;border-radius:5px;padding:0 6px;font:13px Consolas,monospace}
  .co{border-radius:10px;padding:10px 14px;margin:12px 0}
  .co b.l{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .see{background:var(--green-l);border-left:5px solid var(--green)}
  .warn{background:var(--amber-l);border-left:5px solid var(--amber)}
  .why{background:var(--blue-l);border-left:5px solid var(--blue)}
  .no{background:#fee2e2;border-left:5px solid var(--red)}
  .co p{margin:4px 0}
  .copy{margin:14px 0;border:2px dashed var(--violet);border-radius:12px;overflow:hidden;background:#faf8ff}
  .copy .ct{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#ede9fe;font-weight:600;font-size:14px;color:#5b21b6}
  .copy button{font:inherit;font-size:13px;padding:5px 12px;border:0;border-radius:6px;background:var(--violet);color:#fff;cursor:pointer}
  .copy button.ok{background:var(--green)}
  .copy pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;font:13.5px/1.5 Consolas,monospace;max-height:420px;overflow:auto}
  table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14.5px}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:#eef2fb}
  .chk label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
  .chk input{margin-top:5px;width:18px;height:18px}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{font:inherit;padding:9px 18px;border-radius:9px;border:0;cursor:pointer;font-weight:600}
  .btn.p{background:var(--green);color:#fff}
  .btn.s{background:#e5e7eb;color:var(--ink)}
  .btn.b{background:var(--blue);color:#fff}
  .end{margin:28px 0;text-align:center}
  .mock{font-family:Consolas,monospace;font-size:13px;white-space:pre;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>🛣️ Road tour — Atelier SprintDesk avec Copilot</h1>
  <label>Mon lot :
    <select id="lot">
      <option value="1">Lot 1 (US-101 à 105)</option>
      <option value="2">Lot 2 (US-201 à 205)</option>
      <option value="3">Lot 3 (US-301 à 305)</option>
      <option value="4">Lot 4 (US-401 à 405)</option>
    </select>
  </label>
  <div class="prog"><small id="ptxt"></small><div class="bar"><i id="pbar"></i></div></div>
  <button id="tourbtn" title="Revoir la visite guidée">❓ Visite guidée</button>
  <button id="reset" title="Effacer ma progression">↺ Recommencer</button>
</header>
<div class="layout">
  <nav class="road"><ol id="road"></ol></nav>
  <main id="main"></main>
</div>

<script>
/* Balises : {n} = numéro du lot ; ¤ = apostrophe inversée (backtick) dans les textes à copier */
const STAGES = [
/* ====================================================== 0 */
{icon:"🚪",title:"Démarrer",sub:"Prise en main de VS Code",
 goal:"À la fin de cette étape : vous savez ouvrir le projet, lire un fichier, parler à Copilot et annuler ce qu'il fait.",
 steps:[
 {t:"Ouvrir le dossier du projet",b:[
  {t:"ol",x:[
   "Lancez <b>Visual Studio Code</b> (icône bleue).",
   "Menu du haut : cliquez sur <code>Fichier</code> (<code>File</code>) puis <code>Ouvrir le dossier...</code> (<code>Open Folder...</code>).",
   "Choisissez le dossier <code>formation-harness</code> fourni par l'animateur, puis <code>Sélectionner un dossier</code>.",
   "Si une fenêtre demande « Faites-vous confiance aux auteurs ? », cliquez <code>Oui, je fais confiance aux auteurs</code>."]},
  {t:"see",x:"À gauche, une liste de dossiers : <code>begin</code>, <code>docs</code>, <code>sprintdesk</code>... Elle s'appelle l'<b>Explorateur</b>."},
  {t:"warn",x:"Liste absente ? Appuyez sur <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>E</kbd>."},
  {t:"why",x:"VS Code travaille sur un <b>dossier</b>. Copilot ne voit que les fichiers de ce dossier : si vous ouvrez un seul fichier, il ne trouvera pas vos règles métier."}]},
 {t:"Ouvrir et lire un fichier",b:[
  {t:"ol",x:[
   "Dans l'explorateur, cliquez sur la flèche à gauche de <code>sprintdesk</code> pour le déplier.",
   "Dépliez <code>contexte</code>, puis cliquez <b>une fois</b> sur <code>produit.md</code>.",
   "Pour une lecture agréable, appuyez sur <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>V</kbd> : un aperçu mis en forme s'ouvre.",
   "Faites de même avec <code>regles-metier.md</code>."]},
  {t:"see",x:"Le titre « Contexte produit — SprintDesk chez HabiOuest » et un tableau des utilisateurs."},
  {t:"why",x:"Les fichiers <code>.md</code> (Markdown) sont du texte simple lisible par vous <b>et</b> par Copilot. Tout ce que vous allez créer est un fichier <code>.md</code>."},
  {t:"p",x:"<b>À retenir absolument :</b> <code>RM-xx</code> = règle <b>validée</b>. <code>ND-xx</code> = décision <b>non prise</b>, interdit de la deviner."}]},
 {t:"Ouvrir Copilot Chat",b:[
  {t:"ol",x:[
   "Appuyez sur <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>I</kbd> : le chat s'ouvre à droite.",
   "Sinon, cliquez sur l'icône Copilot en haut de la fenêtre, à côté de la barre de recherche centrale.",
   "Si on vous demande de vous connecter : <code>Se connecter avec GitHub</code>, suivez le navigateur, puis revenez dans VS Code."]},
  {t:"see",x:"Un panneau avec une zone de saisie en bas (texte grisé du type « Ask Copilot »)."}]},
 {t:"Repérer les boutons du chat",b:[
  {t:"table",h:["Élément","Où","À quoi il sert"],r:[
   ["<b>Sélecteur de mode</b>","En bas à gauche de la zone de saisie (affiche <code>Agent</code>, <code>Ask</code> ou <code>Plan</code>)","Choisit <b>comment</b> Copilot travaille"],
   ["<b>Sélecteur de modèle</b>","À côté du mode","Laissez le choix par défaut"],
   ["<b>Envoyer</b>","En bas à droite (flèche)","<kbd>Entrée</kbd> fait pareil"],
   ["<b>Nouveau chat</b>","Bouton <code>+</code> en haut du chat","Repart d'une conversation vierge"]]},
  {t:"p",x:"Pour aller à la ligne sans envoyer : <kbd>Maj</kbd>+<kbd>Entrée</kbd>."},
  {t:"table",h:["Mode","Modifie vos fichiers ?","Quand"],r:[["<b>Ask</b>","Non","Explorer sans risque (étape « Premiers prompts »)"],["<b>Plan</b>","Non","Atelier 1"],["<b>Agent</b>","<b>Oui</b>","Ateliers 2 et 3"]]},
  {t:"no",x:"Tant que le guide ne dit pas « passez en Agent », restez en <b>Ask</b>."}]},
 {t:"Votre premier message",b:[
  {t:"ol",x:["Dans le sélecteur de mode, choisissez <code>Ask</code>.","Cliquez dans la zone de saisie, collez le texte ci-dessous, puis <kbd>Entrée</kbd>."]},
  {t:"copy",l:"À COPIER dans le chat",x:"Bonjour ! Réponds uniquement par la phrase : \"Copilot est prêt.\""},
  {t:"see",x:"« Copilot est prêt. » en quelques secondes."},
  {t:"warn",x:"Erreur d'accès ? Vérifiez votre connexion (étape précédente). Sinon prévenez l'animateur : la licence Copilot manque peut-être."}]},
 {t:"Donner un fichier à Copilot avec #",b:[
  {t:"p",x:"Copilot ne lit pas tout seul tous vos fichiers. Pour lui en montrer un :"},
  {t:"ol",x:[
   "Dans la zone de saisie, tapez <kbd>#</kbd> : une liste de fichiers apparaît.",
   "Tapez le début du nom (<code>produit</code>), sélectionnez <code>produit.md</code> avec les flèches puis <kbd>Entrée</kbd> : une pastille apparaît.",
   "Complétez la phrase, par exemple : « D'après [pastille produit.md], quels sont les 4 rôles d'utilisateurs de SprintDesk ? »"]},
  {t:"see",x:"Demandeur, Qualificateur, Traitant, Manager."},
  {t:"why",x:"Citer un fichier avec <code>#</code> est plus sûr que de compter sur le fichier ouvert au centre."}]},
 {t:"Accepter ou annuler ce que Copilot modifie",b:[
  {t:"p",x:"Quand Copilot modifie un fichier (mode Agent), vous voyez les fichiers concernés dans le chat, du texte vert (ajouté) et rouge (supprimé), et des boutons <code>Conserver</code> / <code>Annuler</code> (<code>Keep</code> / <code>Undo</code>)."},
  {t:"table",h:["Je veux...","Je fais..."],r:[["Accepter","Bouton <code>Conserver</code>"],["Tout refuser","Bouton <code>Annuler</code>"],["Annuler ma propre frappe","<kbd>Ctrl</kbd>+<kbd>Z</kbd>"],["Enregistrer un fichier","<kbd>Ctrl</kbd>+<kbd>S</kbd> (le point <code>●</code> de l'onglet disparaît)"]]},
  {t:"no",x:"Relisez <b>avant</b> de cliquer sur <code>Conserver</code>."},
  {t:"check",id:"c0",x:["Dossier <code>formation-harness</code> ouvert","J'ai lu <code>produit.md</code> et <code>regles-metier.md</code>","Copilot m'a répondu « Copilot est prêt. »","Je sais citer un fichier avec <code>#</code>","Je sais où sont <code>Conserver</code> / <code>Annuler</code> et <kbd>Ctrl</kbd>+<kbd>S</kbd>"]}]}
 ]},
/* ====================================================== 1 */
{icon:"💬",title:"Premiers prompts",sub:"Parler à Copilot sans risque",
 goal:"Mode Ask uniquement : Copilot répond, ne modifie rien. Vous voyez pourquoi un prompt vague est dangereux et comment en écrire un bon.",
 steps:[
 {t:"Lire les 5 US de votre lot",b:[
  {t:"ol",x:["Explorateur : <code>sprintdesk</code> > <code>backlog</code> > <code>entree</code> > <code>lot{n}</code>.","Ouvrez les 5 fichiers un par un (aperçu : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>V</kbd>).","Pour chacune, notez en une phrase : est-elle claire ? complète ?"]},
  {t:"table",h:["Type de défaut","Signification"],r:[["US <b>vague</b>","On ne sait pas quoi construire"],["US <b>trop volumineuse</b>","Plusieurs besoins en une seule US"],["US <b>contradictoire</b>","Contredit une règle validée (<code>RM-xx</code>)"],["US <b>sans critères</b>","Impossible de vérifier qu'elle est terminée"],["US <b>déjà correcte</b>","À ne surtout pas modifier"]]},
  {t:"why",x:"Chaque lot contient exactement ces 5 cas. Il n'y a pas de bonne réponse à cette étape : vous formez votre propre avis, que Copilot va ensuite confronter."}]},
 {t:"Le mauvais prompt (pour voir le problème)",b:[
  {t:"p",x:"Ouvrez un <b>nouveau chat</b> (<code>+</code>), mode <code>Ask</code>. Tapez ce texte en remplaçant le dernier mot par la pastille du fichier (<kbd>#</kbd> puis <code>US-{n}01.md</code>)."},
  {t:"copy",l:"À COPIER (puis ajouter #US-{n}01.md)",x:"Améliore"},
  {t:"p",x:"Lisez la réponse et posez-vous :"},
  {t:"ul",x:["Copilot a-t-il ajouté des champs (nom, téléphone, pièce jointe...) ? <b>Qui les a décidés ?</b>","Vous a-t-il posé une question ? Non : il a <b>deviné</b>.","A-t-il cité des règles <code>RM-xx</code> ? Probablement pas."]},
  {t:"why",x:"Sans cadre, Copilot comble les vides avec des idées plausibles. Dans un vrai projet, ces idées deviennent des « règles » que personne n'a validées. C'est le risque que tout l'atelier combat."}]},
 {t:"Le bon prompt en 6 blocs",b:[
  {t:"table",h:["Bloc","Question","Exemple"],r:[["Contexte","Sur quoi on travaille ?","Projet SprintDesk, lot {n}"],["Sources","Que doit-il lire ?","Fichiers cités avec <code>#</code>"],["Interdits","Que ne doit-il pas faire ?","Ne réécris pas, n'invente rien"],["Tâche","Que produire ?","Dire si l'US est exploitable"],["Exigences","Quelles garanties ?","Citer RM/ND, poser des questions"],["Format","Sous quelle forme ?","Un tableau"]]},
  {t:"p",x:"Nouveau chat (<code>+</code>), mode <code>Ask</code>. Collez le prompt, puis <b>remplacez</b> les noms de fichiers par des pastilles (<kbd>#</kbd> + nom) : <code>produit.md</code>, <code>regles-metier.md</code>, <code>US-{n}01.md</code>."},
  {t:"copy",l:"À COPIER dans le chat",x:"Contexte : projet SprintDesk, lot {n}.\nSources : produit.md, regles-metier.md, US-{n}01.md (à ajouter avec #).\n\nInterdits : ne réécris pas l'US. N'invente aucune règle métier. Ne modifie aucun fichier.\n\nTâche : indique si cette US est exploitable en l'état.\n\nExigences :\n- Cite les règles RM-xx ou décisions ND-xx concernées.\n- Si une information manque, pose-moi la question au lieu de la deviner.\n\nFormat : un tableau avec les colonnes \"Constat\", \"Pourquoi c'est un problème\", \"Question à poser au métier\"."},
  {t:"see",x:"Un tableau qui constate que l'US est trop vague, et des <b>questions</b> au lieu d'inventions."},
  {t:"why",x:"Même US, même IA qu'à l'étape précédente : seul le cadre a changé."}]},
 {t:"Tester sur l'US correcte",b:[
  {t:"p",x:"Nouveau chat, même prompt, avec l'<b>US-{n}05</b> (la correcte)."},
  {t:"see",x:"Copilot dit qu'elle est globalement correcte."},
  {t:"p",x:"S'il propose de grosses modifications, envoyez :"},
  {t:"copy",l:"À COPIER",x:"Rappel : une US déjà correcte ne doit pas être modifiée. Si tu penses qu'elle est correcte, dis-le simplement et n'invente aucune amélioration."},
  {t:"why",x:"Un Copilot non cadré « améliore » même ce qui est bon. Cette règle ira dans les instructions (Atelier 1)."}]},
 {t:"Critiquer au lieu de tout relancer",b:[
  {t:"table",h:["Problème constaté","Phrase à écrire"],r:[["Réponse trop longue","« Résume en 5 lignes maximum. »"],["Affirmation sans source","« Sur quelle règle RM-xx ou quel fichier t'appuies-tu ? »"],["Invention","« Tu as inventé ce point. Retire-le et transforme-le en question ouverte. »"],["Décision à la place du métier","« Ne décide pas. Présente les options et laisse-moi trancher. »"]]},
  {t:"p",x:"Entraînement : demandez les défauts de l'US contradictoire de votre lot avec le prompt à 6 blocs, puis utilisez une phrase du tableau. Copilot a-t-il cité la bonne règle <code>RM-xx</code> tout seul ?"},
  {t:"check",id:"c1",x:["J'ai vu la différence entre « Améliore » et un prompt à 6 blocs","Je sais nommer les 6 blocs : contexte, sources, interdits, tâche, exigences, format","J'ai vu Copilot poser des questions plutôt qu'inventer","Je sais critiquer une réponse au lieu de tout relancer"]}]}
 ]},
/* ====================================================== 2 */
{icon:"🧭",title:"Atelier 1 — Planifier",sub:"Instructions puis PLAN.md",
 goal:"Vous donnez à Copilot ses règles permanentes (instructions), puis vous construisez avec lui un plan validé avant de lui laisser toucher quoi que ce soit.",
 steps:[
 {t:"Comprendre ce que vous allez construire",b:[
  {t:"table",h:["Ordre","Livrable","Analogie","Rôle"],r:[["1","<code>.github/copilot-instructions.md</code>","Règlement intérieur","Règles lues par Copilot dans <b>toutes</b> vos conversations"],["2","<code>PLAN.md</code>","Contrat de mission","Ce qu'on va faire, ce qu'on ne décidera pas, comment on jugera le résultat"]]},
  {t:"why",x:"On ne fait <b>pas</b> faire le travail à Copilot tout de suite. D'abord le cadre (instructions), ensuite la feuille de route (plan). Un cadre vague donne un travail vague."}]},
 {t:"Ouvrir le fichier d'instructions",b:[
  {t:"ol",x:["Explorateur : dépliez le dossier <code>.github</code> (le point au début du nom est normal).","Cliquez sur <code>copilot-instructions.md</code>.","Vous voyez un squelette rempli de <code>TODO</code> : c'est ce que vous allez compléter."]},
  {t:"warn",x:"Dossier <code>.github</code> introuvable ? Vérifiez que vous avez ouvert <code>formation-harness</code> et non <code>begin</code> ou un sous-dossier."}]},
 {t:"Remplacer le contenu par les instructions complètes",b:[
  {t:"ol",x:["Cliquez dans le fichier ouvert au centre.","<kbd>Ctrl</kbd>+<kbd>A</kbd> (tout sélectionner), puis <kbd>Suppr</kbd>.","Cliquez sur <code>Copier</code> ci-dessous, puis <kbd>Ctrl</kbd>+<kbd>V</kbd> dans le fichier.","<kbd>Ctrl</kbd>+<kbd>S</kbd> pour enregistrer."]},
  {t:"copy",l:"À COPIER dans .github/copilot-instructions.md",x:"# Instructions communes — SprintDesk\n\n## Références\n- Contexte produit : ¤sprintdesk/contexte/produit.md¤.\n- Règles métier validées (RM-xx) et décisions non prises (ND-xx) : ¤sprintdesk/contexte/regles-metier.md¤.\n- US d'origine : ¤sprintdesk/backlog/entree/¤ (ne jamais les modifier).\n- Production : ¤sprintdesk/backlog/sortie/¤ et ¤sprintdesk/resultats/¤.\n\n## Règles\n- Ne jamais inventer de règle ou de décision métier absente des fichiers de contexte.\n- Toute décision non prise (ND-xx) devient une question ouverte, jamais une hypothèse cachée.\n- Conserver l'identifiant et la traçabilité de chaque US (identifiant d'origine, lien vers l'US source).\n- Distinguer explicitement : faits (issus des fichiers), propositions (de Copilot), questions ouvertes (à trancher par l'humain).\n- Si une US est déjà correcte, la laisser inchangée et le dire.\n- Ne jamais publier vers un service externe sans validation humaine.\n- En fin de réponse, indiquer les contrôles réellement exécutés (et seulement ceux-là).\n- En cas de doute, de règle manquante ou de contradiction entre deux sources : s'arrêter et poser la question.\n\n## Où trouver les détails\n- Format d'une US : skill ¤formater-us¤.\n- Méthode de revue : skill ¤revue-agilite¤."},
  {t:"see",x:"Un fichier de 25 lignes environ, sans aucun <code>TODO</code>, et l'onglet sans point <code>●</code>."},
  {t:"why",x:"Chaque règle répond à un défaut vu au guide précédent : inventions (règle 1-2), « amélioration » d'une US correcte (règle 5), absence de traces (règle 7), blocage plutôt que devinette (règle 8)."}]},
 {t:"Vérifier que Copilot applique ces règles",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>), mode <code>Ask</code>.","Collez la question ci-dessous."]},
  {t:"copy",l:"À COPIER dans le chat",x:"Quelles règles dois-tu respecter sur ce projet ? Réponds en une liste courte."},
  {t:"see",x:"Une liste qui reprend : ne pas inventer, tracer les US, distinguer faits/propositions/questions, laisser une US correcte inchangée, ne pas publier sans validation."},
  {t:"warn",x:"Copilot répond de façon générique ? Cliquez sur la ligne « Used 1 reference » (ou « Références utilisées ») sous la réponse : <code>copilot-instructions.md</code> doit y figurer. Sinon, vérifiez que le fichier est enregistré et bien dans <code>.github</code>."}]},
 {t:"Passer en mode Plan",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>).","Cliquez sur le sélecteur de mode (en bas à gauche de la zone de saisie).","Choisissez <code>Plan</code>."]},
  {t:"why",x:"En mode Plan, Copilot ne modifie rien : il vous pose des questions et propose. C'est exactement ce qu'on veut avant d'agir."},
  {t:"warn",x:"Pas de mode <code>Plan</code> dans la liste ? Utilisez <code>Ask</code> : le prompt de l'étape suivante fonctionne pareil."}]},
 {t:"Envoyer le prompt de plan",b:[
  {t:"p",x:"Collez le prompt ci-dessous. Il contient un modèle de prompt complet : contexte, sources, interdits, tâche, exigences, format."},
  {t:"copy",l:"À COPIER dans le chat (mode Plan)",x:"Nous préparons le backlog du projet SprintDesk, lot {n}.\n\nLis :\n- sprintdesk/contexte/produit.md ;\n- sprintdesk/contexte/regles-metier.md ;\n- les cinq user stories de sprintdesk/backlog/entree/lot{n}/.\n\nNe réécris pas encore les user stories.\nNe modifie pas le code de l'application.\nNe publie rien.\n\nPrépare un plan de traitement du backlog.\n\nAvant de finaliser ce plan :\n1. Identifie les ambiguïtés, contradictions et informations manquantes.\n2. Pose les questions nécessaires aux décisions métier.\n3. Propose le format des user stories attendues.\n4. Définis des critères de qualité vérifiables.\n5. Propose les étapes, les rôles des agents et leurs livrables.\n6. Identifie les points de validation humaine.\n7. Prévois comment comparer les résultats aux attentes.\n\nDistingue les faits fournis, les propositions et les décisions à prendre."},
  {t:"see",x:"Copilot lit les fichiers (vous voyez leurs noms défiler), puis vous pose des questions et/ou propose un premier plan."}]},
 {t:"Répondre aux questions de Copilot",b:[
  {t:"p",x:"Répondre à ces questions <b>est</b> le travail de cadrage. Appliquez cette grille à chaque question :"},
  {t:"table",h:["Si la question porte sur...","Votre réponse"],r:[["Une règle <b>validée</b> (RM-xx)","Confirmez-la : « Oui, c'est RM-xx »"],["Une décision <b>non prise</b> (ND-xx)","<b>Ne tranchez pas.</b> « Question ouverte, à faire trancher par le référent produit »"],["Le format des US","Prenez le modèle : Titre, Besoin (En tant que / Je souhaite / Afin de), Règles métier, Critères d'acceptation (Étant donné / Quand / Alors), Dépendances, Questions ouvertes"],["Qui valide","« Un humain valide le diagnostic avant réécriture, et chaque US avant dépôt dans sortie/ »"]]},
  {t:"copy",l:"Réponse type à utiliser si vous hésitez",x:"Pour toute décision non prise (ND-xx), ne propose pas de valeur par défaut : liste-la en \"Questions ouvertes\" avec la mention \"à trancher par le référent produit\". Le format cible des US est : Titre, Besoin (En tant que / Je souhaite / Afin de), Règles métier, Critères d'acceptation (Étant donné / Quand / Alors), Dépendances, Questions ouvertes. Un humain valide le diagnostic avant toute réécriture, puis chaque US avant dépôt dans backlog/sortie/."},
  {t:"no",x:"Ne répondez jamais à une question ND-xx par une invention « raisonnable » (ex : « 30 jours »). C'est précisément ce que l'atelier interdit."}]},
 {t:"Affiner le plan par la critique",b:[
  {t:"p",x:"Le premier plan est rarement bon. Envoyez ces trois critiques, <b>une par message</b>, en lisant la réponse entre chaque."},
  {t:"copy",l:"Critique 1 — critères vérifiables",x:"Chaque critère de réussite doit pouvoir être répondu par oui ou non. Réécris ceux qui sont flous (par exemple \"US de qualité\")."},
  {t:"copy",l:"Critique 2 — séparer diagnostic et réécriture",x:"Sépare clairement les étapes : 1. diagnostic, 2. validation humaine, 3. réécriture, 4. contrôle contre les RM-xx, 5. synthèse. Aucune étape ne doit mélanger diagnostic et réécriture."},
  {t:"copy",l:"Critique 3 — conditions d'arrêt",x:"Ajoute une section \"Limites et conditions d'arrêt\" : l'agent s'arrête et demande si une règle manque, si deux sources se contredisent, ou si une décision métier est requise."}]},
 {t:"Enregistrer le plan dans PLAN.md",b:[
  {t:"p",x:"Jusqu'ici, le plan n'existe que dans le chat. On le sauvegarde dans un fichier."},
  {t:"ol",x:["Nouveau passage au mode <code>Agent</code> (sélecteur de mode).","<b>Gardez la même conversation</b> (ne cliquez pas sur <code>+</code>) pour que Copilot retrouve le plan.","Collez le prompt ci-dessous."]},
  {t:"copy",l:"À COPIER dans le chat (mode Agent)",x:"Crée le fichier PLAN.md à la racine du projet avec le plan que nous venons de valider. Utilise exactement ces 12 sections : 1. Objectif et périmètre, 2. Sources, 3. Résultats attendus, 4. Règles métier validées, 5. Questions ouvertes, 6. Format cible d'une US, 7. Étapes, 8. Rôles des agents, 9. Skills, 10. Contrôles et validations humaines, 11. Critères de réussite, 12. Limites et conditions d'arrêt. Ne crée ni ne modifie aucun autre fichier."},
  {t:"ol",x:["Relisez le fichier créé, puis cliquez <code>Conserver</code>.","<kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"see",x:"Un fichier <code>PLAN.md</code> à la racine de l'explorateur, avec 12 titres numérotés."}]},
 {t:"Contrôler votre plan",b:[
  {t:"p",x:"Relisez <code>PLAN.md</code> avec cette liste. Si une case reste vide, redemandez à Copilot de corriger <b>ce point précis</b>."},
  {t:"check",id:"c2",x:["Je sais dire ce que chaque agent <b>fera</b> et ce qu'il <b>ne décidera pas</b>","Chaque ND-xx rencontrée est une question ouverte, pas une hypothèse cachée","Les critères de réussite sont vérifiables (oui/non)","Un humain valide avant toute décision métier et toute publication","Une condition d'arrêt est définie","Le plan est lisible en 10 minutes (pas un roman)"]},
  {t:"why",x:"<code>PLAN.md</code> est votre contrat : les agents de l'Atelier 2 vont le suivre, et c'est lui qui servira à juger leur travail."}]}
 ]},
/* ====================================================== 3 */
{icon:"🧑‍💼",title:"Atelier 2 — Agents",sub:"Éditer puis créer des rôles",
 goal:"Vous transformez Copilot en équipe de rôles distincts (une « fiche de poste » par agent), puis vous les faites travailler avec validation humaine.",
 steps:[
 {t:"Comprendre ce qu'est un agent",b:[
  {t:"p",x:"Un agent est une <b>fiche de poste</b> : un fichier texte que Copilot lit avant de travailler. Sans fiche, il improvise ; avec, il connaît sa mission, ses limites et sa sortie."},
  {t:"mock",x:"---\ndescription: \"Phrase qui dit QUAND utiliser cet agent\"\ntools: ['read', 'search', 'edit']\n---\n# Nom de l'agent\n\n## Mission      <- ce qu'il fait\n## Interdits     <- ce qu'il ne décide pas\n## Sortie        <- ce qu'il rend, et où"},
  {t:"table",h:["Partie","Rôle"],r:[["Entre les deux <code>---</code> (<b>en-tête</b>)","Réglages techniques. <code>description</code> = résumé affiché dans la liste. <code>tools</code> = outils autorisés"],["<code>read</code>","Lire des fichiers"],["<code>search</code>","Chercher dans le projet"],["<code>edit</code>","Créer / modifier des fichiers"],["Sous l'en-tête","Texte libre : mission, interdits, sortie"]]},
  {t:"warn",x:"Respectez les <code>---</code> et les guillemets de l'en-tête à la lettre : une erreur et l'agent n'apparaît pas dans la liste."},
  {t:"table",h:["Agent","Rôle","Outils","Pourquoi séparés"],r:[["Reviewer","Constate (diagnostic)","read, search, edit (écrit uniquement revue.md)","Il ne réécrit pas"],["Rédacteur","Réécrit selon la revue validée","read, search, edit","Il ne tranche aucune décision métier"],["Contrôleur (à créer)","Vérifie le résultat","read, search (lecture seule)","Il ne se valide pas lui-même"]]},
  {t:"why",x:"Un seul agent qui juge <b>et</b> corrige se valide lui-même. Séparer les rôles, c'est comme séparer l'auditeur et le comptable."}]},
 {t:"Éditer l'agent Reviewer",b:[
  {t:"ol",x:["Explorateur : <code>.github</code> > <code>agents</code> > cliquez sur <code>reviewer-backlog.agent.md</code>.","Vous voyez un squelette avec des <code>TODO</code>.","<kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, puis collez le contenu ci-dessous.","<kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans reviewer-backlog.agent.md",x:"---\ndescription: \"Relit des user stories SprintDesk et produit une revue sans les réécrire. Utiliser pour diagnostiquer défauts, contradictions et dépendances.\"\ntools: ['read', 'search', 'edit']\n---\n# Reviewer backlog\n\n## Mission\n- Lire le contexte (sprintdesk/contexte/produit.md et regles-metier.md), le fichier PLAN.md et les US d'origine du lot dans sprintdesk/backlog/entree/.\n- Appliquer la skill ¤revue-agilite¤ à chaque US.\n- Identifier défauts, contradictions et dépendances, en citant la règle concernée (RM-xx ou ND-xx).\n- Une US correcte reçoit la mention \"Aucune action\" : ne pas lui chercher de défaut.\n\n## Interdits\n- Ne pas réécrire les US et ne pas proposer de nouvelle version complète.\n- Ne pas inventer de règle et ne trancher aucune décision non prise (ND-xx) : la formuler en question métier.\n- Ne modifier aucun fichier sauf sprintdesk/resultats/revue.md. Ne jamais toucher sprintdesk/backlog/entree/.\n\n## Sortie attendue (une entrée par constat)\n¤¤¤\nUS concernée :\nConstat :\nRègle ou critère concerné :\nGravité : bloquant / recommandation\nQuestion métier éventuelle :\nRecommandation :\n¤¤¤\nÉcrire le résultat dans sprintdesk/resultats/revue.md.\n\n## Fin de réponse\nIndiquer les contrôles réellement exécutés et la liste des questions ouvertes à faire trancher."},
  {t:"see",x:"Fichier sans <code>TODO</code>, onglet sans <code>●</code>."},
  {t:"why",x:"<b>Mission</b> = ce qu'il fait. <b>Interdits</b> = ce qui l'empêche d'inventer ou de réécrire. <b>Sortie</b> = un format fixe pour que vous puissiez comparer les constats."}]},
 {t:"Éditer l'agent Rédacteur",b:[
  {t:"ol",x:["Dans <code>.github/agents</code>, cliquez sur <code>redacteur-backlog.agent.md</code>.","<kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans redacteur-backlog.agent.md",x:"---\ndescription: \"Réécrit des user stories SprintDesk à partir de la revue et des décisions validées. Utiliser après la revue.\"\ntools: ['read', 'search', 'edit']\n---\n# Rédacteur backlog\n\n## Mission\n- Réécrire les US à partir de sprintdesk/resultats/revue.md et des décisions validées par l'humain dans la conversation.\n- Appliquer la skill ¤formater-us¤ (format cible et règles de rédaction).\n- Laisser toute décision non prise (ND-xx) dans la section \"Questions ouvertes\" de l'US.\n- Une US que la revue juge correcte (\"Aucune action\") est recopiée à l'identique, sans retouche.\n\n## Interdits\n- Ne jamais inventer de règle, de valeur, de format ou de seuil.\n- Ne jamais modifier sprintdesk/backlog/entree/.\n- Ne pas commencer sans revue validée : si sprintdesk/resultats/revue.md est absent, s'arrêter et le dire.\n- Ne jamais publier vers un service externe.\n\n## Sorties\n- Une US par fichier dans sprintdesk/backlog/sortie/lot{n}/US-XXX.md. Une US trop volumineuse peut produire plusieurs fichiers, avec identifiants dérivés (ex. US-{n}02-A, US-{n}02-B) et un lien vers l'US d'origine.\n- sprintdesk/resultats/synthese-actions.md : un tableau listant, pour chaque US, le statut créé / modifié / inchangé / bloqué.\n\n## Fin de réponse\nIndiquer les contrôles réellement exécutés."},
  {t:"why",x:"Le Rédacteur ne \"juge\" pas : il exécute la revue. Sa règle clé : tout ce qui n'est pas décidé reste une <b>question ouverte</b>."}]},
 {t:"Créer un nouvel agent : le Contrôleur",b:[
  {t:"p",x:"Jusqu'ici vous avez <b>édité</b> des squelettes. Vous allez maintenant en <b>créer</b> un depuis zéro."},
  {t:"ol",x:[
   "Appuyez sur <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>P</kbd> : la <b>palette de commandes</b> s'ouvre en haut.",
   "Tapez <code>Chat: New Custom Agent</code> puis <kbd>Entrée</kbd> sur la ligne qui apparaît.",
   "On vous demande où l'enregistrer : choisissez <code>.github/agents</code>.",
   "Nom du fichier : tapez <code>controleur-backlog</code> puis <kbd>Entrée</kbd>.",
   "Un fichier <code>controleur-backlog.agent.md</code> s'ouvre avec un modèle. <kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez le contenu ci-dessous, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"warn",x:"Commande introuvable ? Méthode manuelle : clic droit sur le dossier <code>.github/agents</code> > <code>Nouveau fichier</code> > nommez-le exactement <code>controleur-backlog.agent.md</code>, puis collez le contenu."},
  {t:"copy",l:"À COPIER dans controleur-backlog.agent.md",x:"---\ndescription: \"Contrôle les user stories SprintDesk réécrites par rapport aux règles métier et au plan, sans rien modifier. Utiliser après la réécriture.\"\ntools: ['read', 'search']\n---\n# Contrôleur backlog\n\n## Mission\n- Comparer chaque US de sprintdesk/backlog/sortie/ à l'US d'origine (sprintdesk/backlog/entree/), à regles-metier.md et aux critères de réussite de PLAN.md.\n- Vérifier, pour chaque US : identifiant conservé, source citée, aucune règle inventée, au moins 2 critères d'acceptation vérifiables, ND-xx présentes en questions ouvertes.\n- Vérifier qu'une US jugée correcte est restée identique.\n\n## Interdits\n- Ne modifier aucun fichier (lecture seule).\n- Ne pas corriger : signaler seulement.\n\n## Sortie attendue\nUn tableau dans la conversation : US | Critère vérifié | Résultat (OK / KO) | Preuve (citation du fichier) | Action proposée.\nTerminer par : \"Contrôles réellement exécutés\" et la liste des points à faire trancher par l'humain."},
  {t:"why",x:"Cet agent n'a que <code>read</code> et <code>search</code> : il lui est <b>techniquement impossible</b> de modifier un fichier. La contrainte est dans l'outil, pas seulement dans la consigne."}]},
 {t:"Vérifier que vos agents sont visibles",b:[
  {t:"ol",x:["Ouvrez le chat, nouveau chat (<code>+</code>).","Cliquez sur le sélecteur de mode (en bas à gauche).","Dans la liste, cherchez : <code>reviewer-backlog</code>, <code>redacteur-backlog</code>, <code>controleur-backlog</code>."]},
  {t:"see",x:"Les 3 agents dans la liste, sous <code>Agent</code>, <code>Ask</code>, <code>Plan</code>."},
  {t:"warn",x:"Agent absent ? (1) Le fichier est-il bien dans <code>.github/agents</code> ? (2) Se termine-t-il par <code>.agent.md</code> ? (3) L'en-tête commence-t-il par <code>---</code> sur la 1<sup>re</sup> ligne ? (4) Sinon : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>P</kbd>, tapez <code>Developer: Reload Window</code>, <kbd>Entrée</kbd>."}]},
 {t:"Lancer le Reviewer",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>).","Sélecteur de mode : choisissez <code>reviewer-backlog</code>.","Collez le prompt ci-dessous, puis <kbd>Entrée</kbd>."]},
  {t:"copy",l:"À COPIER (mode reviewer-backlog)",x:"Fais la revue des cinq user stories de sprintdesk/backlog/entree/lot{n}/ en suivant PLAN.md. Écris le résultat dans sprintdesk/resultats/revue.md. Ne réécris aucune US."},
  {t:"ol",x:["Si Copilot demande l'autorisation de créer/modifier un fichier, lisez le nom (<code>revue.md</code>) puis cliquez <code>Autoriser</code> / <code>Continue</code>.","Dans l'explorateur, ouvrez <code>sprintdesk/resultats/revue.md</code>."]},
  {t:"see",x:"Un constat par défaut, avec règle concernée et gravité ; l'US correcte marquée « Aucune action »."}]},
 {t:"Valider le diagnostic (étape humaine)",b:[
  {t:"p",x:"Étape <b>obligatoire</b> avant la réécriture : l'humain relit et décide. Lisez <code>revue.md</code> avec ces questions :"},
  {t:"check",id:"c3a",x:["Chaque constat cite une règle RM-xx ou ND-xx exacte","L'US contradictoire est bien identifiée, avec la règle contredite","L'US correcte est bien marquée « Aucune action »","Aucune règle n'a été inventée dans les recommandations","Les questions métier sont des <b>questions</b>, pas des réponses déguisées"]},
  {t:"p",x:"S'il y a un défaut, corrigez par la critique (même chat, même agent) :"},
  {t:"copy",l:"Exemple de correction",x:"Ton constat sur l'US concernée cite une règle qui n'existe pas dans regles-metier.md. Retire-le ou reformule-le en question ouverte, puis mets à jour sprintdesk/resultats/revue.md."},
  {t:"p",x:"Pour les <b>décisions métier</b> (ND-xx), notez-les : vous les laisserez en questions ouvertes à l'étape suivante. Ne tranchez rien vous-même."}]},
 {t:"Lancer le Rédacteur",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>).","Sélecteur de mode : <code>redacteur-backlog</code>.","Collez le prompt ci-dessous."]},
  {t:"copy",l:"À COPIER (mode redacteur-backlog)",x:"La revue sprintdesk/resultats/revue.md est validée. Réécris les cinq US du lot {n} dans sprintdesk/backlog/sortie/lot{n}/, une US par fichier. Laisse toutes les décisions non prises (ND-xx) en questions ouvertes, sans les trancher. Recopie à l'identique l'US que la revue juge correcte. Produis aussi sprintdesk/resultats/synthese-actions.md."},
  {t:"ol",x:["Autorisez les créations de fichiers après lecture du nom.","Ouvrez chaque fichier de <code>sprintdesk/backlog/sortie/lot{n}/</code> et relisez.","Seulement si tout est bon : <code>Conserver</code>, puis <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"see",x:"Des US au format Besoin / Règles métier / Critères Étant donné-Quand-Alors / Dépendances / Questions ouvertes."}]},
 {t:"Lancer le Contrôleur et conclure",b:[

  {t:"copy",l:"À COPIER (mode controleur-backlog)",x:"Contrôle les US de sprintdesk/backlog/sortie/lot{n}/ par rapport à celles de sprintdesk/backlog/entree/lot{n}/, à regles-metier.md et aux critères de réussite de PLAN.md. Donne le tableau de contrôle."},
  {t:"p",x:"Pour chaque ligne <code>KO</code>, retournez voir le Rédacteur avec le correctif précis (mêmes gestes que précédemment)."},
  {t:"check",id:"c3b",x:["Trois agents visibles dans le sélecteur","<code>revue.md</code> validée par un humain avant réécriture","5 US traitées dans <code>backlog/sortie/lot{n}/</code>, identifiants conservés","L'US correcte est restée identique","Aucune ND-xx n'a été tranchée : toutes sont en questions ouvertes","Le contrôleur n'a plus de <code>KO</code> (ou les <code>KO</code> restants sont expliqués)"]}]}

/* ====================================================== 4 */
{icon:"🧰",title:"Atelier 3 — Skills",sub:"Savoir-faire réutilisables",
 goal:"Vous donnez aux agents des procédures précises (format d'US, méthode de revue), puis vous créez votre propre skill.",
 steps:[
 {t:"Comprendre ce qu'est une skill",b:[
  {t:"table",h:["","Agent","Skill"],r:[["Répond à","<b>Qui</b> fait ?","<b>Comment</b> faire ?"],["Analogie","Fiche de poste","Mode d'emploi / procédure"],["Fichier","<code>.github/agents/nom.agent.md</code>","<code>.github/skills/nom/SKILL.md</code>"],["Chargée","Quand vous choisissez l'agent","Quand la tâche correspond à sa <code>description</code>"],["Partagée ?","Non","Oui : plusieurs agents peuvent s'en servir"]]},
  {t:"mock",x:".github/skills/\n  formater-us/\n    SKILL.md        <- la procédure\n    modele-us.md    <- un fichier annexe (modèle)"},
  {t:"warn",x:"Deux règles qui piègent : (1) le <code>name</code> dans l'en-tête doit être <b>identique au nom du dossier</b> ; (2) la <code>description</code> est ce qui permet à Copilot de choisir la skill : elle doit dire <b>quand</b> l'utiliser."}]},
 {t:"Compléter la skill formater-us",b:[
  {t:"ol",x:["Explorateur : <code>.github</code> > <code>skills</code> > <code>formater-us</code>.","Ouvrez d'abord <code>modele-us.md</code> et lisez le modèle cible (c'est lui que la skill va faire respecter).","Ouvrez <code>SKILL.md</code> : <kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez le contenu ci-dessous, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/skills/formater-us/SKILL.md",x:"---\nname: formater-us\ndescription: \"Formate une user story SprintDesk selon le modèle cible : champs obligatoires, critères d'acceptation Given/When/Then, questions ouvertes. Utiliser pour réécrire ou contrôler le format d'une US.\"\n---\n# Skill formater-us\n\n## Quand l'utiliser\nPour réécrire une US au format cible, ou vérifier qu'une US respecte ce format.\n\n## Procédure\n1. Utiliser le modèle de ¤modele-us.md¤ : Titre, Besoin (En tant que / Je souhaite / Afin de), Règles métier, Critères d'acceptation, Dépendances, Questions ouvertes. Toutes les sections sont présentes, même vides (\"Aucune\").\n2. Conserver l'identifiant d'origine dans le titre (US-XXX). En cas de découpage, dériver les identifiants (US-XXX-A, US-XXX-B) et citer l'US d'origine.\n3. Rédiger les critères d'acceptation sous la forme \"Étant donné ..., quand ..., alors ...\". Un critère = un seul comportement, observable et vérifiable (oui/non). Au moins 2 critères par US.\n4. Citer en \"Règles métier\" uniquement des règles qui existent dans regles-metier.md (RM-xx).\n5. Information manquante ou décision non prise (ND-xx) : l'écrire dans \"Questions ouvertes\". Ne jamais inventer une valeur, un seuil, un format ou une règle.\n6. US déjà conforme : la recopier à l'identique et le signaler. Ne rien \"améliorer\".\n\n## Exemple conforme / contre-exemple\n- Conforme : sprintdesk/backlog/entree/lot1/US-105.md (toutes sections, critères Étant donné/Quand/Alors, RM-01 citée, questions ouvertes \"Aucune\").\n- Contre-exemple : sprintdesk/backlog/entree/lot1/US-104.md (aucun critère d'acceptation, aucune règle, aucune section)."},
  {t:"why",x:"L'étape 5 est le garde-fou central : l'information manquante devient une question, jamais une invention. L'étape 6 protège l'US déjà correcte."}]},
 {t:"Compléter la skill revue-agilite",b:[
  {t:"ol",x:["Dans <code>.github/skills/revue-agilite</code>, ouvrez <code>checklist.md</code> (7 questions de revue) pour la lire.","Ouvrez <code>SKILL.md</code> : <kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/skills/revue-agilite/SKILL.md",x:"---\nname: revue-agilite\ndescription: \"Revue agile d'une user story SprintDesk : valeur, périmètre, testabilité, règles inventées, dépendances, découpage. Utiliser pour diagnostiquer une US avant réécriture.\"\n---\n# Skill revue-agilite\n\n## Procédure\nAppliquer ¤checklist.md¤ à chaque US, puis produire des observations argumentées (pas seulement une note ni un oui/non).\n\n## Règles\n- Distinguer ce qui est bloquant (la US ne peut pas être réalisée ou testée en l'état) de ce qui est une recommandation (amélioration utile mais non bloquante).\n- Citer pour chaque observation la règle ou le critère concerné (RM-xx, ND-xx, ou la ligne de la checklist) et la phrase de l'US qui pose problème.\n- Repérer une contradiction avec regles-metier.md en citant la règle validée contredite.\n- Une décision manquante se formule en question métier à faire trancher, jamais en solution.\n- Une US correcte reçoit \"Aucune action\" : ne pas inventer de défaut pour justifier la revue.\n- Ne jamais réécrire l'US : la revue diagnostique seulement."},
  {t:"why",x:"La skill transforme la checklist en méthode : exiger une <b>preuve</b> (la phrase fautive) rend chaque constat vérifiable par vous."}]},
 {t:"Créer une nouvelle skill : verifier-regles-metier",b:[
  {t:"p",x:"Comme pour l'agent, vous <b>créez</b> maintenant depuis zéro. Cette skill décrit comment vérifier une US contre les règles métier."},
  {t:"ol",x:[
   "Explorateur : clic droit sur le dossier <code>.github/skills</code> > <code>Nouveau dossier</code> > tapez <code>verifier-regles-metier</code> > <kbd>Entrée</kbd>.",
   "Clic droit sur ce nouveau dossier > <code>Nouveau fichier</code> > tapez exactement <code>SKILL.md</code> (majuscules) > <kbd>Entrée</kbd>.",
   "Le fichier s'ouvre vide. Collez le contenu ci-dessous, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/skills/verifier-regles-metier/SKILL.md",x:"---\nname: verifier-regles-metier\ndescription: \"Vérifie qu'une user story SprintDesk respecte les règles métier validées (RM-xx) et ne tranche aucune décision non prise (ND-xx). Utiliser pour contrôler une US réécrite avant validation.\"\n---\n# Skill verifier-regles-metier\n\n## Quand l'utiliser\nAprès la réécriture d'une US, ou pour contrôler une US avant de la valider.\n\n## Procédure\n1. Lire sprintdesk/contexte/regles-metier.md.\n2. Relever dans l'US chaque affirmation qui ressemble à une règle (valeur, statut, délai, droit, format, notification...).\n3. Pour chacune : trouver la RM-xx correspondante. Si aucune ne correspond, regarder si un ND-xx couvre le sujet.\n4. Classer le résultat :\n   - Conforme : la RM-xx est citée et respectée.\n   - Contradiction : l'US contredit une RM-xx (citer les deux).\n   - Invention : aucune RM-xx ni ND-xx ne couvre cette affirmation.\n   - Décision tranchée : l'US répond à un sujet ND-xx qui doit rester question ouverte.\n5. Restituer un tableau : Affirmation de l'US | Règle liée | Résultat | Action proposée.\n\n## Règles\n- Ne jamais corriger l'US : signaler seulement.\n- Ne jamais combler un manque par une hypothèse : le proposer en question ouverte."},
  {t:"see",x:"Dans l'explorateur : <code>.github/skills/verifier-regles-metier/SKILL.md</code>, à côté des deux autres skills."}]},
 {t:"Tester vos skills",b:[
  {t:"p",x:"Une skill s'active toute seule quand la demande correspond à sa <code>description</code>. Pour le vérifier :"},
  {t:"ol",x:["Nouveau chat (<code>+</code>), mode <code>Agent</code>.","Collez le prompt ci-dessous."]},
  {t:"copy",l:"À COPIER (mode Agent)",x:"Sans modifier aucun fichier : contrôle l'une des US de sprintdesk/backlog/sortie/lot{n}/ avec la skill verifier-regles-metier, et dis-moi quelles skills tu as utilisées."},
  {t:"see",x:"Un tableau Affirmation | Règle liée | Résultat | Action, et la mention de la skill utilisée. Sous la réponse, la liste des références doit inclure <code>SKILL.md</code>."},
  {t:"warn",x:"La skill n'est pas utilisée ? (1) Le <code>name</code> est-il identique au nom du dossier ? (2) Le fichier s'appelle-t-il exactement <code>SKILL.md</code> ? (3) La <code>description</code> contient-elle des mots de votre demande ? Sinon, nommez-la explicitement dans le prompt, comme ci-dessus."},
  {t:"p",x:"Bonus : refaites tourner le Rédacteur sur une US avec la skill <code>formater-us</code> complétée, et comparez avec votre première version."}]},
 {t:"Bilan final",b:[
  {t:"check",id:"c4",x:["<code>copilot-instructions.md</code> complété (sans TODO)","<code>PLAN.md</code> créé et relu","Agents : reviewer et rédacteur complétés, contrôleur créé","Skills : formater-us et revue-agilite complétées, verifier-regles-metier créée","5 US traitées avec traçabilité et questions ouvertes visibles","J'ai indiqué à l'équipe les contrôles que j'ai réellement exécutés"]},
  {t:"why",x:"Vous avez construit un <b>harness</b> : instructions (règles permanentes) + plan (contrat) + agents (rôles) + skills (savoir-faire) + validation humaine. Copilot travaille désormais dans un cadre, et non plus au hasard."},
  {t:"table",h:["Brique","Fichier","Question à laquelle elle répond"],r:[["Instructions","<code>.github/copilot-instructions.md</code>","Quelles règles sont <b>toujours</b> vraies ?"],["Plan","<code>PLAN.md</code>","Que fait-on, et comment jugera-t-on ?"],["Agent","<code>.github/agents/*.agent.md</code>","<b>Qui</b> fait quoi ?"],["Skill","<code>.github/skills/*/SKILL.md</code>","<b>Comment</b> le faire ?"]]}]}
 ]},
