{icon:"📜",title:"Atelier 1 · Partie A — Instructions",sub:"Les règles permanentes de Copilot",
 goal:"Vous donnez à Copilot ses règles permanentes : contexte du projet, ton, style, périmètre et limites. Puis vous vérifiez qu'il les applique.",
 steps:[
 {t:"Rappel : à quoi servent les instructions",b:[
  {t:"p",x:"Le fichier <code>.github/copilot-instructions.md</code> est ajouté <b>automatiquement</b> à chaque conversation Copilot du dépôt. Vous ne le lancez jamais : il est simplement toujours là. Ce que vous y écrivez doit donc être vrai <b>tout le temps</b>."},
  {t:"table",h:["Moment du workflow","Sans instructions","Avec instructions"],r:[
   ["Vous demandez : « Réécris US-104 »","Copilot choisit un ton, un format, parfois tutoie, ajoute des émojis","Vouvoiement, identifiant <code>US-104</code> conservé, format Faits / Propositions / Questions ouvertes"],
   ["L'US parle d'un délai de traitement absent des règles","Copilot annonce « 48 h » avec aplomb","Copilot répond : « décision non prise (ND-03), je la mets en question ouverte »"],
   ["L'US est déjà correcte","Copilot la « améliore » quand même","Copilot la laisse inchangée et le dit"],
   ["Vous demandez de publier le résultat","Copilot propose un <code>git push</code>","Copilot demande d'abord une validation humaine"]]},
  {t:"mock",x:"Votre prompt (Ask)         Réponse de Copilot\n─────────────────────────   ─────────────────────────────────────────────\n« Réécris US-104 »     ->   US-104 : Faits : aucun délai dans RM-01..08\n                            Proposition : à valider par le PO\n                            Question ouverte : ND-03 (délai)\n                            Contrôles : relu contre RM-01 à RM-08\n\nSous la réponse : « Used 1 reference » -> copilot-instructions.md"},
  {t:"why",x:"Repère : une règle y a sa place si vous la répéteriez dans <b>chaque</b> prompt (« vouvoie », « ne tranche pas »). Une méthode longue (comment formater une US) va dans une <b>skill</b>, pas ici."}]},
 {t:"Comprendre ce que vous allez construire",b:[
  {t:"table",h:["Ordre","Livrable","Analogie","Rôle"],r:[["1","<code>.github/copilot-instructions.md</code>","Règlement intérieur","Règles lues par Copilot dans <b>toutes</b> vos conversations"],["2","<code>PLAN.md</code>","Contrat de mission","Ce qu'on va faire, ce qu'on ne décidera pas, comment on jugera le résultat"]]},
  {t:"why",x:"On ne fait <b>pas</b> faire le travail à Copilot tout de suite. D'abord le cadre (instructions), ensuite la feuille de route (plan). Un cadre vague donne un travail vague."}]},
 {t:"Ouvrir le fichier d'instructions",b:[
  {t:"ol",x:["Explorateur : dépliez le dossier <code>.github</code> (le point au début du nom est normal).","Cliquez sur <code>copilot-instructions.md</code>.","Vous voyez un squelette rempli de <code>TODO</code> : c'est ce que vous allez compléter."]},
  {t:"warn",x:"Dossier <code>.github</code> introuvable ? Vérifiez que vous avez ouvert <code>formation-harness</code> et non <code>begin</code> ou un sous-dossier."}]},
 {t:"Remplacer le contenu par les instructions complètes",b:[
  {t:"ol",x:["Cliquez dans le fichier ouvert au centre.","<kbd>Ctrl</kbd>+<kbd>A</kbd> (tout sélectionner), puis <kbd>Suppr</kbd>.","Cliquez sur <code>Copier</code> ci-dessous, puis <kbd>Ctrl</kbd>+<kbd>V</kbd> dans le fichier.","<kbd>Ctrl</kbd>+<kbd>S</kbd> pour enregistrer."]},
  {t:"copy",l:"À COPIER dans .github/copilot-instructions.md",x:"# Instructions communes — SprintDesk\n\n## Contexte du projet\n- HabiOuest est un bailleur social régional (12 agences, 450 collaborateurs, 18 000 logements).\n- SprintDesk est l'outil interne qui centralise, qualifie, priorise et suit les demandes métier adressées à la DSI.\n- Utilisateurs : Demandeur, Qualificateur, Traitant, Manager (voir ¤sprintdesk/contexte/produit.md¤).\n- Mission : produire un backlog de user stories exploitable, sans inventer de décision métier.\n\n## Public et ton\n- Tes interlocuteurs sont des chefs de projet, pas des développeurs : pas de jargon technique non expliqué.\n- Ton professionnel, clair, courtois et direct. Vouvoiement.\n- Pas d'émojis, pas d'enthousiasme excessif, pas de formules de politesse inutiles.\n- Toujours répondre en français.\n\n## Style de rédaction\n- Phrases courtes : une idée par phrase.\n- Listes et tableaux plutôt que longs paragraphes.\n- Vocabulaire métier constant : \"demande\", \"demandeur\", \"qualificateur\", \"traitant\", \"backlog\", \"critère d'acceptation\". Ne pas le remplacer par des synonymes.\n- Les identifiants (US-xxx, RM-xx, ND-xx) sont toujours écrits tels quels.\n- Une user story suit le modèle ¤.github/skills/formater-us/modele-us.md¤.\n\n## Périmètre (ce que tu fais)\n- Lire et diagnostiquer des user stories.\n- Poser des questions métier et proposer un plan.\n- Rédiger des user stories au format cible dans ¤sprintdesk/backlog/sortie/¤.\n- Contrôler le résultat par rapport aux règles métier.\n\n## Limites (ce que tu ne fais pas)\n- Ne pas écrire ni modifier le code de l'application SprintDesk.\n- Ne pas modifier ¤sprintdesk/backlog/entree/¤ ni ¤sprintdesk/contexte/¤.\n- Ne pas trancher une décision non prise (ND-01 à ND-06) et ne pas fixer la priorité d'une demande réelle.\n- Ne pas publier vers un service externe (outil de ticketing, GitHub, messagerie).\n- Ne pas traiter de sujets hors projet : le dire poliment et revenir au projet.\n\n## Format de réponse\n- Commencer par la conclusion en une phrase, puis le détail.\n- Séparer : Faits (issus des fichiers), Propositions (les tiennes), Questions ouvertes (à trancher par l'humain).\n- Citer le fichier source et la règle (RM-xx ou ND-xx) à côté de chaque affirmation importante.\n- Terminer par la liste des contrôles réellement exécutés.\n\n## Références\n- Contexte produit : ¤sprintdesk/contexte/produit.md¤.\n- Règles métier validées (RM-xx) et décisions non prises (ND-xx) : ¤sprintdesk/contexte/regles-metier.md¤.\n- US d'origine : ¤sprintdesk/backlog/entree/¤ (ne jamais les modifier).\n- Production : ¤sprintdesk/backlog/sortie/¤ et ¤sprintdesk/resultats/¤.\n\n## Règles\n- Ne jamais inventer de règle ou de décision métier absente des fichiers de contexte.\n- Toute décision non prise (ND-xx) devient une question ouverte, jamais une hypothèse cachée.\n- Conserver l'identifiant et la traçabilité de chaque US (identifiant d'origine, lien vers l'US source).\n- Distinguer explicitement : faits (issus des fichiers), propositions (de Copilot), questions ouvertes (à trancher par l'humain).\n- Si une US est déjà correcte, la laisser inchangée et le dire.\n- Ne jamais publier vers un service externe sans validation humaine.\n- En fin de réponse, indiquer les contrôles réellement exécutés (et seulement ceux-là).\n- En cas de doute, de règle manquante ou de contradiction entre deux sources : s'arrêter et poser la question.\n\n## Où trouver les détails\n- Format d'une US : skill ¤formater-us¤.\n- Méthode de revue : skill ¤revue-agilite¤."},
  {t:"see",x:"Un fichier d'environ 55 lignes, avec les sections Contexte, Public et ton, Style, Périmètre, Limites, Format de réponse, Références, Règles, sans aucun <code>TODO</code>, et l'onglet sans point <code>●</code>."},
  {t:"table",h:["Section","Ce qu'elle dit à Copilot","Défaut qu'elle évite"],r:[["Contexte du projet","Qui est HabiOuest, ce que fait SprintDesk, la mission","Réponses génériques, hors-sujet"],["Public et ton","À qui il parle, comment (vouvoiement, pas d'émojis, français)","Ton familier ou jargon technique"],["Style de rédaction","Phrases courtes, listes, vocabulaire métier constant","Pavés de texte, synonymes qui changent le sens"],["Périmètre","Ce qu'il fait","Hors-sujet, initiatives non demandées"],["Limites","Ce qu'il ne fait jamais (code, ND-xx, publication...)","Inventions, actions risquées"],["Format de réponse","Conclusion d'abord, faits / propositions / questions, sources, contrôles","Réponses difficiles à vérifier"],["Références et Règles","Où lire, et les règles de rigueur","Règles métier devinées"]]},
  {t:"why",x:"Chaque section répond à un défaut vu au guide précédent. Un bon fichier d'instructions est <b>court, concret, vérifiable</b> : « vouvoiement, pas d'émojis » se vérifie en un coup d'œil, « sois professionnel » non. Il se charge dans toutes vos conversations : ne mettez que ce qui doit <b>toujours</b> être vrai."}]},
 {t:"Vérifier que Copilot applique ces règles",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>), mode <code>Ask</code>.","Collez la question ci-dessous."]},
  {t:"p",x:"Un bon test est un <b>piège</b> : une question dont la réponse dépend de vos instructions. Faites les 7 essais ci-dessous, <b>chacun dans un nouveau chat</b> (<code>+</code>), mode <code>Ask</code>. Pour chaque essai : collez le prompt, lisez la réponse, comparez avec la colonne « Attendu », puis notez OK ou KO."},
  {t:"copy",l:"Essai 1 — Les règles (le plus simple)",x:"Quelles règles dois-tu respecter sur ce projet ? Réponds en une liste courte."},
  {t:"see",x:"Une liste qui reprend : ne pas inventer, tracer les US, distinguer faits / propositions / questions, laisser une US correcte inchangée, ne pas publier sans validation."},
  {t:"copy",l:"Essai 2 — Contexte, ton et style",x:"Explique en 3 phrases à un directeur ce qu'est SprintDesk et à quoi sert ce projet."},
  {t:"see",x:"3 phrases courtes, vouvoiement, sans émoji ni jargon, qui mentionnent HabiOuest, la DSI et centraliser / qualifier / prioriser / suivre les demandes."},
  {t:"copy",l:"Essai 3 — Le piège de la décision non prise",x:"Au bout de combien de jours une demande non traitée doit-elle déclencher une alerte ?"},
  {t:"see",x:"Copilot répond que ce sujet est la décision non prise <b>ND-01</b> (jours calendaires ou ouvrés ?), <b>ne donne aucun chiffre</b> et propose de la noter en question ouverte. Un chiffre annoncé (« 5 jours ») est un KO."},
  {t:"copy",l:"Essai 4 — Les limites : le code",x:"Écris le code HTML et JavaScript du formulaire de dépôt d'une demande."},
  {t:"see",x:"Un refus poli : écrire le code est hors périmètre. Copilot propose à la place de rédiger ou vérifier la user story du formulaire."},
  {t:"copy",l:"Essai 5 — Les limites : la publication",x:"Publie maintenant toutes les US du lot {n} sur GitHub Issues."},
  {t:"see",x:"Copilot refuse de publier sans validation humaine et propose une préparation (prévisualisation) à valider. Une publication effectuée est un KO grave."},
  {t:"copy",l:"Essai 6 — L'US déjà correcte",x:"Améliore l'US-{n}05 (à ajouter avec #)."},
  {t:"see",x:"Copilot indique qu'elle est correcte et ne propose aucune modification (ou une simple remarque non bloquante)."},
  {t:"copy",l:"Essai 7 — Le format de réponse",x:"Que penses-tu de l'US-{n}01 ? (à ajouter avec #)"},
  {t:"see",x:"Conclusion en une phrase d'abord ; puis les parties Faits / Propositions / Questions ouvertes ; les fichiers sources cités ; une ligne finale « Contrôles réellement exécutés »."},
  {t:"p",x:"<b>Analysez vos résultats</b> avec cette grille, puis ajustez <b>une seule ligne</b> des instructions avant de refaire l'essai KO :"},
  {t:"table",h:["Constat","Cause probable","Correction à tester dans le fichier"],r:[["Un chiffre ou une règle est inventé (essai 3)","La règle sur les ND-xx n'est pas assez explicite","Ajouter un exemple : « Exemple : seuil d'alerte = ND-01, donc question ouverte, jamais un nombre de jours »"],["Ton familier, émojis (essai 2)","La section Public et ton n'est pas appliquée","Reformuler en ordre court : « Réponds toujours au vouvoiement, sans émoji »"],["Du code est écrit (essai 4)","Limites trop vagues","Préciser : « Si on demande du code, refuse et propose une US à la place »"],["Réponse sans sources (essai 7)","Format de réponse trop long ou ignoré","Mettre cette règle en tête de la section"],["Aucune de vos règles n'apparaît","Fichier non chargé","Voir l'encadré jaune ci-dessous"]]},
  {t:"p",x:"<b>Bonus : voir l'effet du fichier (test A/B).</b>"},
  {t:"ol",x:["Dans l'explorateur, clic droit sur <code>.github/copilot-instructions.md</code> > <code>Renommer</code> > nommez-le <code>copilot-instructions.off.md</code>.","Nouveau chat, refaites l'<b>Essai 3</b> (le piège ND-01) et notez la réponse : sans instructions, Copilot est beaucoup plus susceptible d'annoncer un chiffre.","<b>Remettez le nom d'origine</b> <code>copilot-instructions.md</code>, puis refaites l'Essai 3 pour constater la différence."]},
  {t:"no",x:"N'oubliez pas de remettre le nom d'origine, sinon la suite de l'atelier fonctionnera sans vos règles."},
  {t:"why",x:"Cette façon de procéder (test, constat, <b>un seul</b> changement, nouveau test) est la base de l'amélioration d'un harness. Changer plusieurs choses à la fois empêche de savoir ce qui a marché."},
  {t:"warn",x:"Copilot répond de façon générique ? Cliquez sur la ligne « Used 1 reference » (ou « Références utilisées ») sous la réponse : <code>copilot-instructions.md</code> doit y figurer. Sinon, vérifiez que le fichier est enregistré (pas de <code>●</code>), bien situé dans <code>.github</code> et correctement nommé."},
  {t:"check",id:"c1b",x:["<code>copilot-instructions.md</code> est complété, sans <code>TODO</code>, et enregistré","Copilot répond en français, en vouvoyant, sans émojis","Il refuse de trancher une décision non prise (ND-xx) et pose une question","J'ai vu la différence avec et sans le fichier d'instructions","Le fichier a bien retrouvé son nom d'origine"]}]}
 ]},
/* ====================================================== 2b */
{icon:"🧭",title:"Atelier 1 · Partie B — Planification",sub:"Construire et valider PLAN.md",
 goal:"Vous construisez avec Copilot un plan validé (PLAN.md) avant de lui laisser modifier quoi que ce soit.",
 steps:[
 {t:"Plan ou simple prompt : quelle différence ?",b:[
  {t:"p",x:"<b>Analogie :</b> dire à un artisan « fais-moi une maison » (un prompt) ou lui remettre un <b>plan de chantier validé</b> (un plan). Dans les deux cas il construit, mais seul le plan permet de vérifier avant de couper la première planche."},
  {t:"table",h:["","Simple prompt","Plan (mode Plan puis PLAN.md)"],r:[
   ["Questions","Copilot devine ce qui manque","Copilot <b>vous interroge</b> avant d'agir"],
   ["Décisions non prises","Tranchées en silence (« 30 jours »)","Listées en <b>questions ouvertes</b>, avec qui tranche"],
   ["Critères de réussite","Aucun : « ça a l'air bien »","Oui / non, écrits <b>avant</b> le travail"],
   ["Durée de vie","Disparaît dans l'historique du chat","<b>Fichier</b> relisible, partageable, versionnable"],
   ["Correction d'un défaut","Tout recommencer","Corriger <b>une ligne</b> du plan"],
   ["Travail en équipe","Chacun a son propre prompt","Un contrat commun et validé"],
   ["Risque","L'erreur est découverte <b>après</b> l'action","L'erreur est découverte <b>avant</b> l'action"],
   ["Contrôle humain","Aucun point d'arrêt","Points de validation écrits"]]},
  {t:"p",x:"<b>Exemple concret sur SprintDesk :</b>"},
  {t:"table",h:["Demande","Ce qui se passe"],r:[
   ["<b>Prompt seul :</b> « Corrige les US du lot {n} »","Copilot réécrit les 5 US d'un coup, <b>y compris la correcte</b>, invente des messages d'erreur, des délais ou des formats, et ne dit pas ce qu'il a deviné. Vous découvrez les inventions après coup."],
   ["<b>Avec un plan :</b> « Prépare un plan pour traiter le lot {n} »","Copilot vous demande quelle décision prendre pour chaque règle manquante, propose un format de US, des critères oui/non et une validation avant la réécriture. Seulement ensuite on exécute."]]},
  {t:"p",x:"<b>Essai facultatif (3 minutes de lecture) :</b> constatez la différence. Nouveau chat, mode <code>Ask</code>, collez ce prompt et lisez la réponse. Notez combien de questions Copilot vous a posées (probablement aucune)."},
  {t:"copy",l:"À COPIER (mode Ask) — le prompt « sans plan »",x:"Corrige directement les 5 user stories du lot {n} (dossier sprintdesk/backlog/entree/lot{n}). Réponds dans le chat sans écrire de fichier."},
  {t:"why",x:"Garde-fou : cet essai n'écrit rien. Il sert uniquement de <b>point de comparaison</b> avec la réponse que vous obtiendrez avec le plan. Gardez-la en tête."}]},
 {t:"Le mode Plan en synthèse : quand l'utiliser",b:[
  {t:"p",x:"<b>En 3 phrases :</b> le mode Plan fait travailler Copilot en <b>lecture seule</b>. Il explore vos fichiers, vous pose des questions, puis propose un plan détaillé. Rien n'est modifié tant que vous n'avez pas validé."},
  {t:"mock",x:"1. Vous décrivez l'objectif\n        |\n        v\n2. Copilot LIT les fichiers (sans rien modifier)\n        |\n        v\n3. Copilot vous POSE DES QUESTIONS\n        |\n        v\n4. Copilot PROPOSE un plan\n        |\n        v\n5. Vous CRITIQUEZ / VALIDEZ  --(si non)--> retour à 3 ou 4\n        |\n        v\n6. Seulement ensuite : on EXÉCUTE (mode Agent)"},
  {t:"p",x:"<b>Cas d'usage concrets sur SprintDesk :</b>"},
  {t:"table",h:["Situation","Prompt type à adapter","Ce que vous obtenez"],r:[
   ["Cadrer le traitement d'un lot","« Prépare un plan de traitement du lot {n}. Pose-moi les questions nécessaires avant de finaliser. »","Étapes, rôles, questions ouvertes, critères de réussite"],
   ["Découper une US trop volumineuse","« Propose un plan pour découper l'US-{n}02 en US plus petites, sans les écrire. »","Une liste de US candidates, les décisions à prendre, l'ordre de traitement"],
   ["Préparer un atelier de décision","« Prépare un plan d'atelier pour trancher les décisions non prises (ND-xx) du lot {n} : ordre du jour, participants, décisions attendues. »","Un déroulé, la liste des ND-xx à trancher, qui doit être présent"],
   ["Préparer la publication","« Prépare un plan pour publier les US validées vers un outil de suivi : étapes, prévisualisation, validations humaines. »","Un processus sûr, avec les points d'arrêt, avant toute action réelle"],
   ["Comprendre un écart","« Prépare un plan d'enquête : le Rédacteur a introduit un délai absent des règles. Quelles hypothèses vérifier, dans quel ordre ? »","Une liste d'hypothèses (source, plan, instructions, agent, skill) à vérifier une par une"]]},
  {t:"table",h:["Mon besoin","Le bon mode","Exemple"],r:[
   ["Comprendre, poser une question","<b>Ask</b>","« Que veut dire RM-04 ? »"],
   ["Cadrer un travail à plusieurs étapes ou incertain","<b>Plan</b>","« Prépare le traitement du lot {n}. »"],
   ["Exécuter un travail cadré","<b>Agent</b> (ou un agent personnalisé)","« Réécris les US selon la revue validée. »"]]},
  {t:"no",x:"Ne passez pas par un plan pour une question simple (« que veut dire RM-04 ? ») : le mode Ask suffit. Le plan est utile quand il y a <b>plusieurs étapes, des inconnues ou un risque de décider à la place du métier</b>."},
  {t:"copy",l:"Pour vous entraîner dès maintenant (mode Plan)",x:"Prépare un plan pour découper l'US-{n}02 en US plus petites, sans les écrire. Sources : sprintdesk/contexte/regles-metier.md et sprintdesk/backlog/entree/lot{n}/US-{n}02.md. Pose-moi les questions nécessaires avant de finaliser. Distingue faits, propositions et décisions à prendre. Ne modifie aucun fichier."},
  {t:"see",x:"Copilot vous pose des questions (que vise exactement chaque besoin ? lequel est prioritaire ?), puis propose un découpage <b>sans écrire les US</b>."}]},
 {t:"Passer en mode Plan",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>).","Cliquez sur le sélecteur de mode (en bas à gauche de la zone de saisie).","Choisissez <code>Plan</code>."]},
  {t:"why",x:"En mode Plan, Copilot ne modifie rien : il vous pose des questions et propose. C'est exactement ce qu'on veut avant d'agir."},
  {t:"warn",x:"Pas de mode <code>Plan</code> dans la liste ? Utilisez <code>Ask</code> : le prompt de l'étape suivante fonctionne pareil."}]},
 {t:"Envoyer le prompt de plan",b:[
  {t:"p",x:"Collez le prompt ci-dessous. Il contient un modèle de prompt complet : contexte, sources, interdits, tâche, exigences, format."},
  {t:"copy",l:"À COPIER dans le chat (mode Plan)",x:"Nous préparons le backlog du projet SprintDesk, lot {n}.\n\nLis :\n- sprintdesk/contexte/produit.md ;\n- sprintdesk/contexte/regles-metier.md ;\n- les cinq user stories de sprintdesk/backlog/entree/lot{n}/.\n\nNe réécris pas encore les user stories.\nNe modifie pas le code de l'application.\nNe publie rien.\n\nPrépare un plan de traitement du backlog.\n\nAvant de finaliser ce plan :\n1. Identifie les ambiguïtés, contradictions et informations manquantes.\n2. Pose les questions nécessaires aux décisions métier.\n3. Propose le format des user stories attendues.\n4. Définis des critères de qualité vérifiables.\n5. Propose les étapes, les rôles des agents et leurs livrables.\n6. Identifie les points de validation humaine.\n7. Prévois comment comparer les résultats aux attentes.\n\nDistingue les faits fournis, les propositions et les décisions à prendre."},
  {t:"see",x:"Copilot lit les fichiers (vous voyez leurs noms défiler), puis vous pose des questions et/ou propose un premier plan."}]},
 {t:"Répondre aux questions de Copilot",b:[
  {t:"p",x:"Répondre à ces questions <b>est</b> le travail de cadrage. Appliquez cette grille à chaque question :"},
  {t:"table",h:["Si la question porte sur...","Votre réponse"],r:[["Une règle <b>validée</b> (RM-xx)","Confirmez-la : « Oui, c'est RM-xx »"],["Une décision <b>non prise</b> (ND-xx)","<b>Ne tranchez pas.</b> « Question ouverte, à faire trancher par le référent produit »"],["Le format des US","Prenez le modèle : Titre, Besoin (En tant que / Je souhaite / Afin de), Règles métier, Critères d'acceptation (Étant donné / Quand / Alors), Dépendances, Questions ouvertes"],["Qui valide","« Un humain valide le diagnostic avant réécriture, et chaque US avant dépôt dans sortie/ »"]]},
  {t:"copy",l:"Réponse type à utiliser si vous hésitez",x:"Pour toute décision non prise (ND-xx), ne propose pas de valeur par défaut : liste-la en \"Questions ouvertes\" avec la mention \"à trancher par le référent produit\". Le format cible des US est : Titre, Besoin (En tant que / Je souhaite / Afin de), Règles métier, Critères d'acceptation (Étant donné / Quand / Alors), Dépendances, Questions ouvertes. Un humain valide le diagnostic avant toute réécriture, puis chaque US avant dépôt dans backlog/sortie/."},
  {t:"no",x:"Ne répondez jamais à une question ND-xx par une invention « raisonnable » (ex : « 30 jours »). C'est précisément ce que l'atelier interdit."}]},
 {t:"Affiner le plan par la critique",b:[
  {t:"p",x:"Le premier plan est rarement bon. Envoyez ces trois critiques, <b>une par message</b>, en lisant la réponse entre chaque."},
  {t:"copy",l:"Critique 1 — critères vérifiables",x:"Chaque critère de réussite doit pouvoir être répondu par oui ou non. Réécris ceux qui sont flous (par exemple \"US de qualité\")."},
  {t:"copy",l:"Critique 2 — séparer diagnostic et réécriture",x:"Sépare clairement les étapes : 1. diagnostic, 2. validation humaine, 3. réécriture, 4. contrôle contre les RM-xx, 5. synthèse. Aucune étape ne doit mélanger diagnostic et réécriture."},
  {t:"copy",l:"Critique 3 — conditions d'arrêt",x:"Ajoute une section \"Limites et conditions d'arrêt\" : l'agent s'arrête et demande si une règle manque, si deux sources se contredisent, ou si une décision métier est requise."}]},
 {t:"Enregistrer le plan dans PLAN.md",b:[
  {t:"p",x:"Jusqu'ici, le plan n'existe que dans le chat. On le sauvegarde dans un fichier."},
  {t:"ol",x:["Nouveau passage au mode <code>Agent</code> (sélecteur de mode).","<b>Gardez la même conversation</b> (ne cliquez pas sur <code>+</code>) pour que Copilot retrouve le plan.","Collez le prompt ci-dessous."]},
  {t:"copy",l:"À COPIER dans le chat (mode Agent)",x:"Crée le fichier PLAN.md à la racine du projet avec le plan que nous venons de valider. Utilise exactement ces 12 sections : 1. Objectif et périmètre, 2. Sources, 3. Résultats attendus, 4. Règles métier validées, 5. Questions ouvertes, 6. Format cible d'une US, 7. Étapes, 8. Rôles des agents, 9. Skills, 10. Contrôles et validations humaines, 11. Critères de réussite, 12. Limites et conditions d'arrêt. Ne crée ni ne modifie aucun autre fichier."},
  {t:"ol",x:["Relisez le fichier créé, puis cliquez <code>Conserver</code>.","<kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"see",x:"Un fichier <code>PLAN.md</code> à la racine de l'explorateur, avec 12 titres numérotés."}]},
 {t:"Contrôler votre plan",b:[
  {t:"p",x:"Relisez <code>PLAN.md</code> avec cette liste. Si une case reste vide, redemandez à Copilot de corriger <b>ce point précis</b>."},
  {t:"check",id:"c2",x:["Je sais dire ce que chaque agent <b>fera</b> et ce qu'il <b>ne décidera pas</b>","Chaque ND-xx rencontrée est une question ouverte, pas une hypothèse cachée","Les critères de réussite sont vérifiables (oui/non)","Un humain valide avant toute décision métier et toute publication","Une condition d'arrêt est définie","Le plan est lisible en 10 minutes (pas un roman)"]},
  {t:"why",x:"<code>PLAN.md</code> est votre contrat : les agents de l'Atelier 2 vont le suivre, et c'est lui qui servira à juger leur travail."}]},
 {t:"Exemples de PLAN.md d'autres lots",b:[
  {t:"p",x:"Voici des plans <b>résumés</b> rédigés pour d'autres lots, et un contre-exemple. Lisez-les pour voir la <b>forme</b> d'un bon plan."},
  {t:"warn",x:"Ne copiez pas un plan : le vôtre doit venir de <b>vos</b> US et de <b>vos</b> échanges avec Copilot. Les exemples affichés excluent automatiquement <b>votre</b> lot ({n}), pour ne pas vous influencer."},
  {t:"ex",lot:1,l:"Exemple — PLAN du lot 1 (Dépôt des demandes)",x:"# PLAN — SprintDesk, lot 1\n\n## 1. Objectif et périmètre\nRendre exploitables les US 101 à 105. Hors périmètre : code, import Excel réel.\n\n## 2. Sources\nproduit.md · regles-metier.md · sprintdesk/backlog/entree/lot1/\n\n## 4. Règles métier validées utilisées\nRM-01 (titre, description et service obligatoires) · RM-08 (création au statut Nouvelle)\n\n## 5. Questions ouvertes\n| ND-02 | Pièces jointes : autorisées ? formats ? taille ? | Référent produit |\n| ND-03 | Notifications : lesquelles, à qui ? | Référent produit |\n\n## 7. Étapes\n1. Diagnostic · 2. Validation humaine · 3. Découpage de l'US volumineuse (validation) · 4. Réécriture · 5. Contrôle · 6. Synthèse\n\n## 11. Critères de réussite\n[ ] Aucune US n'autorise l'envoi sans titre (RM-01)\n[ ] Pièces jointes et notifications apparaissent en questions ouvertes (ND-02, ND-03)\n[ ] L'US déjà correcte est restée identique\n[ ] Chaque US a au moins 2 critères vérifiables\n\n## 12. Limites et conditions d'arrêt\nS'arrêter si une US contredit RM-01 : demander quelle version est valide plutôt que choisir."},
  {t:"ex",lot:2,l:"Exemple — PLAN du lot 2 (Qualification et priorisation)",x:"# PLAN — SprintDesk, lot 2\n\n## 1. Objectif et périmètre\nRendre exploitables les US 201 à 205 sans inventer de règle.\nHors périmètre : code, paramétrage de SLA, suggestion par IA.\n\n## 2. Sources\nproduit.md · regles-metier.md · sprintdesk/backlog/entree/lot2/\n\n## 3. Résultats attendus\nUS dans backlog/sortie/lot2/ · revue.md · synthese-actions.md\n\n## 4. Règles métier validées utilisées\nRM-03 (impact et urgence) · RM-04 (calcul de la priorité) · RM-05 (seul un Qualificateur fixe impact et urgence)\n\n## 5. Questions ouvertes\n| ID | Question | Qui tranche |\n| ND-05 | Tri par défaut de la liste des demandes | Référent produit |\n| (hors règles) | Matrice paramétrable, SLA, escalade, suggestion par IA : aucune règle validée | Référent produit |\n\n## 6. Format cible d'une US\nTitre · Besoin · Règles métier · Critères (Étant donné / quand / alors) · Dépendances · Questions ouvertes\n\n## 7. Étapes\n1. Diagnostic de chaque US (Reviewer)\n2. Validation humaine du diagnostic\n3. Proposition de découpage de l'US volumineuse, validée par l'humain\n4. Réécriture (Rédacteur)\n5. Contrôle contre RM-03, RM-04, RM-05 (Contrôleur)\n6. Synthèse des actions\n\n## 8. Rôles des agents\nReviewer : constate, ne réécrit pas · Rédacteur : réécrit, ne tranche aucune ND · Contrôleur : lecture seule\n\n## 9. Skills\nrevue-agilite · formater-us · verifier-regles-metier\n\n## 10. Contrôles et validations humaines\nAvant réécriture · avant dépôt dans sortie/ · aucune publication externe\n\n## 11. Critères de réussite\n[ ] Aucune US ne permet au demandeur de fixer la priorité (RM-05)\n[ ] La priorité n'est jamais saisie à la main : elle est calculée (RM-04)\n[ ] Le tri par défaut est une question ouverte (ND-05), pas une valeur\n[ ] L'US déjà correcte est restée identique\n[ ] Chaque US a au moins 2 critères vérifiables\n\n## 12. Limites et conditions d'arrêt\nS'arrêter et demander si deux règles se contredisent, si une règle manque, ou si une décision métier est requise."},
  {t:"ex",lot:3,l:"Exemple — PLAN du lot 3 (Traitement des demandes)",x:"# PLAN — SprintDesk, lot 3\n\n## 1. Objectif et périmètre\nRendre exploitables les US 301 à 305. Hors périmètre : code, publication.\n\n## 2. Sources\nproduit.md · regles-metier.md · sprintdesk/backlog/entree/lot3/\n\n## 4. Règles métier validées utilisées\nRM-02 (statuts) · RM-06 (historisation des changements de statut) · RM-07 (un seul Traitant à la fois)\n\n## 5. Questions ouvertes\n| ND-03 | Notifications : lesquelles, à qui ? | Référent produit |\n| ND-04 | Réouverture d'une demande Terminée ou Refusée | Référent produit |\n\n## 7. Étapes\n1. Diagnostic · 2. Validation humaine · 3. Découpage de l'US volumineuse (validation) · 4. Réécriture · 5. Contrôle · 6. Synthèse\n\n## 11. Critères de réussite\n[ ] Toute affectation respecte RM-07 (un seul Traitant)\n[ ] Tout changement de statut cite RM-06 (auteur, date/heure, ancien et nouveau statut)\n[ ] Réouverture et notifications apparaissent en questions ouvertes (ND-04, ND-03)\n[ ] L'US déjà correcte est restée identique\n[ ] Chaque US a au moins 2 critères vérifiables\n\n## 12. Limites et conditions d'arrêt\nS'arrêter si une US contredit RM-07 ou RM-06 : demander quelle version est valide plutôt que choisir."},
  {t:"ex",lot:4,l:"Exemple — PLAN du lot 4 (Pilotage du backlog)",x:"# PLAN — SprintDesk, lot 4\n\n## 1. Objectif et périmètre\nRendre exploitables les US 401 à 405. Hors périmètre : code, mise en place réelle des alertes.\n\n## 4. Règles métier validées utilisées\nRM-02 (les six statuts) · RM-04 (priorités P1 à P4)\n\n## 5. Questions ouvertes\n| ND-01 | Seuil d'ancienneté d'une alerte : jours calendaires ou ouvrés, combien ? | Référent produit |\n| ND-03 | Notification par e-mail : laquelle, à qui ? | Référent produit |\n\n## 7. Étapes\n1. Diagnostic · 2. Validation humaine · 3. Découpage du tableau de bord complet · 4. Réécriture · 5. Contrôle · 6. Synthèse\n\n## 11. Critères de réussite\n[ ] Aucune valeur de seuil n'est écrite : le seuil reste la question ND-01\n[ ] Les compteurs listent les six statuts de RM-02\n[ ] Les filtres et alertes ont des critères vérifiables\n[ ] L'US déjà correcte est restée identique\n\n## 12. Limites et conditions d'arrêt\nS'arrêter si une US propose elle-même une valeur pour une décision non prise."},
  {t:"table",h:["À repérer dans ces plans","Où le trouver"],r:[["Une décision non prise est une <b>question avec un responsable</b>, jamais une valeur","Section 5 de chaque plan"],["Les critères se répondent par <b>oui ou non</b>","Section 11"],["Chaque étape sépare diagnostic, validation humaine et réécriture","Section 7"],["Le plan dit quand s'arrêter","Section 12"],["Chaque règle citée existe réellement (RM-xx)","Section 4"]]},
  {t:"ex",l:"Contre-exemple — un mauvais plan",x:"# Plan\n1. Lire les US\n2. Les améliorer\n3. Les enregistrer\n4. Vérifier que c'est bien"},
  {t:"table",h:["Défaut du mauvais plan","Pourquoi c'est un problème"],r:[["Aucune source citée","Copilot choisit lui-même ce qu'il lit"],["« Améliorer » : verbe vague","Autorise toutes les inventions et modifie même l'US correcte"],["Aucune question ni décision à prendre","Les ND-xx seront devinées"],["« Vérifier que c'est bien » : critère flou","Impossible de répondre oui ou non"],["Aucune validation humaine","Rien ne s'arrête avant l'écriture des fichiers"],["Aucune condition d'arrêt","Copilot continue même s'il manque une règle"]]},
  {t:"why",x:"Un bon plan se reconnaît à ce qu'il <b>réduit la liberté de Copilot sur le métier</b> tout en lui laissant la liberté de bien rédiger. Si vous ne trouvez pas dans le vôtre les éléments du premier tableau, retournez en mode Plan et critiquez le point manquant."}]}
 ]},
/* ====================================================== 3 */
{icon:"🧑‍💼",title:"Atelier 2 — Agents",sub:"Éditer puis créer des rôles",
 goal:"Vous transformez Copilot en équipe de rôles distincts (une « fiche de poste » par agent), puis vous les faites travailler avec validation humaine.",
 steps:[
 {t:"Rappel : c'est quoi un agent, comment l'invoquer",b:[
  {t:"p",x:"Un <b>agent</b> est un rôle (un fichier <code>.github/agents/nom.agent.md</code>) que <b>vous choisissez</b> pour une conversation. Il fixe la mission, les outils autorisés et la forme de la sortie. Contrairement aux instructions (toujours actives) et aux skills (chargées à la demande), un agent ne s'active que si vous le sélectionnez."},
  {t:"table",h:["Question","Réponse","Exemple SprintDesk"],r:[
   ["À quoi ça sert ?","Séparer les rôles et <b>limiter les droits</b> de chacun","Le Reviewer constate sans réécrire ; le Contrôleur ne peut rien modifier"],
   ["Comment l'invoquer ?","Dans le chat, ouvrez la liste des agents (à côté du mode <code>Agent</code>) et cliquez sur son nom","Sélectionner <code>reviewer-backlog</code>, puis taper le prompt"],
   ["Que mettre dans le prompt ?","Peu de choses : la fiche de poste fait déjà le cadrage","« Fais la revue du lot 2 »"],
   ["Comment vérifier ?","Le nom de l'agent est affiché dans la zone de saisie ; le livrable apparaît dans le fichier prévu","<code>sprintdesk/resultats/revue.md</code> créé, US d'entrée intactes"]]},
  {t:"mock",x:"Un lot d'US à traiter, trois conversations, trois agents :\n\n[reviewer-backlog] « Fais la revue du lot 2 »\n   -> écrit resultats/revue.md             (vous relisez, vous validez)\n\n[redacteur-us]     « Réécris le lot 2 selon la revue validée »\n   -> écrit backlog/sortie/lot2/US-xxx.md  (les ND-xx restent des questions)\n\n[controleur-us]    « Contrôle le lot 2 »\n   -> tableau Affirmation | Règle | Résultat (lecture seule)"},
  {t:"table",h:["Situation","Agent à choisir","Pourquoi"],r:[
   ["Vous voulez un diagnostic, pas de réécriture","Reviewer","Son interdit : ne pas réécrire"],
   ["La revue est validée, il faut produire les US","Rédacteur","Il applique la revue sans trancher les ND-xx"],
   ["Vous voulez un second avis indépendant","Contrôleur","Il n'a que <code>read</code> et <code>search</code> : il ne peut pas se valider lui-même"],
   ["Renommer un fichier, chercher une info","Mode <code>Agent</code> seul","Tâche ponctuelle, pas besoin de rôle"]]},
  {t:"warn",x:"L'agent n'apparaît pas dans la liste ? Vérifiez l'extension <code>.agent.md</code>, le dossier <code>.github/agents</code>, et les <code>---</code> et guillemets de l'en-tête. Un agent est une fiche de poste : un interdit écrit peut être ignoré, seule la restriction de <code>tools</code> l'empêche réellement."},
  {t:"why",x:"Repère : un <b>agent</b> répond à « <b>qui</b> fait et avec quels droits ? », une <b>skill</b> à « <b>comment</b> le faire ? », les <b>instructions</b> à « qu'est-ce qui est <b>toujours</b> vrai ? »."}]},
 {t:"Comprendre ce qu'est un agent",b:[
  {t:"p",x:"Un agent est une <b>fiche de poste</b> : un fichier texte que Copilot lit avant de travailler. Sans fiche, il improvise ; avec, il connaît sa mission, ses limites et sa sortie."},
  {t:"mock",x:"---\ndescription: \"Phrase qui dit QUAND utiliser cet agent\"\ntools: ['read', 'search', 'edit']\n---\n# Nom de l'agent\n\n## Mission      <- ce qu'il fait\n## Interdits     <- ce qu'il ne décide pas\n## Sortie        <- ce qu'il rend, et où"},
  {t:"table",h:["Partie","Rôle"],r:[["Entre les deux <code>---</code> (<b>en-tête</b>)","Réglages techniques. <code>description</code> = résumé affiché dans la liste. <code>tools</code> = outils autorisés"],["<code>read</code>","Lire des fichiers"],["<code>search</code>","Chercher dans le projet"],["<code>edit</code>","Créer / modifier des fichiers"],["Sous l'en-tête","Texte libre : mission, interdits, sortie"]]},
  {t:"warn",x:"Respectez les <code>---</code> et les guillemets de l'en-tête à la lettre : une erreur et l'agent n'apparaît pas dans la liste."},
  {t:"table",h:["Agent","Rôle","Outils","Pourquoi séparés"],r:[["Reviewer","Constate (diagnostic)","read, search, edit (écrit uniquement revue.md)","Il ne réécrit pas"],["Rédacteur","Réécrit selon la revue validée","read, search, edit","Il ne tranche aucune décision métier"],["Contrôleur (à créer)","Vérifie le résultat","read, search (lecture seule)","Il ne se valide pas lui-même"]]},
  {t:"why",x:"Un seul agent qui juge <b>et</b> corrige se valide lui-même. Séparer les rôles, c'est comme séparer l'auditeur et le comptable."}]},
 {t:"Agent global ou agents spécialisés ?",b:[
  {t:"p",x:"Vous avez déjà un agent « global » : le mode <code>Agent</code> du chat. Il sait tout faire, mais il n'a ni rôle, ni limites, ni mémoire de votre méthode. Voici ce qu'apporte un agent <b>personnalisé</b>."},
  {t:"table",h:["","Agent global (mode Agent seul)","Agents spécialisés (Reviewer, Rédacteur, Contrôleur)"],r:[
   ["Rôle","Fait tout : lit, juge, réécrit, valide","Une mission précise par agent"],
   ["Outils","Tous ceux disponibles","<b>Limités</b> à ce qui est nécessaire (le Contrôleur ne peut rien modifier)"],
   ["Qui juge ?","Le même qui a écrit : il se valide lui-même","Un autre agent contrôle, l'humain tranche entre les deux"],
   ["Points d'arrêt","Aucun : tout est enchaîné","Un livrable relisible à chaque étape (revue.md, US, tableau de contrôle)"],
   ["Reproductibilité","Dépend de la façon dont vous formulez à chaque fois","Même fiche de poste, même sortie attendue, à chaque fois"],
   ["Traçabilité","Difficile de savoir qui a décidé quoi","Chaque constat, chaque réécriture, chaque contrôle est identifié"],
   ["Réutilisation","À retaper","Un clic dans la liste, le prompt peut être court"],
   ["Qualité","Instructions diluées dans une tâche très large","Instructions courtes et ciblées : meilleure obéissance"],
   ["Sécurité","Peut modifier ce que vous ne vouliez pas","Le droit de modifier est restreint par agent"]]},
  {t:"p",x:"<b>Exemple concret :</b> la même demande « Revois et corrige le lot {n} ».\n"},
  {t:"table",h:["Avec l'agent global","Avec 3 agents spécialisés"],r:[["Il lit les US, juge, réécrit les 5 fichiers et dit « terminé ». Vous découvrez après coup qu'il a réécrit l'US correcte, inventé un délai et que personne n'a contrôlé.","Le Reviewer écrit <code>revue.md</code> (vous relisez) ; vous validez ; le Rédacteur écrit les US en laissant les ND en questions ouvertes ; le Contrôleur compare à RM-xx et au plan. Chaque erreur est détectée <b>là où elle est apparue</b>."]]},
  {t:"why",x:"C'est le même principe qu'en entreprise : celui qui prépare, celui qui contrôle et celui qui décide ne sont pas la même personne. Quand un agent produit une erreur, vous savez <b>quelle fiche de poste corriger</b>, alors qu'avec un agent global il faut deviner dans quel prompt chercher."},
  {t:"no",x:"Un agent global reste utile pour une <b>petite tâche ponctuelle</b> (renommer un fichier, chercher une information). Les agents spécialisés se justifient dès que la tâche a plusieurs étapes, des risques ou doit être répétée."},
  {t:"p",x:"<b>Bonus facultatif (à faire après avoir lancé vos 3 agents) :</b> mesurez la différence. Mode <code>Agent</code> sans agent personnalisé, nouveau chat :"},
  {t:"copy",l:"Bonus — l'essai « agent global » (dans un dossier d'essai)",x:"Fais la revue des 5 US de sprintdesk/backlog/entree/lot{n}/ ET réécris-les, en une seule fois. Écris tout dans le dossier sprintdesk/resultats/essai-agent-global/ (et nulle part ailleurs)."},
  {t:"p",x:"Comparez avec vos résultats des 3 agents : l'US correcte est-elle restée intacte ? Des règles ont-elles été inventées ? Voyez-vous qui a décidé quoi ? Puis supprimez le dossier <code>essai-agent-global</code> (clic droit > <code>Supprimer</code>)."}]},
 {t:"Éditer l'agent Reviewer",b:[
  {t:"ol",x:["Explorateur : <code>.github</code> > <code>agents</code> > cliquez sur <code>reviewer-backlog.agent.md</code>.","Vous voyez un squelette avec des <code>TODO</code>.","<kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, puis collez le contenu ci-dessous.","<kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans reviewer-backlog.agent.md",x:"---\ndescription: \"Relit des user stories SprintDesk et produit une revue sans les réécrire. Utiliser pour diagnostiquer défauts, contradictions et dépendances.\"\ntools: ['read', 'search', 'edit']\n---\n# Reviewer backlog\n\n## Mission\n- Lire le contexte (sprintdesk/contexte/produit.md et regles-metier.md), le fichier PLAN.md et les US d'origine du lot dans sprintdesk/backlog/entree/.\n- Appliquer la skill ¤revue-agilite¤ à chaque US.\n- Identifier défauts, contradictions et dépendances, en citant la règle concernée (RM-xx ou ND-xx).\n- Une US correcte reçoit la mention \"Aucune action\" : ne pas lui chercher de défaut.\n\n## Interdits\n- Ne pas réécrire les US et ne pas proposer de nouvelle version complète.\n- Ne pas inventer de règle et ne trancher aucune décision non prise (ND-xx) : la formuler en question métier.\n- Ne modifier aucun fichier sauf sprintdesk/resultats/revue.md. Ne jamais toucher sprintdesk/backlog/entree/.\n\n## Sortie attendue (une entrée par constat)\n¤¤¤\nUS concernée :\nConstat :\nRègle ou critère concerné :\nGravité : bloquant / recommandation\nQuestion métier éventuelle :\nRecommandation :\n¤¤¤\nÉcrire le résultat dans sprintdesk/resultats/revue.md.\n\n## Fin de réponse\nIndiquer les contrôles réellement exécutés et la liste des questions ouvertes à faire trancher."},
  {t:"see",x:"Fichier sans <code>TODO</code>, onglet sans <code>●</code>."},
  {t:"why",x:"<b>Mission</b> = ce qu'il fait. <b>Interdits</b> = ce qui l'empêche d'inventer ou de réécrire. <b>Sortie</b> = un format fixe pour que vous puissiez comparer les constats."}]},
 {t:"Éditer l'agent Rédacteur",b:[
  {t:"ol",x:["Dans <code>.github/agents</code>, cliquez sur <code>redacteur-backlog.agent.md</code>.","<kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans redacteur-backlog.agent.md",x:"---\ndescription: \"Réécrit des user stories SprintDesk à partir de la revue et des décisions validées. Utiliser après la revue.\"\ntools: ['read', 'search', 'edit']\n---\n# Rédacteur backlog\n\n## Mission\n- Réécrire les US à partir de sprintdesk/resultats/revue.md et des décisions validées par l'humain dans la conversation.\n- Appliquer la skill ¤formater-us¤ (format cible et règles de rédaction).\n- Laisser toute décision non prise (ND-xx) dans la section \"Questions ouvertes\" de l'US.\n- Une US que la revue juge correcte (\"Aucune action\") est recopiée à l'identique, sans retouche.\n\n## Interdits\n- Ne jamais inventer de règle, de valeur, de format ou de seuil.\n- Ne jamais modifier sprintdesk/backlog/entree/.\n- Ne pas commencer sans revue validée : si sprintdesk/resultats/revue.md est absent, s'arrêter et le dire.\n- Ne jamais publier vers un service externe.\n\n## Sorties\n- Une US par fichier dans sprintdesk/backlog/sortie/lot{n}/US-XXX.md. Une US trop volumineuse peut produire plusieurs fichiers, avec identifiants dérivés (ex. US-{n}02-A, US-{n}02-B) et un lien vers l'US d'origine.\n- sprintdesk/resultats/synthese-actions.md : un tableau listant, pour chaque US, le statut créé / modifié / inchangé / bloqué.\n\n## Fin de réponse\nIndiquer les contrôles réellement exécutés."},
  {t:"why",x:"Le Rédacteur ne \"juge\" pas : il exécute la revue. Sa règle clé : tout ce qui n'est pas décidé reste une <b>question ouverte</b>."}]},
 {t:"Créer un nouvel agent : le Contrôleur",b:[
  {t:"p",x:"Jusqu'ici vous avez <b>édité</b> des squelettes. Vous allez maintenant en <b>créer</b> un depuis zéro."},
  {t:"ol",x:[
   "Appuyez sur <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>P</kbd> : la <b>palette de commandes</b> s'ouvre en haut.",
   "Tapez <code>Chat: New Custom Agent</code> puis <kbd>Entrée</kbd> sur la ligne qui apparaît.",
   "On vous demande où l'enregistrer : choisissez <code>.github/agents</code>.",
   "Nom du fichier : tapez <code>controleur-backlog</code> puis <kbd>Entrée</kbd>.",
   "Un fichier <code>controleur-backlog.agent.md</code> s'ouvre avec un modèle. <kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez le contenu ci-dessous, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"warn",x:"Commande introuvable ? Méthode manuelle : clic droit sur le dossier <code>.github/agents</code> > <code>Nouveau fichier</code> > nommez-le exactement <code>controleur-backlog.agent.md</code>, puis collez le contenu."},
  {t:"copy",l:"À COPIER dans controleur-backlog.agent.md",x:"---\ndescription: \"Contrôle les user stories SprintDesk réécrites par rapport aux règles métier et au plan, sans rien modifier. Utiliser après la réécriture.\"\ntools: ['read', 'search']\n---\n# Contrôleur backlog\n\n## Mission\n- Comparer chaque US de sprintdesk/backlog/sortie/ à l'US d'origine (sprintdesk/backlog/entree/), à regles-metier.md et aux critères de réussite de PLAN.md.\n- Vérifier, pour chaque US : identifiant conservé, source citée, aucune règle inventée, au moins 2 critères d'acceptation vérifiables, ND-xx présentes en questions ouvertes.\n- Vérifier qu'une US jugée correcte est restée identique.\n\n## Interdits\n- Ne modifier aucun fichier (lecture seule).\n- Ne pas corriger : signaler seulement.\n\n## Sortie attendue\nUn tableau dans la conversation : US | Critère vérifié | Résultat (OK / KO) | Preuve (citation du fichier) | Action proposée.\nTerminer par : \"Contrôles réellement exécutés\" et la liste des points à faire trancher par l'humain."},
  {t:"why",x:"Cet agent n'a que <code>read</code> et <code>search</code> : il lui est <b>techniquement impossible</b> de modifier un fichier. La contrainte est dans l'outil, pas seulement dans la consigne."}]},
 {t:"Vérifier que vos agents sont visibles",b:[
  {t:"ol",x:["Ouvrez le chat, nouveau chat (<code>+</code>).","Cliquez sur le sélecteur de mode (en bas à gauche).","Dans la liste, cherchez : <code>reviewer-backlog</code>, <code>redacteur-backlog</code>, <code>controleur-backlog</code>."]},
  {t:"see",x:"Les 3 agents dans la liste, sous <code>Agent</code>, <code>Ask</code>, <code>Plan</code>."},
  {t:"warn",x:"Agent absent ? (1) Le fichier est-il bien dans <code>.github/agents</code> ? (2) Se termine-t-il par <code>.agent.md</code> ? (3) L'en-tête commence-t-il par <code>---</code> sur la 1<sup>re</sup> ligne ? (4) Sinon : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>P</kbd>, tapez <code>Developer: Reload Window</code>, <kbd>Entrée</kbd>."}]},
 {t:"Lancer le Reviewer",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>).","Sélecteur de mode : choisissez <code>reviewer-backlog</code>.","Collez le prompt ci-dessous, puis <kbd>Entrée</kbd>."]},
  {t:"copy",l:"À COPIER (mode reviewer-backlog)",x:"Fais la revue des cinq user stories de sprintdesk/backlog/entree/lot{n}/ en suivant PLAN.md. Écris le résultat dans sprintdesk/resultats/revue.md. Ne réécris aucune US."},
  {t:"ol",x:["Si Copilot demande l'autorisation de créer/modifier un fichier, lisez le nom (<code>revue.md</code>) puis cliquez <code>Autoriser</code> / <code>Continue</code>.","Dans l'explorateur, ouvrez <code>sprintdesk/resultats/revue.md</code>."]},
  {t:"see",x:"Un constat par défaut, avec règle concernée et gravité ; l'US correcte marquée « Aucune action »."}]},
 {t:"Valider le diagnostic (étape humaine)",b:[
  {t:"p",x:"Étape <b>obligatoire</b> avant la réécriture : l'humain relit et décide. Lisez <code>revue.md</code> avec ces questions :"},
  {t:"check",id:"c3a",x:["Chaque constat cite une règle RM-xx ou ND-xx exacte","L'US contradictoire est bien identifiée, avec la règle contredite","L'US correcte est bien marquée « Aucune action »","Aucune règle n'a été inventée dans les recommandations","Les questions métier sont des <b>questions</b>, pas des réponses déguisées"]},
  {t:"p",x:"S'il y a un défaut, corrigez par la critique (même chat, même agent) :"},
  {t:"copy",l:"Exemple de correction",x:"Ton constat sur l'US concernée cite une règle qui n'existe pas dans regles-metier.md. Retire-le ou reformule-le en question ouverte, puis mets à jour sprintdesk/resultats/revue.md."},
  {t:"p",x:"Pour les <b>décisions métier</b> (ND-xx), notez-les : vous les laisserez en questions ouvertes à l'étape suivante. Ne tranchez rien vous-même."}]},
 {t:"Lancer le Rédacteur",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>).","Sélecteur de mode : <code>redacteur-backlog</code>.","Collez le prompt ci-dessous."]},
  {t:"copy",l:"À COPIER (mode redacteur-backlog)",x:"La revue sprintdesk/resultats/revue.md est validée. Réécris les cinq US du lot {n} dans sprintdesk/backlog/sortie/lot{n}/, une US par fichier. Laisse toutes les décisions non prises (ND-xx) en questions ouvertes, sans les trancher. Recopie à l'identique l'US que la revue juge correcte. Produis aussi sprintdesk/resultats/synthese-actions.md."},
  {t:"ol",x:["Autorisez les créations de fichiers après lecture du nom.","Ouvrez chaque fichier de <code>sprintdesk/backlog/sortie/lot{n}/</code> et relisez.","Seulement si tout est bon : <code>Conserver</code>, puis <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"see",x:"Des US au format Besoin / Règles métier / Critères Étant donné-Quand-Alors / Dépendances / Questions ouvertes."}]},
 {t:"Lancer le Contrôleur et conclure",b:[
  {t:"ol",x:["Nouveau chat (<code>+</code>), mode <code>controleur-backlog</code>.","Collez le prompt."]},
  {t:"copy",l:"À COPIER (mode controleur-backlog)",x:"Contrôle les US de sprintdesk/backlog/sortie/lot{n}/ par rapport à celles de sprintdesk/backlog/entree/lot{n}/, à regles-metier.md et aux critères de réussite de PLAN.md. Donne le tableau de contrôle."},
  {t:"p",x:"Pour chaque ligne <code>KO</code>, retournez voir le Rédacteur avec le correctif précis (mêmes gestes que précédemment)."},
  {t:"check",id:"c3b",x:["Trois agents visibles dans le sélecteur","<code>revue.md</code> validée par un humain avant réécriture","5 US traitées dans <code>backlog/sortie/lot{n}/</code>, identifiants conservés","L'US correcte est restée identique","Aucune ND-xx n'a été tranchée : toutes sont en questions ouvertes","Le contrôleur n'a plus de <code>KO</code> (ou les <code>KO</code> restants sont expliqués)"]}]},
 {t:"Aller plus loin : d'autres agents à créer",b:[
  {t:"p",x:"Vous savez maintenant créer un agent. Voici des idées d'agents utiles sur SprintDesk, du plus simple au plus avancé. Pour chacun, <b>mêmes gestes que pour le Contrôleur</b> : palette de commandes > <code>Chat: New Custom Agent</code> > <code>.github/agents</code>."},
  {t:"table",h:["Agent","Mission","Outils","Interdits","Exemple de prompt"],r:[
   ["<b>Expert agilité</b>","Juger la qualité agile d'une US (critères INVEST) et proposer un découpage","read, search","Réécrire, trancher une ND","« Évalue l'US-{n}02 selon INVEST et propose un découpage à valider. »"],
   ["<b>Priorisation</b>","Calculer la priorité P1 à P4 d'exemples de demandes selon RM-03 et RM-04","read, search","Inventer d'autres règles de calcul, fixer une priorité réelle","« Quelle priorité pour : impact Fort, urgence Normale ? Cite la règle. »"],
   ["<b>Archiviste des questions ouvertes</b>","Rassembler toutes les ND-xx des US de sortie dans un seul fichier, avec qui doit trancher","read, search, edit (un seul fichier)","Proposer des valeurs, modifier les US","« Consolide les questions ouvertes de tous les lots dans questions-ouvertes.md. »"],
   ["<b>Préparateur de publication</b>","Préparer, sans l'envoyer, le contenu à publier vers un outil de suivi (prévisualisation)","read, search, edit (un seul fichier)","Publier quoi que ce soit","« Prépare la prévisualisation des US validées pour le suivi. »"],
   ["<b>Superviseur</b>","Orchestrer : appeler Reviewer, puis attendre votre validation, puis Rédacteur, puis Contrôleur","read, search + appel des autres agents","Décider à votre place, sauter la validation humaine","« Déroule le plan du lot {n} en m'attendant à chaque étape de validation. »"]]},
  {t:"copy",l:"Exemple prêt à l'emploi — .github/agents/expert-agilite.agent.md",x:"---\ndescription: \"Évalue la qualité agile d'une user story SprintDesk (valeur, taille, testabilité, indépendance) et propose un découpage, sans réécrire. Utiliser pour juger une US trop volumineuse ou ambiguë.\"\ntools: ['read', 'search']\n---\n# Expert agilité\n\n## Mission\n- Évaluer chaque US selon INVEST : Indépendante, Négociable, de Valeur, Estimable, Petite, Testable.\n- Pour une US trop volumineuse, proposer un découpage en US plus petites (titres et intentions seulement, sans les rédiger).\n- Citer pour chaque jugement la phrase de l'US et la règle RM-xx ou ND-xx concernée.\n\n## Interdits\n- Ne pas réécrire les US et ne modifier aucun fichier.\n- Ne pas inventer de règle ni trancher une décision non prise (ND-xx) : la formuler en question.\n\n## Sortie attendue\nUn tableau : US | Critère INVEST | Verdict (OK / à améliorer) | Preuve (citation) | Proposition ou question.\nTerminer par les contrôles réellement exécutés."},
  {t:"ol",x:["Créez le fichier comme pour le Contrôleur (nom : <code>expert-agilite</code>), collez le contenu, enregistrez.","Vérifiez qu'il apparaît dans le sélecteur de mode, puis testez avec un nouveau chat."]},
  {t:"copy",l:"Prompt de test (mode expert-agilite)",x:"Évalue l'US-{n}02 selon INVEST et propose un découpage en US plus petites. Ne les rédige pas."},
  {t:"see",x:"Un tableau INVEST avec des preuves citées, et une liste de US candidates (titres seulement)."},
  {t:"why",x:"Un nouvel agent n'est pas toujours utile : créez-en un quand un <b>rôle distinct</b> revient souvent, avec des outils ou des interdits différents. Sinon, une simple skill ou un prompt suffit."}]}
 ]},
/* ====================================================== 4 */
{icon:"🧰",title:"Atelier 3 — Skills",sub:"Savoir-faire réutilisables",
 goal:"Vous donnez aux agents des procédures précises (format d'US, méthode de revue), puis vous créez votre propre skill.",
 steps:[
 {t:"Rappel : c'est quoi une skill, comment l'invoquer",b:[
  {t:"p",x:"Une <b>skill</b> est une procédure écrite une fois (un dossier avec un fichier <code>SKILL.md</code>) que Copilot charge <b>seulement quand la tâche en a besoin</b>. Contrairement aux instructions, elle n'est pas dans chaque conversation : cela évite de noyer le contexte."},
  {t:"table",h:["Question","Réponse","Exemple SprintDesk"],r:[
   ["À quoi ça sert ?","Rendre une méthode <b>reproductible</b> et partagée entre agents","<code>formater-us</code> : toutes les US sortent avec le même modèle et les mêmes critères Given / When / Then"],
   ["Quand est-elle chargée ?","Quand votre demande ressemble à sa <code>description</code>","« Contrôle cette US contre les règles » -> <code>verifier-regles-metier</code> se charge seule"],
   ["Comment la forcer ?","La <b>nommer</b> dans le prompt (ou la choisir avec <code>/</code> si votre version de VS Code l'affiche)","« Avec la skill <code>revue-agilite</code>, relis US-104 »"],
   ["Comment vérifier ?","Regarder « Used … references » sous la réponse : <code>SKILL.md</code> doit y figurer","<code>.github/skills/revue-agilite/SKILL.md</code>"]]},
  {t:"mock",x:"---\nname: verifier-regles-metier        <- identique au nom du dossier\ndescription: Vérifie qu'une US respecte les règles RM-xx\n  et signale les décisions ND-xx. À utiliser quand on\n  demande de contrôler, valider ou relire une US.   <- QUAND l'utiliser\n---\n1. Liste chaque affirmation de l'US.\n2. Relie-la à une règle RM-xx, ou marque « sans règle ».\n3. Une décision ND-xx n'est jamais tranchée : question ouverte.\n4. Rends un tableau Affirmation | Règle | Résultat | Action."},
  {t:"table",h:["Situation dans le workflow","Ce que vous tapez","Skill mobilisée"],r:[
   ["Le Rédacteur réécrit un lot d'US","« Réécris les US du lot 2 »","<code>formater-us</code> (via la description « réécrire / formater une US »)"],
   ["Le Reviewer contrôle la qualité","« Fais la revue du lot 2, cite la phrase fautive »","<code>revue-agilite</code>"],
   ["Vous voulez être sûr","« Utilise explicitement la skill <code>verifier-regles-metier</code> sur US-104 »","<code>verifier-regles-metier</code>, appelée par son nom"]]},
  {t:"why",x:"Repère : si vous recopiez le même bloc de consignes dans deux agents ou deux prompts, c'est une skill. Une règle vraie partout reste dans les <b>instructions</b> ; un rôle (qui) reste dans un <b>agent</b>."}]},
 {t:"Comprendre ce qu'est une skill",b:[
  {t:"table",h:["","Agent","Skill"],r:[["Répond à","<b>Qui</b> fait ?","<b>Comment</b> faire ?"],["Analogie","Fiche de poste","Mode d'emploi / procédure"],["Fichier","<code>.github/agents/nom.agent.md</code>","<code>.github/skills/nom/SKILL.md</code>"],["Chargée","Quand vous choisissez l'agent","Quand la tâche correspond à sa <code>description</code>"],["Partagée ?","Non","Oui : plusieurs agents peuvent s'en servir"]]},
  {t:"mock",x:".github/skills/\n  formater-us/\n    SKILL.md        <- la procédure\n    modele-us.md    <- un fichier annexe (modèle)"},
  {t:"warn",x:"Deux règles qui piègent : (1) le <code>name</code> dans l'en-tête doit être <b>identique au nom du dossier</b> ; (2) la <code>description</code> est ce qui permet à Copilot de choisir la skill : elle doit dire <b>quand</b> l'utiliser."}]},
 {t:"Compléter la skill formater-us",b:[
  {t:"ol",x:["Explorateur : <code>.github</code> > <code>skills</code> > <code>formater-us</code>.","Ouvrez d'abord <code>modele-us.md</code> et lisez le modèle cible (c'est lui que la skill va faire respecter).","Ouvrez <code>SKILL.md</code> : <kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez le contenu ci-dessous, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/skills/formater-us/SKILL.md",x:"---\nname: formater-us\ndescription: \"Formate une user story SprintDesk selon le modèle cible : champs obligatoires, critères d'acceptation Given/When/Then, questions ouvertes. Utiliser pour réécrire ou contrôler le format d'une US.\"\n---\n# Skill formater-us\n\n## Quand l'utiliser\nPour réécrire une US au format cible, ou vérifier qu'une US respecte ce format.\n\n## Procédure\n1. Utiliser le modèle de ¤modele-us.md¤ : Titre, Besoin (En tant que / Je souhaite / Afin de), Règles métier, Critères d'acceptation, Dépendances, Questions ouvertes. Toutes les sections sont présentes, même vides (\"Aucune\").\n2. Conserver l'identifiant d'origine dans le titre (US-XXX). En cas de découpage, dériver les identifiants (US-XXX-A, US-XXX-B) et citer l'US d'origine.\n3. Rédiger les critères d'acceptation sous la forme \"Étant donné ..., quand ..., alors ...\". Un critère = un seul comportement, observable et vérifiable (oui/non). Au moins 2 critères par US.\n4. Citer en \"Règles métier\" uniquement des règles qui existent dans regles-metier.md (RM-xx).\n5. Information manquante ou décision non prise (ND-xx) : l'écrire dans \"Questions ouvertes\". Ne jamais inventer une valeur, un seuil, un format ou une règle.\n6. US déjà conforme : la recopier à l'identique et le signaler. Ne rien \"améliorer\".\n\n## Exemple conforme / contre-exemple\n- Conforme : sprintdesk/backlog/entree/lot{n}/US-{n}05.md (toutes sections, critères Étant donné/Quand/Alors, règles RM-xx citées, questions ouvertes \"Aucune\").\n- Contre-exemple : sprintdesk/backlog/entree/lot{n}/US-{n}04.md (aucun critère d'acceptation, aucune règle, aucune section)."},
  {t:"why",x:"L'étape 5 est le garde-fou central : l'information manquante devient une question, jamais une invention. L'étape 6 protège l'US déjà correcte."}]},
 {t:"Compléter la skill revue-agilite",b:[
  {t:"ol",x:["Dans <code>.github/skills/revue-agilite</code>, ouvrez <code>checklist.md</code> (7 questions de revue) pour la lire.","Ouvrez <code>SKILL.md</code> : <kbd>Ctrl</kbd>+<kbd>A</kbd>, <kbd>Suppr</kbd>, collez, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/skills/revue-agilite/SKILL.md",x:"---\nname: revue-agilite\ndescription: \"Revue agile d'une user story SprintDesk : valeur, périmètre, testabilité, règles inventées, dépendances, découpage. Utiliser pour diagnostiquer une US avant réécriture.\"\n---\n# Skill revue-agilite\n\n## Procédure\nAppliquer ¤checklist.md¤ à chaque US, puis produire des observations argumentées (pas seulement une note ni un oui/non).\n\n## Règles\n- Distinguer ce qui est bloquant (la US ne peut pas être réalisée ou testée en l'état) de ce qui est une recommandation (amélioration utile mais non bloquante).\n- Citer pour chaque observation la règle ou le critère concerné (RM-xx, ND-xx, ou la ligne de la checklist) et la phrase de l'US qui pose problème.\n- Repérer une contradiction avec regles-metier.md en citant la règle validée contredite.\n- Une décision manquante se formule en question métier à faire trancher, jamais en solution.\n- Une US correcte reçoit \"Aucune action\" : ne pas inventer de défaut pour justifier la revue.\n- Ne jamais réécrire l'US : la revue diagnostique seulement."},
  {t:"why",x:"La skill transforme la checklist en méthode : exiger une <b>preuve</b> (la phrase fautive) rend chaque constat vérifiable par vous."}]},
 {t:"Créer une nouvelle skill : verifier-regles-metier",b:[
  {t:"p",x:"Comme pour l'agent, vous <b>créez</b> maintenant depuis zéro. Cette skill décrit comment vérifier une US contre les règles métier."},
  {t:"ol",x:[
   "Explorateur : clic droit sur le dossier <code>.github/skills</code> > <code>Nouveau dossier</code> > tapez <code>verifier-regles-metier</code> > <kbd>Entrée</kbd>.",
   "Clic droit sur ce nouveau dossier > <code>Nouveau fichier</code> > tapez exactement <code>SKILL.md</code> (majuscules) > <kbd>Entrée</kbd>.",
   "Le fichier s'ouvre vide. Collez le contenu ci-dessous, <kbd>Ctrl</kbd>+<kbd>S</kbd>."]},
  {t:"copy",l:"À COPIER dans .github/skills/verifier-regles-metier/SKILL.md",x:"---\nname: verifier-regles-metier\ndescription: \"Vérifie qu'une user story SprintDesk respecte les règles métier validées (RM-xx) et ne tranche aucune décision non prise (ND-xx). Utiliser pour contrôler une US réécrite avant validation.\"\n---\n# Skill verifier-regles-metier\n\n## Quand l'utiliser\nAprès la réécriture d'une US, ou pour contrôler une US avant de la valider.\n\n## Procédure\n1. Lire sprintdesk/contexte/regles-metier.md.\n2. Relever dans l'US chaque affirmation qui ressemble à une règle (valeur, statut, délai, droit, format, notification...).\n3. Pour chacune : trouver la RM-xx correspondante. Si aucune ne correspond, regarder si un ND-xx couvre le sujet.\n4. Classer le résultat :\n   - Conforme : la RM-xx est citée et respectée.\n   - Contradiction : l'US contredit une RM-xx (citer les deux).\n   - Invention : aucune RM-xx ni ND-xx ne couvre cette affirmation.\n   - Décision tranchée : l'US répond à un sujet ND-xx qui doit rester question ouverte.\n5. Restituer un tableau : Affirmation de l'US | Règle liée | Résultat | Action proposée.\n\n## Règles\n- Ne jamais corriger l'US : signaler seulement.\n- Ne jamais combler un manque par une hypothèse : le proposer en question ouverte."},
  {t:"see",x:"Dans l'explorateur : <code>.github/skills/verifier-regles-metier/SKILL.md</code>, à côté des deux autres skills."}]},
 {t:"Tester vos skills",b:[
  {t:"p",x:"Une skill s'active toute seule quand la demande correspond à sa <code>description</code>. Pour le vérifier :"},
  {t:"ol",x:["Nouveau chat (<code>+</code>), mode <code>Agent</code>.","Collez le prompt ci-dessous."]},
  {t:"copy",l:"À COPIER (mode Agent)",x:"Sans modifier aucun fichier : contrôle l'une des US de sprintdesk/backlog/sortie/lot{n}/ avec la skill verifier-regles-metier, et dis-moi quelles skills tu as utilisées."},
  {t:"see",x:"Un tableau Affirmation | Règle liée | Résultat | Action, et la mention de la skill utilisée. Sous la réponse, la liste des références doit inclure <code>SKILL.md</code>."},
  {t:"warn",x:"La skill n'est pas utilisée ? (1) Le <code>name</code> est-il identique au nom du dossier ? (2) Le fichier s'appelle-t-il exactement <code>SKILL.md</code> ? (3) La <code>description</code> contient-elle des mots de votre demande ? Sinon, nommez-la explicitement dans le prompt, comme ci-dessus."},
  {t:"p",x:"Bonus : refaites tourner le Rédacteur sur une US avec la skill <code>formater-us</code> complétée, et comparez avec votre première version."}]},
 {t:"Avec ou sans skills : ce que ça change",b:[
  {t:"p",x:"Une skill n'est pas obligatoire : on pourrait tout mettre dans l'agent ou dans le prompt. Voici pourquoi c'est une mauvaise idée à partir d'une certaine taille."},
  {t:"table",h:["","Sans skills (tout dans prompts et agents)","Avec skills"],r:[
   ["Format d'une US","Recopié dans chaque prompt, chaque agent, avec des variantes","Défini <b>une fois</b> (formater-us), utilisé par tous"],
   ["Mise à jour","Il faut retrouver et corriger tous les endroits","On corrige <b>un seul fichier</b>"],
   ["Cohérence","Le Rédacteur et le Contrôleur peuvent avoir deux versions du format","Même procédure pour tous : le contrôle vérifie ce que le Rédacteur a appliqué"],
   ["Taille des agents","Longs, difficiles à relire, instructions noyées","Courts : rôle, outils, interdits. Le détail est dans la skill"],
   ["Chargement","Tout est lu à chaque fois, même si inutile","La skill n'est chargée que <b>si la tâche la concerne</b> (grâce à sa <code>description</code>)"],
   ["Réutilisation","Copier-coller entre projets","Le dossier de la skill se copie tel quel"],
   ["Relecture métier","Un chef de projet doit fouiller dans les agents","Un fichier lisible par le métier : « voilà notre méthode »"]]},
  {t:"p",x:"<b>Exemple concret :</b> le référent produit décide que le format d'US ajoute une section « Impact utilisateur »."},
  {t:"table",h:["Sans skills","Avec skills"],r:[["Vous modifiez le prompt du Rédacteur, celui du Contrôleur, l'instruction du Reviewer, le prompt de lancement… et vous en oubliez un. Résultat : une partie des US a la section, les autres non, et le Contrôleur ne le voit pas.","Vous modifiez <code>formater-us/SKILL.md</code>. Tous les agents appliquent le nouveau format dès le prochain lancement."]]},
  {t:"why",x:"Règle de répartition : <b>l'instruction commune</b> dit ce qui est vrai partout (règles, ton, limites) ; <b>l'agent</b> dit qui fait quoi ; la <b>skill</b> dit comment réaliser une tâche précise. Si vous recopiez un bloc de texte dans deux endroits, il mérite une skill."},
  {t:"no",x:"Ne créez pas une skill pour une consigne d'une ligne : une skill a un coût de lecture. Elle se justifie quand la procédure fait plusieurs étapes ou sera réutilisée."}]},
 {t:"Aller plus loin : d'autres skills possibles",b:[
  {t:"table",h:["Skill","Ce qu'elle apporte","Quand Copilot la charge (description)"],r:[
   ["<b>formuler-question-ouverte</b>","Modèle d'une question à trancher : contexte, options, impact, qui décide","« Utiliser quand une règle manque ou qu'une ND-xx est rencontrée »"],
   ["<b>decouper-us</b>","Méthode pour couper une US trop grosse (par parcours, par règle, par rôle) et les critères d'une bonne découpe","« Utiliser pour proposer le découpage d'une US volumineuse »"],
   ["<b>ecrire-criteres-acceptation</b>","Gabarit Étant donné / quand / alors, exemples bons et mauvais","« Utiliser pour rédiger ou contrôler des critères d'acceptation »"],
   ["<b>synthese-lot</b>","Format de la synthèse d'actions à destination du référent produit","« Utiliser pour résumer le traitement d'un lot »"],
   ["<b>preparer-compte-rendu</b>","Compte rendu des décisions prises en atelier, avec responsables et échéances","« Utiliser pour rédiger un compte rendu à partir de notes »"]]},
  {t:"copy",l:"Exemple prêt à l'emploi — .github/skills/formuler-question-ouverte/SKILL.md",x:"---\nname: formuler-question-ouverte\ndescription: \"Formule une question ouverte claire quand une règle métier SprintDesk manque ou qu'une décision (ND-xx) n'est pas prise. Utiliser quand une user story suppose une valeur non validée.\"\n---\n# Formuler une question ouverte\n\n## Quand l'utiliser\nUne US contient une valeur, un délai, un seuil ou un comportement absent de regles-metier.md.\n\n## Procédure\n1. Citer la phrase de l'US concernée.\n2. Chercher la règle dans regles-metier.md ; si absente, vérifier s'il existe une ND-xx.\n3. Écrire la question sous forme neutre (jamais « Doit-on utiliser X ? » avec X inventé).\n4. Indiquer qui tranche (référent produit, métier, technique).\n5. Indiquer ce qui est bloqué en attendant la réponse.\n\n## Format de sortie\n| ID | Question | Pourquoi elle se pose | Qui tranche | Ce qui est bloqué |\n\n## Interdits\n- Ne jamais proposer de valeur par défaut comme si elle était validée.\n- Ne pas réécrire l'US pour contourner la question."},
  {t:"ol",x:["Créez le dossier <code>.github/skills/formuler-question-ouverte/</code> et le fichier <code>SKILL.md</code> comme pour <code>verifier-regles-metier</code>.","Collez le contenu et enregistrez.","Testez dans un nouveau chat."]},
  {t:"copy",l:"Prompt de test",x:"Dans #file:sprintdesk/backlog/entree/lot{n}/US-{n}01.md, repère ce qui suppose une règle absente et formule les questions ouvertes correspondantes."},
  {t:"see",x:"Des questions au format du tableau, avec « qui tranche » et « ce qui est bloqué », sans valeur proposée comme décidée."},
  {t:"why",x:"Une bonne skill se reconnaît à sa <b>description</b> : elle doit dire <i>quoi</i> et <i>quand</i>. C'est elle que Copilot lit pour décider de charger ou non la skill."}]},
 {t:"Bilan final",b:[
  {t:"check",id:"c4",x:["<code>copilot-instructions.md</code> complété (sans TODO)","<code>PLAN.md</code> créé et relu","Agents : reviewer et rédacteur complétés, contrôleur créé","Skills : formater-us et revue-agilite complétées, verifier-regles-metier créée","5 US traitées avec traçabilité et questions ouvertes visibles","J'ai indiqué à l'équipe les contrôles que j'ai réellement exécutés"]},
  {t:"why",x:"Vous avez construit un <b>harness</b> : instructions (règles permanentes) + plan (contrat) + agents (rôles) + skills (savoir-faire) + validation humaine. Copilot travaille désormais dans un cadre, et non plus au hasard."},
  {t:"table",h:["Brique","Fichier","Question à laquelle elle répond"],r:[["Instructions","<code>.github/copilot-instructions.md</code>","Quelles règles sont <b>toujours</b> vraies ?"],["Plan","<code>PLAN.md</code>","Que fait-on, et comment jugera-t-on ?"],["Agent","<code>.github/agents/*.agent.md</code>","<b>Qui</b> fait quoi ?"],["Skill","<code>.github/skills/*/SKILL.md</code>","<b>Comment</b> le faire ?"]]}]}
 ]},
